# 彩野测试题库 · seg6-s8-e1（18 题）。出题纪律见 seg1-s2 题库头注。
# 受试者只看得到：①严格早于本段的 154 张卡片梗概（7299 字符）；
#   ②SEG-6（b155–166：s8s/s8f/s4s/e1s/e1f/crd）的中文译文。
# info_point 只进报告、不进受试者与判分员的提示词。
#
# ★ 出题方法本段起改变（2026-08-05）：**先只读日文原文出题，再逐条拉译文核验**。
#   此前五份题库都是读着译文出的，那有一个系统性偏差——**译文丢掉的东西，出题人压根
#   不会想到去问**，于是测试对它最该抓的失效形态失明。改法之后，题目由原文决定、
#   参考答案用译文的既有措辞（避免术语不符造成的假「错」），且核验这一步本身就是一次
#   独立的丢信息普查。**本段核验结论：18 题引用的全部事实在译文里逐条在线，零丢失。**
#
# 段绑定：前缀 154 张卡（较 SEG-5 新增 98–104/108/110/140/141/192）。关键词穷举——
#   `留学`/`留级`/`戒指`/`不良少年`/`不良教师`/`共犯`/`杏子糖`/`安眠药`/`生日礼物`/
#   `副标题`/`Staff`/`朝阳`/`浜千鸟`/`分手`/`辞职`/`合页`/`嫉妒`/`雪乃`/`ユキノ`
#   在 7299 字符的前缀里**各出现 0 次**（`背` 的 2 次是「课本背面」「ユウイチ的背影」，无关）。
#   **闸经对照验证**：3 道答案明摆在卡面上的对照题与 18 道真题混在同一次调用里跑
#   （R-A 章节5梗概→卡139、R-B 绘本三行→卡145、R-C サクラ日记9月20日→卡183）。
#   结果 **18/18 真题判「不能答」、3/3 对照题判「能答」且逐条点出卡号**，驳回理由逐题不同。
#   ⚠ **闸的卡号引用另经人工抽验 11 张，全部准确**——正是这一步查出 q5 的子句稀释
#   （详见 q5 的 info_point），闸自己没报。
