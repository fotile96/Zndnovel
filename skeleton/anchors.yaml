    - id: 16337
      jp: "【≪ユウイチ≫】「俺は、アヤノの事が、好きだ」"
      zh: "【≪Yuichi≫】「我，喜欢Ayano。」"
      recall: "定译源 voices/naoya.md 例句6（≪≫标签原样）；五年前告白的重演；16343 扩展形（另条）、s8s 16788 故事层收束形同族。"
    - id: 16343
      jp: "【≪ユウイチ≫】「俺は、アヤノの事が好きだ。ずっと好きだ。好きだった。今も……好きだ。他の誰よりも」"
      zh: "【≪Yuichi≫】「我喜欢Ayano。一直都喜欢。过去喜欢。现在也……喜欢。比其他任何人都喜欢」"
