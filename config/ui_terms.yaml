# ─────────────────────────────────────────────────────────────
# 刻意不收的词：正文里本来就没有稳定映射，收进来只会造伪报。
# 写在这里而不是靠抬阈值压掉——discovery 会跳过它们，但**理由留在明面上**，
# 日后若正文用法收敛了，可以拿这里的数字直接对比再决定是否转正。
not_terms:
  - jp: 選択
    measured: 选择 112/157（71.3%）
    why: 「選択を間違える」→「选错」等动词用法占掉近三成，不是稳定名词
  - jp: シーン
    measured: 场景 43/58（74.1%）
    why: 与 場面 混用；v26 起 場面 亦除名（语域分立，见下条），シーン 在 UI 位作「场景」由 style.md 管
  - jp: 二人
    measured: 两个人 67/107（62.6%）、两人 22
    why: 「两人／两个人／你们俩」按语气取，无定形
  - jp: 人物
    measured: 人物 57/71（80.3%）
    why: 「登場人物→登场人物」成词，单用时常化为「人／那个人」
  - jp: 関係
    measured: 关系 49/61（80.3%）
    why: 「〜に関係する」多化为「和…有关」，不保留「关系」二字
  - jp: 学校
    measured: 学校 264/282（93.6%）
    why: 同形词，无误译风险；登记它只是给闸增重
  - jp: 教室
    measured: 教室 215/215（100%）
    why: 同上，同形词
  - jp: 相手
    measured: 对方 19/41（46.3%）、对象 11、人 8、那个人 1、其余 2 化入句式
    why: >
      2026-08-28 由序章题词（event/op_*）的译文触发 discovery。最高频取值只占 46.3%，
      远低于 85% 门槛——它是个**关系词**，中文按语境取「对方／对象／来人／那个人」，
      恋爱语境常直接说「那个人」，谜题语境作「对手」。没有可对齐的定名。
  - jp: 場合
    measured: 的话 14/44（31.8%）、情况 6、时候 4、时 3、其余 17 化入句式
    why: >
      2026-08-28 由 C 类免责声明的译文触发 discovery（「症状が異なる場合があります」）。
      最高频取值只占 31.8%，远低于 85% 门槛——它是个**语法词**：中文多半把它化进
      「…的话」「若…」「可能…」等句式，或整个省掉（17/44 属此类），本就没有可对齐的
      名词性定译。与「登場」同一批被发现，但结论相反，两条各按实测走。
  - jp: 場面
    measured: 场面 45/320（14.1%）、一段 233、段落 32（2026-09-26，v26 后）
    why: >
      v26（2026-09-26）用户裁决「口径 A」：按语域分立——系统串位／教程帮助文保持「场面」
      （与烤字 UI sys_5_d/sys_5_f/sys_13_a/tut_2_b/tut_4_b/sys_1_g 同形），对白与旁白位一律段族
      （这一段／那一段／哪一段／一段／段落）。正文里「场面」只剩系统串位的 45 行，本表
      「压倒性用法」的前提对这个词不再成立，故除名而不是改 zh——改成段族会反过来要求 UI 面
      也写「一段」。UI 面的「场面」由 glossary/style.md「★ v26」节与烤字清单管；
      本表不登记即不再由 discover 重报。
