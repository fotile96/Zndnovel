    - id: 8508
      jp: "【サクラ】「さよなら、アヤノさん」"
      zh: "【Sakura】「再见了，Ayano同学」"
      recall: "GAMEOVER 恐怖显形（sakura.md §4 给出译例）：与本体同一套礼貌措辞的冻结形，「Ayano同学」称呼不变，恐怖感来自错位勿加狠话。
