# skeleton/cards.zh/batch_01.yaml — 中文卡组 batch 01（card 40–79）
# 来源：skeleton/cards.jp.yaml 同号条目中译（规程 B）；术语/人名依 glossary/glossary.v4.yaml 与 glossary/style.md（v4 召回修订已落于本批）。
# 字段与断行/结尾标记/选择卡诸约定同 batch_00.yaml 头注（每行 ≤12 全角、title ≤14 全角；
#   （おわり）→（完）、（完結）→（完结）贴行末；选项行独立成行；「の展開があり。」→「有以上分支展开。」）。
# 本批补充：
#   - 卡 41（谜题答案卡）保留「→」箭头链与两谜题间空行；链词日后与 select 选项图译文统一。
#   - 卡 61 原卡（完結）独行且非整数缩进，中文重排后统一按贴行末处理。
#   - 卡 40/70 标题依 plotTitle 不带句尾句号（卡面多句号差异见 jp 侧 note）。
#   - 卡 74 右栏第二标签为「探索」（zh 侧无 section_label 字段，记于 tr_note）。

- card: 40
  variant: "a"
  title_zh: "对ユウイチ嘛……"
  body_zh: "アヤノ回答サクラ说，对ユ\nウイチ谈不上喜欢，也谈不\n上讨厌。"
  tr_note: "标题依 plotTitle 无句尾句号（卡面实为「……。」，差异记于 jp 侧 note）；「ユウイチのことは……」以「嘛……」再现支吾拖音，与卡 38「含糊其辞」选项的结果卡定位相合。"
- card: 41
  variant: "a"
  title_zh: "选择：谜题"
  body_zh: "正确答案：\n「女孩」\n普通的家→父母→被关起来\n\n「画作」\n没有问题→原作→赝品"
  tr_note: "谜题语境依 s2s_190_sel 系列：女孩题＝所见惊人光景其实是「普通的家中景象」、起因是父母（她自幼被关在阁楼）；画作题＝赝品做工没有问题、原因出在原作（原作本身是赝品）。「→」箭头链与两题间空行依原卡；日文「→ニセモノ」因行宽折行，中文一行排下不再折；链词日后与 select 选项图译文统一。"
- card: 42
  variant: "a"
  title_zh: "谜题答错"
  body_zh: "谜题答错了。没影响到咒语\n就好了……。"
  tr_note: "「……ばいいんだけど」→「……就好了」，与卡 62 成对。"
- card: 43
  variant: "a"
  title_zh: "出去玩的地方"
  body_zh: "ユウイチ问アヤノ：周末要\n去哪里玩，决定好了吗？加\n上咒语的事，アヤノ不由得\n有点在意起ユウイチ来。"
  tr_note: "原卡第 2 行「？」后即断行系日文版式，中文重排不沿用。"
- card: 44
  variant: "a"
  title_zh: "选择：出去玩的地方"
  body_zh: "「游泳池」\n「天文馆」\n有以上分支展开。"
  tr_note: "プラネタリウム→天文馆（取口语常用名；如终裁改「天象馆」需连动卡 46/60）。"
- card: 45
  variant: "a"
  title_zh: "游泳池的约定"
  body_zh: "アヤノ约好和ユウイチ一起\n去游泳池玩。"
  tr_note: ""
- card: 46
  variant: "a"
  title_zh: "天文馆的约定"
  body_zh: "アヤノ约好和ユウイチ一起\n去天文馆玩。有一点怀念的\n感觉。"
  tr_note: ""
- card: 47
  variant: "a"
  title_zh: "图书室"
  body_zh: "放学后。アヤノ去图书室，\n从サクラ那里学到了咒语。"
  tr_note: ""
- card: 48
  variant: "a"
  title_zh: "选择：放学后的咒语"
  body_zh: "「看着夕阳听歌」\n「课本背面写名字」\n「橡皮上写名字」\n有以上分支展开。"
  tr_note: "第 2/3 项「…に名前」补出动词「写」；第 3 项与卡 50 标题同词。"
- card: 49
  variant: "a"
  title_zh: "咒语，成功了……？"
  body_zh: "试着做了咒语，却总觉得好\n像哪里不太对……。"
  tr_note: "「ハズしているような気もする」→「总觉得好像哪里不太对」，不点破选错咒语。"
- card: 50
  variant: "a"
  title_zh: "橡皮上写名字"
  body_zh: "为了实现愿望，アヤノ做了\n「把橡皮从套子里取出、写\n上心上人的名字再装回去」\n的咒语。"
  tr_note: ""
- card: 51
  variant: "a"
  title_zh: "选择：咒语的效果"
  body_zh: "「绝对灵验」\n「多半……」\n「做了也不亏吧」\n有以上分支展开。"
  tr_note: "「絶対に効く」→「绝对灵验」依 glossary 定式；三项分别与卡 52/53/54 标题同词根；第 3 项「無い」与卡 54 标题「ない」的写法差异中文不再现。"
- card: 52
  variant: "a"
  title_zh: "觉得绝对灵验"
  body_zh: "アヤノ觉得咒语「绝对灵\n验」。"
  tr_note: ""
- card: 53
  variant: "a"
  title_zh: "觉得多半灵验"
  body_zh: "アヤノ觉得咒语「多半灵\n验」。"
  tr_note: "「たぶん」统一作「多半」（标题/引语与卡 51 第 2 项同词）。"
- card: 54
  variant: "a"
  title_zh: "觉得做了也不亏"
  body_zh: "アヤノ觉得咒语「做了也不\n亏」。"
  tr_note: ""
- card: 55
  variant: "a"
  title_zh: "咒语完成"
  body_zh: "咒语，能做的都做了。能有\n个好结果就好了。"
  tr_note: ""
- card: 56
  variant: "a"
  title_zh: "回荡在走廊的声音"
  body_zh: "一到走廊上，就听见不知从\n哪里传来的叫声。中庭围满\n了人。不知怎么，有种不好\n的预感……　　　　（完）"
  tr_note: "「嫌な予感」→「不好的预感」与卡 23「不好的结果」用字一致；（おわり）→（完）贴行末，前导空格按中文行宽重算。"
- card: 57
  variant: "a"
  title_zh: "ユウイチ的背影"
  body_zh: "做完咒语来到走廊，看到ユ\nウイチ正走在走廊上。跟在\nユウイチ身后，来到天台。\nユウイチ张开双臂，从天台\n向下……　　　　　（完）"
  tr_note: "前半与卡 58 逐字共句；原卡（おわり）独行右对齐，中文重排后按贴行末规则处理。"
- card: 58
  variant: "a"
  title_zh: "夜晚的走廊"
  body_zh: "做完咒语来到走廊，看到ユ\nウイチ正走在走廊上。跟在\nユウイチ身后，来到天台。\nアヤノ敲了下他的头，ユウ\nイチ便恢复了意识。"
  tr_note: "前半与卡 57 逐字共句。"
- card: 59
  variant: "a"
  title_zh: "游泳池"
  body_zh: "周末，アヤノ和ユウイチ去\n游泳池玩了。途中ユウイチ\n看到一家店，却不自然地避\n开了。"
  tr_note: ""
- card: 60
  variant: "a"
  title_zh: "天文馆"
  body_zh: "周末，アヤノ和ユウイチ去\n天文馆玩了。放映结束时，\nアヤノ却不知为何流着眼\n泪。"
  tr_note: ""
- card: 61
  variant: "a"
  title_zh: "咒语的效果"
  body_zh: "后来，ユウイチ对アヤノ说\n起自己做过的「不可思议的\n梦」。天台上，家家开始亮\n起灯火。　　　　（完结）"
  tr_note: "（完結）→（完结）；原卡该标记独行且非整数缩进（jp note），中文重排后统一按贴行末处理。"
- card: 62
  variant: "a"
  title_zh: "谜题答对"
  body_zh: "谜题答对了。这下「咒语」\n能成功就好了。"
  tr_note: "「オマジナイ」引号依原卡保留；「……ばいいんだけど」→「……就好了」与卡 42 成对。"
- card: 63
  variant: "a"
  title_zh: "サクラ的叹息"
  body_zh: "听了アヤノ的回答，サクラ\n叹了口气。"
  tr_note: ""
- card: 64
  variant: "a"
  title_zh: "午休的走廊"
  body_zh: "アヤノ和サクラ在走廊说\n话。サクラ问アヤノ知不知\n道「楼梯的传闻」。"
  tr_note: "原卡「ウワサ」」后省「を」（jp note），中文语序天然不显此缺格。"
- card: 65
  variant: "a"
  title_zh: "选择：楼梯的传闻"
  body_zh: "「告诉我」\n「不知道」\n有以上分支展开。"
  tr_note: ""
- card: 66
  variant: "a"
  title_zh: "选择：颇有意思的传闻"
  body_zh: "「告诉我」\n「不听」\n有以上分支展开。"
  tr_note: "「教えて」与卡 65 第 1 项同词；「興味深い」→「颇有意思」。"
- card: 67
  variant: "a"
  title_zh: "选择：传闻是指"
  body_zh: "「闹鬼楼梯」\n「没什么兴趣」\n「不知道」\n有以上分支展开。"
  tr_note: "第 1 项依 glossary お化け階段→闹鬼楼梯，与卡 69 标题同词；第 2 项与卡 68 标题呼应。"
- card: 68
  variant: "a"
  title_zh: "对传闻没兴趣"
  body_zh: "アヤノ回答说对传闻没兴\n趣，サクラ轻轻叹了口气。\n随后，又迎来平静无事的日\n常。　　　　　　　（完）"
  tr_note: "标题「ない」/正文「無い」写法之别中文不再现；「何事もない日常」→「平静无事的日常」与卡 19/31 呼应；（おわり）→（完）贴行末。"
- card: 69
  variant: "a"
  title_zh: "闹鬼楼梯"
  body_zh: "是闹鬼楼梯的事？这么一\n问，サクラ点了点头，向ア\nヤノ说明了楼梯的传闻。"
  tr_note: "标题「お化け」/正文「おばけ」写法之别不再现；原卡全角「？」后的半角空档系日文版式，中文不保留。"
- card: 70
  variant: "a"
  title_zh: "选择：传闻的事……"
  body_zh: "「认真打听」\n「随口打听」\n「姑且问问」\n有以上分支展开。"
  tr_note: "标题依 plotTitle 无句号（卡面实渲染多一全角句号，差异记于 jp 侧 note）；「ウワサ話を……」宾语悬置，译「传闻的事……」保留未尽；三项与卡 73/71/72 标题同词。"
- card: 71
  variant: "a"
  title_zh: "随口打听"
  body_zh: "向同学打听楼梯的传闻。随\n口一问，アヤノ反被数落了\n一顿。"
  tr_note: ""
- card: 72
  variant: "a"
  title_zh: "姑且问问看"
  body_zh: "向同学打听楼梯的传闻。姑\n且……这么问了问，却毫无\n下文。"
  tr_note: "「なしのつぶて」→「毫无下文」；「姑且……」悬置依原卡「とりあえず……」。"
- card: 73
  variant: "a"
  title_zh: "认真打听"
  body_zh: "向同学认真打听楼梯的传\n闻。得到情报：或许是暑假\n里参加社团活动的孩子经历\n的。"
  tr_note: ""
- card: 74
  variant: "a"
  title_zh: "探索：放学后的学校"
  body_zh: "放学后，为传闻之事在学校\n里探索。从保健老师和ユカ\nリ老师那里得到情报。途\n中，看到了在校内走动的ユ\nウイチ。"
  tr_note: "右栏第二标签为「探索」（本批唯一非「あらすじ/選択肢」者）；「放課後のウワサについて」按时间状语理解（放学后就传闻探索学校，与标题及 s3 流程相符）；保健の先生→保健老师。"
- card: 75
  variant: "a"
  title_zh: "选择：ユウイチ的身影"
  body_zh: "「跟上去」\n「不管他」……\n有以上分支展开。"
  tr_note: "第 2 行「」后紧接「……」依原卡版式（中间无空格）；两项与卡 79/76 标题同词。"
- card: 76
  variant: "a"
  title_zh: "不管他"
  body_zh: "决定先不管ユウイチ，去小\n菊那里。"
  tr_note: "标题假名「ほうって」/正文汉字「放って」之别不再现，中文同用「不管」；きくちゃん→小菊（glossary v2 暂定）。"
- card: 77
  variant: "a"
  title_zh: "田径部的传闻"
  body_zh: "从小菊那里确认了流传在田\n径部的传闻。传闻是真的。"
  tr_note: ""
- card: 78
  variant: "a"
  title_zh: "选择：要去的地方"
  body_zh: "「去图书室」\n「去楼梯那边」\n有以上分支展开。"
  tr_note: ""
- card: 79
  variant: "a"
  title_zh: "跟上去"
  body_zh: "アヤノ跟在ユウイチ身后。\nユウイチ好像进了图书室。"
  tr_note: ""
