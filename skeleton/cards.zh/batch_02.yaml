# skeleton/cards.zh/batch_02.yaml — 中文卡组 batch 02（card 80–119）
# 来源：skeleton/cards.jp.yaml 同号条目中译（规程 B）；术语/人名依 glossary/glossary.v4.yaml 与 glossary/style.md（v4 召回修订已落于本批）。
# 字段：card(int) / variant("a") / title_zh / body_zh / tr_note
# 约定（承 batch_00）：
#   - body_zh 每行 ≤12 全角字宽，行间以 \n 相接（双引号标量，\n 为换行转义）；
#     中文重排不跟随日文断行点，允许词内断行（同 batch_00 体例）。title_zh ≤14 全角字宽。
#   - 结尾标记两制保留：（おわり）→（完）、（完結）→（完结）；末行垫全角空格贴行末（12 字宽），
#     排不下时独占一行右对齐（前导空格数按中文行宽重新计算）。
#   - 选择卡：选项行独立成行并保留「」；末行「の展開があり。」→「有以上分支展开。」。
#   - 人名分层依 v2 裁决：故事层片假名原样（アヤノ/ユウイチ/サクラ/ユカリ/ナオヤ），现实层汉字（直哉，卡 112）。
#   - 关键词卡（95–97/105–107/109/114–117/119，右栏「キーワード」）用简短名词解说腔。
#   - 本批特记：卡 93 为日记体（アヤノ的回信）；卡 94 为无字插画卡（body_zh 空串）。
# v19 修订（2026-08-19）：故事层人名罗马音化（Ayano/Yuichi/Yukari/Sakura…）+ 天文馆→天象馆已落于 title_zh/body_zh；tr_note 保持历史原文。涉名流式 body 经 tools/zh_wrap（jieba）重排（宽 12 全角），结构卡逐行替换保结构。

- card: 80
  variant: "a"
  title_zh: "亲吻"
  body_zh: "在图书室，目击到Yuichi\n和Yukari老师亲吻的一幕。"
  tr_note: "口づけ→亲吻、キス（卡 89–91）→接吻：两词并存时以文白之别分译。"
- card: 81
  variant: "a"
  title_zh: "章节 3：Ayano"
  body_zh: "章节 3的主人公是\n「Ayano」"
  tr_note: "同卡 10/36 体例：セクション→章节（「章节」＋半角数字＋全角冒号）；「アヤノ」后无句号照搬。"
- card: 82
  variant: "a"
  title_zh: "飞奔离去的Ayano"
  body_zh: "回过神来，Ayano已经身\n在教室。记忆模糊不清。"
  tr_note: "気がつくと→回过神来，与卡 24 同译。"
- card: 83
  variant: "a"
  title_zh: "前往楼梯"
  body_zh: "在楼梯上，Ayano听见\n了Yuichi的声音。"
  tr_note: ""
- card: 84
  variant: "a"
  title_zh: "Yuichi的手"
  body_zh: "Ayano甩开Yuichi，\n向天台走去。"
  tr_note: ""
- card: 85
  variant: "a"
  title_zh: "天台"
  body_zh: "天台上有「Sakura同学」。\nSakura对Ayano步步进逼。\nAyano离开天台走下楼梯，\n楼梯却「没有尽头」然后，\nAyano从天台上……　　\n　　　　　　　（完）"
  tr_note: "「サクラ同学」引号照搬（称呼同卡 25）；步步进逼与卡 28 同译；原卡「終わらない」」后无标点直接接「そして」，中文照搬（「没有尽头」然后）；（おわり）→（完）独占末行、前导 9 全角空格右对齐（按中文行宽重算）。"
- card: 86
  variant: "a"
  title_zh: "与Yuichi前往楼梯"
  body_zh: "楼梯。Ayano向Yuichi\n说起传闻，Yuichi却\n不当回事。中途Ayano\n在楼梯上失去平衡，\n被Yuichi一把抱住。"
  tr_note: ""
- card: 87
