  body_zh: "Ayano慌忙抽身离开\nYuichi。Yuichi\n说他要去图书室。"
  tr_note: "标题与卡 87 选项同字面。"
- card: 93
  variant: "a"
  title_zh: "Ayano的回信：9月25日"
  body_zh: "Sakura酱，最近好吗？\n对了对了，Yuichi来\n探病的那天，还记得吧！"
  tr_note: "日记体（アヤノ的回信），随信件口吻；サクラちゃん→小サクラ（style.md 称呼表）〔v23 起全族改「～酱」，本卡作 Sakura酱〕；「元気？」后原卡半角空格系日文版式，中文不保留；标题全角９２５照搬。〔v25（2026-09-23）：末句「的那天，真的有过呢！」→「的那天，还记得吧！」——原文「〜日、あったね！」是回信开场唤起共有记忆（9/16 那天 Sakura 也在场），不是在确认此事真实；「真的」会让读者误以为探病的真实性有疑问。换行按烤字输出「Yuichi来／探病的那天」（v21 所见即所得口径）〕"
- card: 94
  variant: "a"
  title_zh: "谁都没见过的晚霞"
  body_zh: ""
