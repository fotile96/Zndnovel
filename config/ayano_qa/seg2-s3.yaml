# 彩野测试题库 · seg2-s3（18 题）。出题纪律见 P3 devwave1 plan Task 8 与 seg1-s2 题库头注。
# 受试者只看得到两样东西：①严格早于本段的卡片梗概（s0f/s1s/s1f/s2s/s2f，每张约 28 字）；
#   ②SEG-2（b63–90：s3s/s3fa/crd）的中文译文。所有标准答案都必须能仅凭这两样推出。
# info_point 只进报告、不进受试者提示词（ayano_test 只发 ctx + question），故可写元信息。
# 严禁剧透 s3 之后的真相——本题库由「只看得到前缀卡 + 本段译文」的模型生成，
#   与受试者同源，**结构上不可能剧透它自己也不知道的后文**（同卡组前缀按章过滤的原理）。
#
# 段绑定（终审 I4 的失效模式）：拿别段题库跑本段会静默 rc=0 全绿，因为上一段的
#   答案往往整张躺在本段前缀卡里。除 load_qa 的 segment 校验外，本题库另跑过一道
#   **机械闸**：让一个只看得到卡片梗概、看不到本段正文的受试者去答这 18 题——
#   18/18 判「不能答」，且每条都点得出具体卡号。
#   该闸本身也做了对照验证（否则「全部通过」可能只是闸不会响）：混入 3 道答案明摆在
#   卡片上的对照题（章节1主人公→卡10、赌约请吃汉堡→卡3、天台等了5年→卡27），
#   3/3 被正确判为「能答」且答案准确。闸会响，故 18/18 的结论可采信。
#
# 人工核对状况（如实记录，未逐条全核）：q1/q3/q7/q14/q15/q17/q18 的标准答案已比对
#   本段译文原句；其余各题依据出题者自述的场景定位，未逐句复核。q17 经核对后已人工
#   改写（原稿把直哉的内心独白误记为由加里的台词）。
segment: seg2-s3
questions:
  - id: q1
    question: "故事开头，Ayano站在走廊时，认为Yuichi午休后早退的真实原因是什么？"
    reference: "她认为Yuichi所谓“身体不舒服”只是翘课的借口；他刚才午饭还狼吞虎咽，身体不可能不舒服。"
    info_point: "开场走廊的心理独白；如果译文把“翘课借口”译成“真的病了”，读者会对Yuichi的形象判断错误。"

  - id: q2
    question: "Sakura为什么不在教室，而是到走廊来找Ayano？"
    reference: "因为午休刚结束的教室人多、热闹，她身体不太好，不习惯人多的场合；在人多的地方会疲劳，所以想待在走廊。"
    info_point: "Sakura登场动机；译成“她讨厌上课”会让角色逻辑失准。"

  - id: q3
    question: "关于“闹鬼楼梯”，Ayano说流传的传闻有哪些？"
    reference: "从楼梯那边能听见奇怪的声音、每爬一次台阶的数目都对不上、看见了可疑的人影。"
    info_point: "楼梯怪谈线的核心定义；如果译文把三个传闻译落或译混，后续调查的靶子就错了。"

  - id: q4
    question: "Sakura是从哪里听说楼梯传闻的？她还提到什么限制？"
    reference: "她常去的医院里有一位护士，是这所学校毕业的校友；护士说当年学生时代发生过不少事。她想联系当年听见声音的人，但护士拒绝了，说出于好奇心去多管闲事不好，因为有人后来一度不能来学校。"
    info_point: "楼梯怪谈线的信源；如果信源译成“朋友/老师”，调查的可信度就崩了。"

  - id: q5
    question: "据护士的回忆，当年学生从楼梯听见的“声音”具体是什么？"
    reference: "是非常哀伤的呻吟声，像“救救我……救救我！”，渐渐变成尖叫；只有那一次有人听见，后来去确认的学生没有听到像样的声音；但亲耳听到的学生断言确实听见了。"
    info_point: "怪谈核心内容；若把“呻吟/尖叫/只有一次”的层次译丢，恐怖氛围和传闻逻辑都受影响。"

  - id: q6
    question: "Sakura在走廊提起楼梯传闻时，要让故事继续推进，Ayano应该怎么回应？"
    reference: "她不能只回答“不知道”或表现出没兴趣，而应该选择对Sakura说“告诉我”；Sakura这才接口“对，就是闹鬼楼梯的事”，开始说明传闻。"
    info_point: "s3s_50_sel→s6 跨章门控选择；若把“告诉我”与“不知道”的条件译反，读者无法判断分支。"

  - id: q7
    question: "Ayano向同学打听楼梯传闻时，前两次为什么没能推进？"
    reference: "“随口打听”和“姑且问问看”两个选项都会导致相似的失败展开：同学没有被认真对待，对话结束，故事推进不下去；必须改为“认真打听”才能真正问到情报。"
    info_point: "s3s_300_sel→s4 的门控；若把选项态度译得轻重不分，选定条件就失效。"

  - id: q8
    question: "在认真打听成功的场景里，同学们根据传闻推测事件发生在什么时候？"
    reference: "他们推测是夏天的夜里；因为“夏天夜里十几个人一起听见”，可能是暑假体育社团集训住在学校时发生的，所以建议去问老师。"
    info_point: "同学讨论给出的时间线；若把“夏天夜里/社团集训”译丢，后面Yukari建议找田径部就无法衔接。"

  - id: q9
    question: "Ayano向保健室老师提起楼梯传闻时，老师的态度有什么变化？"
    reference: "老师的温和笑容消失，露出吃惊的表情；先说“那种事我连听都没听说过”，随后又劝她不要到处打听，说有同学会害怕、怕惹出风波。"
    info_point: "教师访问线的关键反应；若把“没听说过”和“别打听”的先后与层次译乱，会误读为老师真的不知道。"

  - id: q10
    question: "Yukari老师对楼梯传闻知道多少？她给了什么建议？"
    reference: "她说自己没听说过，老师之间也没传过；不过听到“暑假集训留宿”后，建议去问田径部的同学，因为地区大赛临近，暑假可能有强化集训。"
    info_point: "调查推进转折：Yukari老师的线索把Ayano引向小菊；译丢“田径部”就失去动机。"

  - id: q11
    question: "小菊是怎么知道楼梯传闻的？她补充了什么情况？"
    reference: "她是听田径部的前辈说的；前辈们以前集训住校时经历过，一开始被当错觉，后来“我也听见了”的人越来越多，还有人身体不舒服；之后集训有一阵子改到别处办，现在又回学校了。"
    info_point: "楼梯怪谈线的实证来源；若把“前辈/集训”译错，调查结论会变。"

  - id: q12
    question: "小菊认为保健室老师为什么不愿告诉Ayano？"
    reference: "因为当年不少学生听见声音后身体不舒服，最先去的应是保健室；而且当中有的同学不愿再让人提起这件事；老师必须保护那个学生，所以才会回避。"
    info_point: "人物动机题；若把“保护孩子”译成“多一事不如少一事”，保健老师的善意就被抹掉。"

  - id: q13
    question: "直哉在整理走廊上看见Yuichi的场面时，为什么决定采用“不管他”的展开？"
    reference: "他做“跟上去”的梗概时，觉得它和章节２中Yuichi背影/走廊的场面很像，后续有不好的预感（后来通向图书室目击和Bad End），所以选择了不去跟。"
    info_point: "跨章门控：跟上去 vs 不管他；若把“和章节2很像/不好的预感”译模糊，选择理由就没了。"

  - id: q14
    question: "在“跟上去”的坏展开里，Ayano在图书室目击到了什么？"
    reference: "她看见Yuichi和Yukari老师两个人抱在一起，Yuichi说“……对不起，老师”，Yukari回应“……Yuichi君”，看起来是在接吻；她大受冲击，踉跄着离开图书室。"
    info_point: "s3s_620/641_sel 分支的关键后果；若把“接吻/抱在一起”或人物身份译错，后续对Yuichi的回避就不可理解。"

  - id: q15
    question: "在与Yuichi一起看烟花的章节3A结局里，Yuichi说自己忘掉的事可能是什么？两人最后做了什么？"
    reference: "Yuichi说自己忘掉的事可能是“烟花和Ayano”；他说能和Ayano一起看真好。最后Ayano问“闭上眼睛的话，烟花还看得见吗？”，Yuichi回答说大概还能看见光，并把手掌轻轻覆在Ayano的手掌上。"
    info_point: "章节3A的情感高潮；若把“忘掉的是烟花和Ayano”或“手掌相覆”译丢，好结局的落点就没了。"

  - id: q16
    question: "直哉和彩野在现实层讨论中，认为故事里的保健室老师是怎样的存在？"
    reference: "他们认为这位任职很久的保健室老师在现实中并不存在；他们上学时的保健室校医大概20多岁，没怎么说过话，因此这位老师基本是彩野的创作。"
    info_point: "s3fa现实层与故事层区分；若把“现实中不存在”译成“现实中的老师”，会混淆层次。"

  - id: q17
    question: "直哉事后向由加里老师确认什么？老师如何回答？"
    reference: "老师承认那个场面是现实中真实发生过的事——直哉问「这是『真的』发生过的事吗？」，她答「是啊」，并说「是事实。是『真的』发生过的事」，还提到「我们自己毫无自觉」。随后她反问直哉「你不知道吗？ 我和Yuichi君的关系」，但没有把那是什么关系说出口，只是连声道歉、说「你想问什么我明白，可是，对不起」，接着请求「能不能，让我一个人待一会儿？」，跌坐进椅子、用手遮住脸低声啜泣。"
    info_point: "s3fa 现实层与故事层咬合的关键：由加里承认图书室场面属实。**原文在「是什么关系」上刻意留白**（『那样的关系』是直哉的内心独白，不是她的台词），译文若替她把话挑明，就违反全知纪律第 2 条、提前消解了悬念。"

  - id: q18
    question: "千秋在回家路上告诉直哉，姐姐说过关于那所学校的什么话？"
    reference: "姐姐说，在那所学校的天台上能看到“谁都没见过的晚霞”；姐姐的病房能看到那所学校，是看着学校说的。"
    info_point: "s3fa现实层新线索；若把“谁都没见过的晚霞/天台”译失，后续连接天台、坠楼的拼图就缺一块。"
