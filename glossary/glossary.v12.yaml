        zh: 直哉（维持汉字）
      - id: 15687
        jp: あやのさん（サクラ 语体崩解到极点，无行内对照）
        zh: アヤノ同学
        obsolete: 『あやの同学』—— v12 起旧文本作废、勿沿用
      - id: 16400
        jp: あやの……彩野さん（有行内两形对照，属 v10 本条覆盖范围）
        zh: 彩野……彩野同学
        note: 两形都转写为常规记法，柔软语气由「尚未出口的『同学』」承载

  - id: section-writing-variant
    title: 术语表词的日文书写变体一律统一到定译（v11 判别线修订，patch 早已落地）
    decided_by: user
    date: 2026-08-05
    note: 用户在抽读 gate 已裁定 16469 并落 patch，本版负责修订判别线，否则与 1600 的先例表面打架。
    revision: >
      v11 立的「异形落 UI 型系统串→可统一／落叙事文本→不修复」判别线，管的是
      **同一结构孪生族内的异形**（1598–1604 那种同函数体、七行完全孪生）。
      它**不管「术语表词的日文书写变体」**——同一个概念在原文里有假名／全角拉丁／汉字等多种写法时，
      **一律映射到该词在 active.json 里的同一个中文定译，与它落在 UI 串还是叙事文本无关**。
      `セクション` 与 `Ｓｅｃｔｉｏｎ` 是同一个词的两种写法，故 16469『Ｓｅｃｔｉｏｎ４』→『章节４』成立，
      虽然它是直哉的台词（叙事文本）。
      判据一句话：**先问「原文这两种写法是不是同一个词」——是，就统一到定译；不是，才轮到 UI／叙事判别线。**
    not_affected: >
      同句里的 `『Ｔｒｕｅ Ｃｏｌｏｒ』` 保持全角不动——它是作品名，走「正文字宽随原文」，
      不是术语表词的书写变体。16427/16428 的 `セクション４Ｂ／３Ｂ` 与之并存不冲突：原文本就是同一个词。
      **v11 列出的「维持不修复」既有例（两封信、スキヤキ/しゃぶしゃぶ、ベンチ/椅子 等）一律不受本次修订影响**
      ——它们全部是「不同的词」，不是同一个词的书写变体。

