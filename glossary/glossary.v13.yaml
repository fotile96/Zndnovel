  - id: inner-voice-overrides-line-form
    title: 心声侵入叙述 优先于 行形式判归
    decided_by: user
    date: 2026-08-05   # 抽读 gate 裁定，本版只负责落成体例
    scope: 0 行回改
    case:
      id: 4298
      jp: どうやら正解みたい、ね。
      zh: 看来，是猜中了呢。
    rule: >
      当一个**形式上无【】的叙述行**里出现了明显属于角色心声的终助词／语气成分
      （`、ね`／`、な`／`……か` 等），按**心声行**处理、保留语气词，
      而不适用 `voices/*.md` 的「叙述句零语气词」条。
    rationale: >
      4298 形式上是叙述行，按 `voices/yukari.md` §4 应脱掉「呢」；但 `、ね` 是她的心声侵入叙述，
      脱掉会把这行读成客观陈述、丢掉她自问自答的语气。用户裁定保留「呢」。
      这是叙述声音一节此前**没有的判据**，成条以免下段同类行逐次重判。

