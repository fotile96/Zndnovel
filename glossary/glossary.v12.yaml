      16685『有一件事想托她带话』/16686『非常重要的事』/16687【ナオヤ】「あと。ユウイチに、よろしく」/
      16688【ユキノ】「……嗯。我会转达的」。即直哉把 ユウイチ 送来的那句话**原样送回**。
      两处都是「托第三人带的最后一句话」，中文不同形则回环断掉。16687 尚未入线，故现在定名零成本；
      等 s8f 入线再定，15353 已固化、只能回改。
