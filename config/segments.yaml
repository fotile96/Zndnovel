# P3 检查段切分表（spec §2）：opus 侦察全量余下 304 批（b36–339）按章切 9 段
# （seg 1–9，与下方每条的 label 前缀数字一一对应）。
#
# 2026-08-07 P4 seg2-prep 补：b1–35（116282 jp_chars、4282 行，P2 试点批次遗留、
# P3 建表时"只切余下 304 批"而从未纳入本表的开头整块）补成新段 **seg: 0**
# （label: seg0-s0-s1）。
#
# 为什么是 seg:0、不是把其余 9 条 seg 字段整体 +1、新段占 seg:1（首次提交时
# 这么做过，用户复核后指出问题、二次修正为现在这版）：
#   - `seg` 字段在代码里纯粹是**序数**，只在 `tools/ayano_test.py` 的两处参与
#     数值比较：`_chapter_max_seg()` 里 `max(out.get(ch, 0), s["seg"])`、
#     `is_before_cur_seg()` 里 `chapter_max_seg[ch] < cur_seg`（反剧透卡组前缀
#     过滤，判定"这一章是否严格早于当前段"）。`0 < 1 < 2 < … < 9` 单调递增，
#     新段在游玩顺序上早于原全部 9 段这条语义完全不需要新段去占 `seg:1`——
#     排在最前面用 0 表达就够了。
#   - 原 9 段的 `label` 字符串已被 `pilot/polish/<label>/`（已有完整生产产物）、
#     git tag `prod-opus-<label>-done`、`config/ayano_qa/<label>.yaml`、
#     docs/ops/*.md 里全部既有 handoff/台账等大量引用，**不能改名**。首次提交
#     把新段占了 `seg:1`、原 `seg1-s2` 被迫挤成 `seg:2` 而 label 文字不变，
#     于是 "seg1-s0-s1"（新段）与 "seg1-s2"（原段）两个 label **同时自称
#     "seg1"**——「SEG-1」在项目里有了两个所指，是命名歧义的具体案例
#     （用户在最初派单时提醒过"label 会用作目录名、别用会引起歧义的名字"，
#     首次提交没接住，现已改正）。
#   - 用 `seg:0` 后，`seg N ↔ label segN-…` 对全部 10 条都成立，不再有任何
#     两个 label 共享同一个"seg 数字所指"；
#     `tests/test_segments.py::test_seg_field_matches_label_prefix_number`
#     把这条约束钉成机械闸。
#
# 段完成 = 机检全绿 + 用户按 review_focus 抽读 + git tag prod-opus-<label>-done + 段末小裁决。
# jp_chars / batches 区间 / chapters / 段内 lane 唯一，全部由 tests/test_segments.py
# 对 data/batches.jsonl 锁定。
# chapters 是该段的**实算**章别集合（含 crd——正文段里章节梗概卡批次与剧本批次交错，
# 抽读范围认知必须包含它们）。extra 轨的「章别」是源 lua 脚本名，故 seg8-extra 的
# 列表很长；这是实况，不是可以省略的装饰。
