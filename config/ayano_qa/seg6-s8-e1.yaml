# review_focus 覆盖：
#   ✅ s8 黎明结局 → q1（16788 告白锚点＋16790 的人称破绽）/q2/q3/q4
#   ✅ 五年后尾声与『Ｔｒｕｅ Ｃｏｌｏｒ，』逗号 → q9
