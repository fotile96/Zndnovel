segment: seg4-s3tail-s5
questions:
  - id: q1
    question: "绘本《总有一天你会看到的故事。》开头，孩子是因为什么被父母叹气，还被妈妈用「妖怪纳哈梅」吓唬的？"
    reference: "孩子不肯吃完胡萝卜（「胡萝卜又吃不完」）、大半夜吵个不停（电视太好看了）、游戏一直玩个没完。妈妈叹气说他不听话的坏孩子，半夜会有可怕的东西来，「妖怪纳哈梅就要找上门」。孩子却不信，笑着说「纳哈梅一点儿都不可怕，其实根本就没有这妖怪」。（爸爸叹气的内容也对：胡萝卜吃不完/半夜吵/游戏玩太久）"
    info_point: "绘本「１」开头家庭场景。译歪了（比如把吓唬者译成别的角色、或把「纳哈梅」的来源译成真的怪物）会影响对全篇因果的理解。"

  - id: q2
    question: "绘本里，孩子逃进学校后躲在哪里？纳哈梅是怎么发现他的？"
    reference: "孩子躲进了一间教室的课桌底下。纳哈梅出现在教室，说「原来在这里被我找到啦」并揭示「时钟的时间早被我停住了」——孩子以为那个坏掉的、指针停留在明天0点的时钟，其实是被纳哈梅停住的，所以纳哈梅能找到他。"
    info_point: "绘本「２」学校段落的核心因果：时钟停止＝纳哈梅的圈套。若译文把「时钟的时间被我停住」译成「时钟自己坏了」，关键机制就丢了。"

  - id: q3
    question: "绘本里，「你」和孩子是怎样让纳哈梅消失的？"
    reference: "「你」把时钟甩给孩子，孩子接住时钟、用衣服把钟面上的血擦干净，然后摆弄时钟，把「上午和下午」对换过来——于是夜晚一下子结束，变成中午12点以后，阳光普照。纳哈梅的弱点是太阳底下（怕阳光），发觉「假话要被发现了」，身体像沙子一样化开消失了。"
    info_point: "绘本「３」高潮关键转折：把上午/下午换过来→太阳→纳哈梅弱点。译错时间转换逻辑，胜利方式就不成立。"

  - id: q4
    question: "绘本里，在天台上「你」为了让那孩子逃走，做了什么？自己付出了什么代价？"
    reference: "「你」对孩子说「那家伙由我在这里拦住 / 你朝着出口快逃出去」，然后自己朝纳哈梅冲过去。纳哈梅抓住「你」的手臂，说「爱出风头真有你的」「就先从手臂开始吃吧」，在手臂上抓了一下，看着流出来的血舔了下嘴——「你」的手臂被弄伤流血，血还滴到时钟钟面上（钟面变红）。"
    info_point: "绘本「３」天台对决的牺牲细节。翻译上「被抓住手臂／流血／钟面变红」若简化或模糊，「你」如何受伤、血为什么在钟上就解释不清。"

  - id: q5
    question: "绘本最后的结尾，孩子是在哪里醒来的？最后一行写着这个故事是送给谁的？"
    reference: "孩子听到爸爸的声音，慢慢睁开眼睛，发现爸爸正背着自己走在回家的路上，天上挂着美丽的晚霞，爸爸哼起了歌，孩子也跟着唱起来。最后一行是：「这就是给你的故事。给已故的父亲、和你的故事。」——故事是给已故的父亲和「你」的。"
    info_point: "绘本「３」结尾的收束与落款。「给已故的父亲」这个信息点若译丢，绘本与直哉/彩野身世的关联就断掉了。"

  - id: q6
    question: "サクラ第一次在深夜呼吸困难时，心里为了什么犹豫？她最后做了什么？"
    reference: "她耳鸣、喉咙烧灼、无法好好呼吸，觉得可能是傍晚在外面待久了。她本想按呼叫铃叫护士，但又想到「上次也是……深更半夜的，明明已经把护士小姐叫起来过了」，不想再给人添麻烦，于是把伸向呼叫铃的手缩回被子里，连头一起蒙住，闭眼忍耐；她甚至故意屏住呼吸去感受「生」（屏到90秒）。最终实在忍不住，按下呼叫铃按钮，闭上眼睛——睡意袭来，进入游戏结束。"
    info_point: "第一次「发作」支线。译歪「不想给人添麻烦→缩回手」这个内心挣扎，后续「忍耐→游戏结束」的因果就不成立。"

  - id: q7
    question: "サクラ第一次「游戏结束」时，画面给出的两条提示是什么？"
    reference: "提示1：「光看『梗概』，有些心情，是讲不尽的。」提示2：「有时候，不忍耐也很重要。」其中第二条对应サクラ硬忍病痛、拖延按呼叫铃的选择。"
    info_point: "GAMEOVER 画面提示文字。若译文把「不忍耐也很重要」译反或译模糊，玩家就无法把它和“忍耐选择”联系起来。"

  - id: q8
    question: "サクラ最后一次倒下、游戏结束前，她是在什么情境下听到什么话而发病的？"
    reference: "她正要和アヤノ打招呼时，听到アヤノ在打电话（对ユウイチ），说「我喜欢他……得把话说清楚，不能就这样半吊子下去」。サクラ立刻呼吸困难、耳鸣、眼前模糊、心跳加快，心想「不要，为什么要在这种地方」；アヤノ发现她跑过来喊「サクラ同学！」，她心里想「不要过来。现在要是听见アヤノ同学的声音，我——」，随即倒下。"
    info_point: "サクラ偷听电话→发病的GAMEOVER支线。译歪电话内容和サクラ「不想让アヤノ过来」的心声，这条支线的悲剧动机就丢失了。"

  - id: q9
    question: "サクラ把什么样的咒语教给了アヤノ？「ユキ」是什么意思？关于「ユキ／雪」和告白有什么告诫？"
    reference: "サクラ在撕下的笔记本纸页上写下「ユキユキユキ……」。她说「ユキ」写成汉字是「往く」，是朝着愿望往前去的意思，但不是「雪」；有说法叫「雪的告白会失败」，不要在冬天告白，春天或夏天才是好季节。她还告诫アヤノ：咒语一旦失败会反弹到自己身上，做的时候不要开玩笑、要认真。"
    info_point: "ユキ咒语的关键设定（ユキ＝往く／非雪／冬天告白失败）。若译文把ユキ直接译成「雪」或丢掉「往く」，咒语的谐音双关就消失了。"

  - id: q10
    question: "サクラ问ユウイチ是不是在和アヤノ交往时，ユウイチ是怎么回答的？"
    reference: "ユウイチ先反问「为什么问这种」，然后说「不……哪有的事。我不想破坏现在的关系」；又说有各种各样的原因，现在这样就好。他反过来问サクラ有没有喜欢的人，サクラ否认，ユウイチ说「不去告白吗？」并鼓励她：「我想是挺不容易的，不过我给你加油哦！」"
    info_point: "中庭ユウイチ×サクラ对话。ユウイチ「不想破坏现在的关系」是理解三人关系的核心短语，译歪会导致人物动机错位。"

  - id: q11
    question: "ユウイチ第一次给サクラ甜甜圈，理由是什么？他原本打算买几个？"
    reference: "因为サクラ告诉他アヤノ刚进了医院／病房，两人错过了，ユウイチ说这是「谢你告诉我的」，让她别客气。他本来打算「一人一个」去买，结果被店里各种甜甜圈吸引，「买成了三个左右」，自嘲晚饭前吃太多了。サクラ最初指了袋子最上面的那个，ユウイチ让她别客气，她便改选边上的草莓巧克力甜甜圈。"
    info_point: "ユウイチ送甜甜圈的契机与细节。若译文把「一人一个」和「买成三个」的因果译没，ユウイチ「买多了才送人」的行为就变得奇怪。"

  - id: q12
    question: "由加里老师向直哉坦白，她和ユウイチ搂抱／亲吻是哪一天的事？是谁主动的？"
    reference: "是ユウイチ从天台跳下去那一天的事（当天）。由加里说：「那是我主动亲吻了ユウイチ君，我抱住ユウイチ君，就只有那一天那一次。」ユウイチ之后从天台跳下，自杀。"
    info_point: "居酒屋谈话中由加里与ユウイチ的现实关系。若译文把「是我主动」译成「是他主动」或模糊化，现实与故事的对照就乱了。"

  - id: q13
    question: "由加里老师说，哪一件事可以证明「故事」并不一定是在重现现实中发生过的事？"
    reference: "由加里说：「烟花那一场里有ユウイチ君在，这就意味着『故事』并不一定是在重现现实中发生过的事。」现实里，ユウイチ和老师在图书室抱在一起之后，当天就从天台跳下去了；而故事里图书室的场面之后，ユウイチ是和アヤノ抱在一起。因此烟花場面有ユウイチ恰恰说明故事已经偏离现实。"
    info_point: "由加里关于「故事非现实重现」的核心论断。若译文把「烟花有ユウイチ」这个证据译乱或漏掉，直哉对现实与故事关系的推断就失去根据。"

  - id: q14
    question: "彩野想去天台时，直哉为什么能打开天台的门？他手里的钥匙是哪里来的？彩野听了之后有什么反应？"
    reference: "直哉说「钥匙……嗯。没问题。我有钥匙哦。是由加里老师交给我保管的」。彩野听了轻声说「这样啊……门，是锁着的呀」，并念了一句「……由加里老师……」，暗示她原本不知道天台平时锁着。直哉提议小千秋也一起来，小千秋摇头先回去了。"
    info_point: "通往天台的钥匙来源（由加里老师交予直哉）。这扇门能否打开是后续发现绘本/日记的物理前提，译丢钥匙来源会削弱门控连续性。"

  - id: q15
    question: "直哉在纸箱里看到的、佐仓雪乃寄给彩野的信，邮戳日期是怎样的变化？最后一封信写了什么？"
    reference: "第一封信（佐仓雪乃的信，写着最近读过的书、杂志上看到的咒语好像很灵验、从病房望出去的雪景很美）邮戳是「２月」，结尾说「下一封信大概要隔上一阵子了（汗）。彩野同学也要好好保重哦！」；下一封信邮戳变成了「９月」，里面只有一句「在天台等我。サクラ」。サクラ的日记也是2月结束的——2月的信之后她再也写不了信了。"
    info_point: "日记/信件日期线（9月13日日记→2月信→9月字条「在天台等我」）。译错邮戳月份或把「在天台等我」的笔迹／署名弄丢，日期与信件的悬疑链就断了。"

  - id: q16
    question: "小千秋是怎么描述サクラ同学的？直哉由此确认了什么？"
    reference: "小千秋说サクラ同学：「死了」「６年前。是生病。死了。现在不在了」。サクラ是真名「佐仓雪乃」、小千秋的姐姐，身体虚弱很少上学。直哉由此确认，章节5的内容是以现实中留存下来的日记往来为基础的，几乎都是事实。"
    info_point: "小千秋坦白サクラ已死／是姐姐。这条信息把整个章节5落回现实，若译文把「6年前／生病／死了」译得含糊，读者就意识不到サクラ已不在人世。"

  - id: q17
    question: "进入章节5之前，直哉在心里特别提醒自己要注意什么？"
    reference: "直哉想：章节5不是「追溯以前写下的故事」，而是彩野「现在一边创作」；故事中途彩野可能会向他提问，需要选出正确的卡片；「虽然可以跳过梗概，但要是跳过了就会跟不上故事」，所以在章节5里「不做梗概跳过、把故事听下去」是必要的。后面还确认：这个「归纳」必须接连不断地选对卡片，中途只要有一次选错就不行，需要重新来。"
    info_point: "章节5的推进规则（不能跳过梗概、必须倾听并选对卡片）。这是s5s_680→e2门控的核心，若译文把「跳过会跟不上／选错不行」译丢，玩家就不会理解为什么必须逐段听。"

  - id: q18
    question: "彩野在章节5的哪里感到「违和感」？她请求添加什么选项？理由是什么？"
    reference: "彩野觉得アヤノ对サクラ说话时像是在「配合着给答案」，心里想的可能和说出来不同。她请求在分岔里加入「不听」（不听サクラ同学讲的话）的选项。理由：她直觉这里在现实里说不定真有过这样的对话，アヤノ和サクラ的关系可能更坦率、更像平常那样自然地你来我往——也就是「把从サクラ听来的故事接住、然后由自己回答」这个流程应该更自然；这与之前咒语／楼梯传闻那种「没兴趣→Bad End」的分岔不一样。"
    info_point: "彩野要求新增「不听」选项的创作讨论。若译文丢掉她的「违和感」或说成「听」的选项，分支动机就完全反了。"
