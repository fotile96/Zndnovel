[project]
name = "sndl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emu: PPSSPP 活体模拟器测试（需本机构建与 tools/emu/fetch_testdata.sh 素材，缺则自动 skip）",
    "local_assets: 依赖本机资产（luac_sz4 / build/databin），缺则自动 skip",
]
