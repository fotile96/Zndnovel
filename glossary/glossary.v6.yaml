  - {jp: 帰りの歌, zh: 回家的歌谣, note: v6 由「回家的歌」改定（用户裁决）}
  - {jp: 浜千鳥, zh: 《浜千鸟》, note: 实存童谣歌名}
  - {jp: 誰も見たことのない夕焼け, zh: 谁都没见过的晚霞, note: 晚霞↔朝霞承载结局反转}
