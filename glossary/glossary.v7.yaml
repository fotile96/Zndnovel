# ── 体例（v7 新增节；正文体例的权威仍是 glossary/style.md，本节为本次裁决的条文，须同步召回进 style.md）──
conventions:
  - id: quote-marks
    title: 给原文未加引号处补『』的口径
    rule: |
      仅限以下两种情形之一，且须在 notes 登记：
        (a) 原文在**近旁**已对同一词用过该体例（援引原文自身体例）；
        (b) 不补则**中文不成句**（句法必需）。
      不满足则不补。已入线的三处均合规：8192 纸面『是』『否』属 (a)+(b)；8369『你』？属 (b)（须标示"被拼出来的那个词"）；
      1994/1997/2030 裸『她』属 (a)（原文自身 1996/2014 即写『彼女』）+ (b)（中文「她」不能作名词中心语，
      「这个她」「钱仙的那个她」是病句）。同段的代词位与喃喃列举位（1990/2027）不补，分治正确。
  - id: numeral-width
    title: 「数字全角/半角跟随原文」的适用边界
    rule: |
      适用：UI/系统串（章节编号、■おしらせ 等）、原文刻意的字形游戏、暗号数字串（如 6494「２２６２」）。
      **不适用：母题实物名**——此类按「同物同名」统一（用户裁决 v7，首案 2378 十円玉）。
      两条规则冲突时，母题实物名的指称一致性优先。
  - id: honorific-exceptions
    title: 〜さん→〜同学 默认表的具名例外
    rule: |
      默认仍为 style.md 的「〜さん→〜同学」。具名例外（用户裁决 v7，维持）：
        ユウイチさん → ユウイチ先生（7791 对仗形「アヤノさん→アヤノ小姐」、7913、9304、9308）。
      依据：①中文「先生」在全段仅用于此揶揄敬称，日文 先生 一律译「老师」（106/107，唯一例外 8123 校長先生→校长），
      二者不混读；②与「アヤノ小姐」构成 小姐/先生 对仗；③9308 需 ユウイチ 嫌弃该称呼「恶心」，
      换「同学」太中性、玩笑会塌。新增此类例外须同样具名登记，不得泛化为「可自由偏离默认表」。
