- card: 1
  variant: a
  title_jp: ある子が学校にくる物語
  section_label: 物語？
  body_jp: '教室に入ったとき、机の上

    の落書きを見て、彩野さん

    は以前、「ある子が学校に

    くるお話」を書いていた事

    を思い出した。'
  note: 右栏仅有一行「物語？」（？为全角），无第二标签槽位文字。
- card: 2
  variant: a
  title_jp: 夏の朝、高校までの通学路
  section_label: 'セクション1

    あらすじ'
  body_jp: '朝、男子生徒(ユウイチ)

    と女子生徒(アヤノ)が並

    んで学校に登校する。いつ

    もの光景、いつもの日常。

    女子生徒はテストの事を忘

    れていたため、慌てて教室

    に向かう。'
  note: 正文中 (ユウイチ)(アヤノ) 的圆括号为半角字形。
- card: 3
  variant: a
  title_jp: 放課後の約束
  section_label: 'セクション1

    あらすじ'
  body_jp: '小テストに負けた場合、ハ

    ンバーガーをおごる約束を

    していたことを思い出す。'
  note: ''
- card: 4
  variant: a
  title_jp: 選択：放課後の約束
  section_label: 'セクション1

    選択肢'
  body_jp: '「思い出せない」

    「している」

    「していない」

    の展開があり。'
  note: ''
- card: 5
  variant: a
  title_jp: 約束をしている
  section_label: 'セクション1

    あらすじ'
  body_jp: 'アヤノは放課後、あの子と

    会う約束をしていた事を、

    消しゴムを見て思い出す。'
  note: ''
- card: 6
  variant: a
  title_jp: 約束を思い出せない
  section_label: 'セクション1

    あらすじ'
  body_jp: 'アヤノは放課後、誰かと会

    う約束をしていたような気

    がした。'
  note: ''
- card: 7
  variant: a
  title_jp: 約束をしていない
  section_label: 'セクション1

    あらすじ'
  body_jp: 'アヤノは放課後、誰とも会

    う約束をしていなかった。'
  note: ''
- card: 8
  variant: a
  title_jp: 約束を思い出す
  section_label: 'セクション1

    あらすじ'
  body_jp: '噂について話し、アヤノは

    放課後、「あの子」と会う

    約束をしていた事を思い出

    す。'
  note: ''
- card: 9
  variant: a
  title_jp: 朝の教室
  section_label: 'セクション1

    あらすじ'
  body_jp: '朝の教室、いつもの光景。

    ユウイチがちょっかいを出

    してきて、アヤノは思うよ

    うに予習が出来なかった。'
  note: ''
- card: 10
  variant: a
  title_jp: セクション１：アヤノ
  section_label: 'セクション1

    あらすじ'
  body_jp: 'セクション１の主人公は

    「アヤノ」'
  note: 标题与正文中的「１」「：」为全角；右栏标签「セクション1」的「1」为半角。正文「アヤノ」后无句号。
- card: 11
  variant: a
  title_jp: 昼休みの教室
  section_label: 'セクション1

    あらすじ'
  body_jp: 'アヤノはユウイチをコック

    リさんに誘うが、ユウイチ

    は拒否。さらにユウイチは

    テストの高得点をアヤノに

    見せつけた。'
  note: ''
- card: 12
  variant: a
  title_jp: 選択：ユウイチの答案
  section_label: 'セクション1

    選択肢'
  body_jp: '「羨ましがる」

    「受け流す」

    の展開があり。'
  note: ''
- card: 13
  variant: a
  title_jp: 答案を羨ましがる
  section_label: 'セクション1

    あらすじ'
  body_jp: 'ユウイチは賭けに勝ったの

    だからファストフードをお

    ごれと言う。しぶしぶ頷く

    アヤノ。'
  note: ''
- card: 14
  variant: a
  title_jp: 答案を受け流す
  section_label: 'セクション1

    あらすじ'
  body_jp: 'ユウイチとの賭けに負けて

    しまったアヤノは、自慢す

    るユウイチを受け流して、

    逃げ出した。'
  note: ''
- card: 15
  variant: a
  title_jp: 授業が始まる
  section_label: 'セクション1

    あらすじ'
  body_jp: 'ユカリ先生の授業。先生も

    だいぶ教師に慣れてきたよ

    うだ。'
  note: ''
- card: 16
  variant: a
  title_jp: 放課後
  section_label: 'セクション1

    あらすじ'
  body_jp: '今日いちにちの授業が終わ

    る。なんとも言えない安堵

    感。'
  note: ''
- card: 17
  variant: a
  title_jp: ユウイチとファストフード
  section_label: 'セクション1

    あらすじ'
  body_jp: 'ユウイチとの賭けに負けた

    ため、しぶしぶファスト

    フード店へ。ユウイチはコ

    ックリさんに大反対。'
  note: 正文第 2 行在「ファスト」后即换行，该行未排满（原版式如此）。
- card: 18
  variant: a
  title_jp: 選択：学校に戻る
  section_label: 'セクション1

    選択肢'
  body_jp: '「学校に戻る」

    「家に帰る」

    の展開があり。'
  note: ''
- card: 19
  variant: a
  title_jp: いつもの生活
  section_label: 'セクション1

    あらすじ'
  body_jp: '結局アヤノは家に帰る。何

    事もない日常、いつもの生

    活が戻ってきた（おわり）'
  note: 「（おわり）」为全角括号，其后无句号，正文即止于此。
- card: 20
  variant: a
  title_jp: 探索：放課後の学校
  section_label: 'セクション1

    探索'
  body_jp: '放課後アヤノはぐるっと学

    校を回る。屋上とそこに続

    く階段が少し気になった。'
  note: 右栏第二槽位为「探索」（本批仅此卡）。
- card: 21
  variant: a
  title_jp: 放課後のコックリさん
  section_label: 'セクション1

    あらすじ'
  body_jp: '放課後、アヤノはあの子と

    コックリさんを行う事にし

    た。あの子の準備は念入り

    だ。'
  note: ''
- card: 22
  variant: a
  title_jp: 彼女との出会い
  section_label: 'セクション1

    あらすじ'
  body_jp: 'あの子とは、屋上で出会っ

    た。人混みが苦手、という

    事みたいだ。'
  note: ''
- card: 23
  variant: a
  title_jp: 良くない結果
  section_label: 'セクション1

    あらすじ'
  body_jp: 'アヤノはコックリさんに質

    問をするが、その結果は…

    …あまり良いものではなか

    った。その後不思議な出来

    事が起き、アヤノの視界が

    かすんでいく。'
  note: 六点省略号「……」跨行拆分：第 2 行末为「…」、第 3 行首为「…」（原版式如此）。
