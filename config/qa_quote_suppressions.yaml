# check_qa_quotes 抑制清单（带理由的豁免，`reason` 必填，缺了直接拒绝加载）。
#
# 与题库本身分开存放，便于评审时一眼看全"我们一共豁免了什么"——题库
# （config/ayano_qa/*.yaml）里只该有题目本身，不该混进闸的运行时配置。
#
# 粒度故意收窄到 (qa, id, fragment) 三元组精确匹配：只豁免"这份题库、这个
# id、这个逐字片段"这一条确切命中，不豁免"这个 id 以后都别报"或"这份题库
# 别报了"——粒度太粗会在将来这个 id 真的出现新漂移时静默放过（`tools/
# check_qa_quotes.py` 的 `load_suppressions()`/`split_suppressed()` 按
# 这三个字段精确匹配；任何一个字段变化（哪怕只是命中片段因为后续再次回改
# 变长/变短了）都不再匹配，会作为一条新的、未豁免的命中重新出现，需要人工
# 重新判断——这是安全方向：宁可多看一眼真无害的重复，也不能让判据留出
# 「以后这条永远别报」的口子）。
#
# 每条豁免的命中在 check_qa_quotes 的输出里仍然照常统计、照常打印（标"[豁免]"），
# 只是不计入 --strict 的退出码——藏起来等于恒绿，本项目不允许恒绿闸。
#
# 字段：
#   qa       题库文件名（Path(path).name，不含目录）
#   id       vms 消息 id
#   fragment 与 check() 报出的 hits[i]["fragment"] 逐字相同的片段
#   reason   必填：为什么这是伪报，不是真漂移
#   date     豁免记录的日期（便于日后复核这条豁免是否还成立）
#   source   出处/裁决记录指向哪里

- qa: seg1-s2.yaml
  id: 10038
  fragment: "，ユウイチ像是"
  reason: >
    题库 q12 自身叙述天台门那一句「ユウイチ像是『早知道没上锁』一样」，与
    id 10038 的旧译「像断了线一样」只是「，ユウイチ像是」这 6 个字的偶然
    子串重合，本题并没有引用 10038（10038 讲的是另一处「像断了线的木偶一样
    瘫倒」）。真实检验：把 q12 这句话整体改写掉，10038 那处真实漂移
    （断了线→汀……不适用，这里是「断了线」本身未变）依然与本题无关——
    q12 的 reference 从未提及"断线"这个意象，纯属 6 字重合触发的判据边界
    案例，不是失同步。
  date: "2026-08-07"
  source: >
    2026-08-07 P4 SEG-1 段末 check_qa_quotes 真实命中排查（5 处命中，4 处
    真实漂移已修，本条为唯一伪报）；裁决 session 已在
    config/ayano_qa/seg1-s2.yaml q12 上方就地加注同一结论。见
    docs/ops/p4-seg1-adjudication-handoff.md。

- qa: seg2-s3.yaml
  id: 11672
  fragment: "保健室老师是"
  reason: >
    命中的是**题面**而非参考答案：题面作「……认为故事里的保健室老师是怎样的
    存在？」，与 id 11672 的旧译「保健室老师是在回避从アヤノ这里听到这个
    话题」只在「保健室老师是」这 6 个字上偶然重合。题面里这 6 个字后面接的是
    「怎样的存在」，属于出题人自己的提问句式，并非引用 11672。
    真实检验：11672 本轮的改动是把「回避从アヤノ这里听到这个话题」顺成
    「一直在回避听アヤノ说起这个话题」——受试若照现行译文作答，答的是
    「老师在回避这个话题」，与题面问的「是怎样的存在」完全不冲突，不存在
    「照现行译文作答会被判错」的情形。
    ⚠ 「保健室老师」是本段高频实体名，出现在题面里几乎不可避免；豁免粒度
    已由三元组精确匹配收窄——若将来 11672 再次回改导致命中片段变长/变短，
    这条豁免自动失效、会作为新命中重新报出。
  date: "2026-08-10"
  source: >
    2026-08-10 P4 SEG-2 段末 check_qa_quotes 命中排查（2 处命中：1 处为
    SEG-1 已豁免的 10038，本条为本段唯一新命中且为伪报，无真实漂移）。
    见 pilot/polish/seg2-s3/channel_feedback.md。
