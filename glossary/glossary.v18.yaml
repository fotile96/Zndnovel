rulings:

  planetarium:
    term: プラネタリウム
    zh: 天象馆
    old: 天文馆
    ids: 全库 26 行（2733/2734/2736/2737/2768/2772/3070/3073/3075/3077/3082/3099/3100/3101/5187/5191/5203/5230/8728/9361/9668/9669/9681/9682/10167/17125）
    why: >
      用户 2026-08-16 裁定。原译「天文馆」在汉语里指的是**博物馆式的场所**
      （参观者在里面走动看展，如北京天文馆），而 `プラネタリウム` 在本作里始终是
      **穹顶投影放映厅**——5187「隔壁镇上装了台很大的机器」、5195「用那个机器把星星
      放出来」、5230「场内广播……放映即将开始」，全部指向放映厅而非展馆。
      汉语的对应词是「**天象馆**」（天象＝天文现象）。
    ⚠ 字形: >
      **是「天象馆」不是「天像馆」。** 控制会话在执行前就此回问过一次——
      用户初次给的是「天像馆」，确认后取「象」。`像` 是形象义，与天文现象无关。
      **这类一字之差的术语，全库回改前必须先确认字形**（本次涉及 26 行 × 8 段）。
    tooling: 已连带同步 `config/ayano_qa/seg1-s2.yaml` 的 2 处引文，`check_qa_quotes` 复跑归零。

  demi_burger:
    term: デミバーガー / デミグラスソースミートバーガー
    zh: 蜜汁汉堡 / 蜜汁酱肉汉堡
    old: 多蜜汉堡 / 多蜜酱肉汉堡
    ids: [5165, 5177]
    why: 用户 2026-08-16 裁定。全库仅此 2 行，且是同一场景（雪乃与直哉的快餐店）的一问一答。
    note: >
      ⚠ 记一笔供后人判断：`デミグラスソース`（demi-glace）在中文烹饪语境里的通行
      音译是「**多蜜酱**」，`蜜汁` 严格说是另一种做法（蜜糖上釉）。用户取「蜜汁」
      是**面向读者观感的选择**而非词典对应——本作这处是校园快餐店的菜名，
      读者不会去核对酱汁工艺。**不要据本条把别处的 `デミグラス` 也改成「蜜汁」**，
      若日后出现别的场合应另判。

