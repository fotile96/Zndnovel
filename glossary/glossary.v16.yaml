    term: 忘れもの / 落とし物
    supersedes: "v12 `忘れもの`/`落とし物` 条（旧定译「落下的东西」/「掉了的东西」，且明写「不作『遗失物／失物』」）"
    zh: 忘物 / 失物
    ids: [6047, 15432, 15458]
    why: >
      用户 2026-08-13 指出：`忘れものと落とし物` 是**本作编剧前作的作品名 neta**，
      该作有中文社区本地化版本，通行译名『忘物失物』。这不是修辞而是**外部互文**——
      不照译名走，中文读者绝无可能认出来，而认出来正是这处并置的全部用意。
      口语位（15372「你落东西了」、15380、15381）与无并置的散文位（12153/12155/
      12195/12198/12323/14200/14202）**维持 v12 的动词形，不动**——neta 在**成对**
      出现的那三处，逐词硬套只会让十行日常对白变得佶屈。
    cost: >
      ⚠ **本条有明确代价，须知情后再维持。** v12 选「掉了的东西」是为了让
      `落とし物` 的「掉」与锚点 15383/15388/15389 的**坠楼双关**同字
      （ユウイチ 寄存威士忌时说『不许弄掉了』→『唯独再掉一次，我可绝对不要』）。
      改作「失物」后，15458『ユウイチ君的《忘物》，还是《失物》』**丢掉了回指那条
      双关的暗线**。
      判断依据：**双关的本体在 15383/15388 两条锚点里，且锚点未动、字面完整**；
      15458 丢的只是一次回声。用「必然读不出的外部互文」换「已在别处完整存在的回声」，
      判为划算。⚠ 若日后认为回声更重要，回退面就是这 3 个 id，一条命令可逆。

