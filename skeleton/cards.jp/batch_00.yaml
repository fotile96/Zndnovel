# skeleton/cards.jp/batch_00.yaml — 卡面日文转写 batch 00（card 0–19）
# 来源：png/card/crd_<N>_a.png 逐字转写（规程 A）。
# 字段：card(int) / variant("a"|"d") / title_jp / section_label / body_jp / note
# 约定：
#   - 卡面上的换行处以 \n 记录（双引号标量，\n 为换行转义）。
#   - section_label 为右栏全部文字；右栏上下两个标签槽位之间以 \n 相连
#     （如 "セクション1\nあらすじ"）。
#   - 右栏标签「セクション1」的「1」在卡面上为半角字形；
#     卡 10 标题/正文中的「１」「：」为全角（与 snr_common.lua plotTitle[10] 一致）。
#   - 特例：png/card/ 中不存在 crd_0_a.png，卡 0 仅有空白变体 crd_0_d.png（见该条 note）。
- card: 0
  variant: "d"
  title_jp: ""
  section_label: ""
  body_jp: ""
  note: "空白卡面：仅有标题横线与右栏分隔线等版式框线，无任何文字（无标题、无正文、无右栏标签）。png/card/ 目录中不存在 crd_0_a.png，卡 0 仅此一张 d 变体；游戏数据 plotTitle 自 1 起编号，无 0 号标题，可佐证此卡本身即无字模板。"
- card: 1
  variant: "a"
  title_jp: "ある子が学校にくる物語"
  section_label: "物語？"
  body_jp: "教室に入ったとき、机の上\nの落書きを見て、彩野さん\nは以前、「ある子が学校に\nくるお話」を書いていた事\nを思い出した。"
  note: "右栏仅有一行「物語？」（？为全角），无第二标签槽位文字。"
- card: 2
  variant: "a"
  title_jp: "夏の朝、高校までの通学路"
  section_label: "セクション1\nあらすじ"
  body_jp: "朝、男子生徒(ユウイチ)\nと女子生徒(アヤノ)が並\nんで学校に登校する。いつ\nもの光景、いつもの日常。\n女子生徒はテストの事を忘\nれていたため、慌てて教室\nに向かう。"
  note: "正文中 (ユウイチ)(アヤノ) 的圆括号为半角字形。"
- card: 3
  variant: "a"
  title_jp: "放課後の約束"
  section_label: "セクション1\nあらすじ"
  body_jp: "小テストに負けた場合、ハ\nンバーガーをおごる約束を\nしていたことを思い出す。"
  note: ""
- card: 4
  variant: "a"
  title_jp: "選択：放課後の約束"
  section_label: "セクション1\n選択肢"
  body_jp: "「思い出せない」\n「している」\n「していない」\nの展開があり。"
  note: ""
- card: 5
  variant: "a"
  title_jp: "約束をしている"
  section_label: "セクション1\nあらすじ"
  body_jp: "アヤノは放課後、あの子と\n会う約束をしていた事を、\n消しゴムを見て思い出す。"
  note: ""
- card: 6
  variant: "a"
  title_jp: "約束を思い出せない"
  section_label: "セクション1\nあらすじ"
  body_jp: "アヤノは放課後、誰かと会\nう約束をしていたような気\nがした。"
  note: ""
- card: 7
  variant: "a"
  title_jp: "約束をしていない"
  section_label: "セクション1\nあらすじ"
  body_jp: "アヤノは放課後、誰とも会\nう約束をしていなかった。"
  note: ""
- card: 8
  variant: "a"
  title_jp: "約束を思い出す"
  section_label: "セクション1\nあらすじ"
  body_jp: "噂について話し、アヤノは\n放課後、「あの子」と会う\n約束をしていた事を思い出\nす。"
  note: ""
- card: 9
  variant: "a"
  title_jp: "朝の教室"
  section_label: "セクション1\nあらすじ"
  body_jp: "朝の教室、いつもの光景。\nユウイチがちょっかいを出\nしてきて、アヤノは思うよ\nうに予習が出来なかった。"
  note: ""
- card: 10
  variant: "a"
  title_jp: "セクション１：アヤノ"
  section_label: "セクション1\nあらすじ"
  body_jp: "セクション１の主人公は\n「アヤノ」"
  note: "标题与正文中的「１」「：」为全角；右栏标签「セクション1」的「1」为半角。正文「アヤノ」后无句号。"
- card: 11
  variant: "a"
  title_jp: "昼休みの教室"
  section_label: "セクション1\nあらすじ"
  body_jp: "アヤノはユウイチをコック\nリさんに誘うが、ユウイチ\nは拒否。さらにユウイチは\nテストの高得点をアヤノに\n見せつけた。"
  note: ""
- card: 12
  variant: "a"
  title_jp: "選択：ユウイチの答案"
  section_label: "セクション1\n選択肢"
  body_jp: "「羨ましがる」\n「受け流す」\nの展開があり。"
  note: ""
- card: 13
  variant: "a"
  title_jp: "答案を羨ましがる"
  section_label: "セクション1\nあらすじ"
  body_jp: "ユウイチは賭けに勝ったの\nだからファストフードをお\nごれと言う。しぶしぶ頷く\nアヤノ。"
  note: ""
- card: 14
  variant: "a"
  title_jp: "答案を受け流す"
  section_label: "セクション1\nあらすじ"
  body_jp: "ユウイチとの賭けに負けて\nしまったアヤノは、自慢す\nるユウイチを受け流して、\n逃げ出した。"
  note: ""
- card: 15
  variant: "a"
  title_jp: "授業が始まる"
  section_label: "セクション1\nあらすじ"
  body_jp: "ユカリ先生の授業。先生も\nだいぶ教師に慣れてきたよ\nうだ。"
  note: ""
- card: 16
  variant: "a"
  title_jp: "放課後"
  section_label: "セクション1\nあらすじ"
  body_jp: "今日いちにちの授業が終わ\nる。なんとも言えない安堵\n感。"
  note: ""
- card: 17
  variant: "a"
  title_jp: "ユウイチとファストフード"
  section_label: "セクション1\nあらすじ"
  body_jp: "ユウイチとの賭けに負けた\nため、しぶしぶファスト\nフード店へ。ユウイチはコ\nックリさんに大反対。"
  note: "正文第 2 行在「ファスト」后即换行，该行未排满（原版式如此）。"
- card: 18
  variant: "a"
  title_jp: "選択：学校に戻る"
  section_label: "セクション1\n選択肢"
  body_jp: "「学校に戻る」\n「家に帰る」\nの展開があり。"
  note: ""
- card: 19
  variant: "a"
  title_jp: "いつもの生活"
  section_label: "セクション1\nあらすじ"
  body_jp: "結局アヤノは家に帰る。何\n事もない日常、いつもの生\n活が戻ってきた（おわり）"
  note: "「（おわり）」为全角括号，其后无句号，正文即止于此。"
