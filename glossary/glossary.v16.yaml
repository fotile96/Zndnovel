  sakusei_split_by_object:
    term: 作成 / 作る（物語・お話・カード・あらすじ）
    supersedes: "v14 `作成` 条的分治轴与「对白/叙述位三形并存、零回改」"
    axis: >
      **判据从「串位」改成「宾语」。** v14 把轴划在「系统串位 vs 对白/叙述位」，
      并据此裁定对白位的三形并存照留。用户 2026-08-13 指出真正的分野是**尺度**：
      卡片、梗概是**做出来的东西**，整篇『物語』是**创作**出来的。
      改轴之后 v14 自己的反例也归位了——**17044 是系统串（按 v14 该作「制作」），
      但它的宾语是『物語』，而它早就已经是「创作」**。旧轴解释不了这一行，新轴能。
    zh:
      宾语是 カード / あらすじ / 選択肢: 制作（或口语位「做」）
      宾语是 物語 / お話 / 章节内容: 创作
    ids_card_scale: [11, 1131, 1605, 1698, 3780, 3797, 17014, 17068, 17075, 17084,
                     17087, 17094, 17095, 17098, 17102, 17103, 17105, 17106, 17107]
    ids_macro_scale_already_ok: [1584, 5595, 17044, 15921]
    ids_macro_scale_recalled: [458, 1706, 14503, 15884, 16067]
    why: >
      同一段里「制作梗概」与「制作故事」并排出现时，汉语读者会以为两者是同一道工序；
      而这两件事在本作里恰恰是**全篇的主轴之一**——直哉做的是卡片（梗概），
      彩野与サクラ做的是故事。轴一混，15921『彩野同学和サクラ同学**创作**的
      故事《True Color》』这句的分量就没了。
    active_json: "`作成 -> 制作` 保持不动——它守的是 19 行卡片尺度，是多数面；创作侧 9 行已全部落 patch，不会再被通道碰到"

