- qa: seg6-s8-e1.yaml
  id: 16799
  fragment: "把Ayano拉"
  reason: >
    命中的是**题面自己的场面描述**——q1 问「天台上Yuichi把Ayano拉回来的那一段，
    他向她说了什么？」，出题人必须点名是谁被拉上来，题面才指得清是哪一场；
    这与 id 16799 旧译「把Ayano拉上了≪这一侧≫」只在「把Ayano拉」这 6 个字上
    重合，题面并没有在引用 16799。
    真实检验：16799 本轮的改动是后半句同指代词的去重复（把Ayano拉上了→把她
    拉上了），**前半句「我紧紧攥住Ayano的手」原样保留**，受试读现行译文照样
    看得到 Ayano 是被拉的人，不存在「照现行译文作答会被判错」的情形。
    另注：同题 reference 末句「最后他紧紧攥住她的手，使出浑身力气把她拉上了
    ≪这一侧≫」用的已经是现行形，本身没有失同步。
  date: "2026-08-27"
  source: >
    2026-08-27 P5 SEG-6 段末 check_qa_quotes 命中排查（15 处命中：6 处既有
    豁免，4159／4188／4626／4643／4711 五处为真实失同步、已随本轮落盘更新
    题库，本条为唯一伪报）。

