  - {jp: 逆向性健忘, zh: 逆行性遗忘}
  - {jp: エピソード記憶, zh: 情景记忆}
  - {jp: 手続き記憶, zh: 程序性记忆}
  - {jp: 海馬, zh: 海马体}
