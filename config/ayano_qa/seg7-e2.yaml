# 彩野测试题库 · seg7-e2（18 题）。出题纪律见 seg1-s2 题库头注。
# 受试者只看得到：①严格早于本段的 190 张卡片梗概（9064 字符）；
#   ②SEG-7（b167–173：e2s/e2f/crd）的中文译文。
# info_point 只进报告、不进受试者与判分员的提示词。
#
# 出题方法沿用 SEG-6 起改用的做法：**先只读日文原文出题，再逐条拉译文核验**
#   （译文丢掉的东西，读着译文出题的人压根不会想到去问）。
#   **本段核验结论：18 题引用的全部事实在译文里逐条在线，零丢失**（约 80 行逐条比对）。
#
# 题量分配的依据：**e2s（b167–168，380 行）全段零锚点**——段末机检确认「本段最难的一段
#   完全没有机械闸」。故 e2s 出 10 题、e2f 出 8 题，重心压在无闸那一侧。
#
# 段绑定：前缀 190 张卡（较 SEG-6 新增 144/162/176/193 等收官卡）。关键词穷举——
#   `筑紫`/`药`/`赔偿`/`第一发现`/`生父`/`离婚`/`失眠`/`五天`/`银珠糖`/`第二物语`/
#   `酒吧`/`十年`/`文化祭`/`展位`/`Happy End`/`病死` 在 9064 字符前缀里**各 0 次**。
#   ⚠ **三个词命中、均已逐卡查过**：
#     `小菊` 3 次（卡77『田径部的传闻』/卡129/卡149）——**绰号本身在前缀里已知**，
#       故 q3 只问**由来**（ちくし→きくち→きくちゃん 的音变过程），不问「绰号是什么」；
#     `目击` 3 次（卡80/107/175）与 `跳下` 1 次（卡175）——都是**故事层**的图书室拥吻与
#       4B 结局，与 q4 问的**现实层**目击（筑紫在天台看到彩野）不是同一件事。
#   本次是**在跑段绑定闸之前**就查出 q3 这处稀释的（前两段都是跑完闸、核对它的卡号
#   引用时才查出）——把「逐卡核对命中词」提到出题环节，比事后补救便宜。
#
# ⚠ 前缀已含全篇核心诡计（卡141『章节 7 梗概』＝「故事中出现的Yuichi，原来是直哉。」）。
#   故 q17 不问「Yuichi 其实是谁」，只问**这一场在 EX2 里被重讲时改了什么**。
#
# review_focus 覆盖：
#   ✅ e2s 单边电话/拜访独白 → q1–q10（十题，六个受访者全覆盖）
#   ✅ e2f if 幸福线＝标题回收章 → q11–q18（含 5092/5647 的命名与 5670 的收尾）
#   ⚠ **两个开篇的对位（e2s 5675–5689 崩解版 ↔ e2f 4784–4794 完好版）→ q11**——
#      该族 jp 不全等、不触 W3/W4，是全段唯一无任何机械闸的结构性考点。
#
# 剧透核查：本段是全书最后一段，其后无内容，不存在预支下文的问题。
segment: seg7-e2
questions:
  - id: q1
    question: "那位老教师关于「当年那件事」透露了哪三条事实？"
    reference: "①**接连出了两桩事**（先是他的、随后是她的）；②**第一桩出事时才发现天台的门锁是坏的**，当时正说着得找人来修；③此后天台**有好几年是禁止入内的**。他还说当时大家都乱作一团，没有工夫去留意其他学生的样子。"
    info_point: "b167 scene_e2s_20_3（5750–5755）。⚠ **「门锁是坏的」是全篇的一处冷证据**——它解释了为什么彩野与Yuichi 当年能上天台，也与 e1s 开篇「进得来出不去」的合页故障构成同一母题的第三次实现。三条事实分散在连续几行里，译文若把「二件」译含糊（如只说「出了事」）就丢了「接连两桩」这个关键计数。"

  - id: q2
    question: "那位老教师在千秋要走时，反过来问了她什么？他给了什么忠告？"
    reference: "他叫住她，说「最后让我这边也问一个问题」，问的是：「**你，究竟是想做什么？事到如今**」。忠告：当时牵扯进这件事的人肯定都不愿再提起，「大家都是这么想的」；因为**牵涉到人命**，所以「你去打听这件事，会吃相当多的苦头。相当多的」——然后问「**就算这样，也没关系吗？**」。他随后为说话太重道歉，说这是老人的胡话，往后的事交给年轻人，并说自己也会擅自替她加油。"
    info_point: "b167（5758–5771）。全段第一次把「千秋在做的事有代价」摆到明面上。⚠ 这一整段是**单边独白**：千秋的回答一句都没有，「……」那几行就是她在答话。译文若替她补出任何内容即越权。"

  - id: q3
    question: "「小菊」这个称呼是怎么来的？（问的是这个叫法的由来，不是「她是谁」）"
    reference: "因为她的姓氏 `ちくし`（筑紫）**念着别扭**，于是有人开始念成 `きくち`；结果大家都跟着念 `きくち`，念着念着就成了爱称——`きくちゃん`，也就是「小菊」。"
    info_point: "b167 scene_e2s_20_4（5778–5780）。⚠ **「小菊」这个绰号本身在前缀卡77/129/149 里已经出现**，所以本题只考**由来**（`ちくし`→`きくち`→`きくちゃん` 的音变），那个过程只在本段。译文保留了假名原形来承载音变——若把三个假名都译成汉字，这个由来在中文里就不成立了。"

  - id: q4
    question: "筑紫在他出事那天目击到了什么？她告诉了谁、结果如何？她后来对这件事产生了什么怀疑？"
    reference: "她**在天台上看到了「她」的身影**——「他出事故的时候，在天台上看到她身影的，是我」。⚠ 原文此处只说「彼女」、**不点名**，答案里点不点出是谁**都算对**。她**告诉了老师**，「当然」，但「**就到此为止了**」。后来她因此怀疑：「**说不定是学校那边做了什么处理吧**」。（她还说，之后她也从天台……于是就出了那样的事。）"
    info_point: "b167（5807–5810）。这是全书对「学校封口」这条黑暗底流唯一的目击者证词。⚠ 与前缀卡80/107/175 的「目击」是两回事——那些是**故事层**的图书室拥吻与 4B 结局，这里是**现实层**的证词。"

  - id: q5
    question: "护士说的药是怎么回事？她用什么措辞来限定「那药是有效的」这句话？"
    reference: "当时是**先开药看看情况，开了好几种片剂，其中有一种**出了问题。这件事「**只上了一点点新闻**」，所以只在很有限的范围里成了话题。她说自己不是要替谁辩护，「**那药是确实有效果的**」——但紧接着限定：「只是到了现在，必须再加上一句『**对一部分人来说**』才行」。她还说，光是这家医院就有过好几起「事故」（连带征兆在内），「要说这是偶然接连发生，我觉得有点说不过去」；也有人说过是不是自己跳下去的。"
    info_point: "b167 scene_e2s_20_7（5912–5919）。药害是本作最不肯说破的一条线，全靠护士这一串限定词的层层后撤来传达。**「对一部分人来说」这个补语是全段最重的七个字**——译文若把它并进前句或译轻，整条线就只剩「药有效」。"

  - id: q6
    question: "医院当年为什么要费尽力气去找那个男学生？找到了吗？"
    reference: "因为**那个男学生是第一发现者**，也是**唯一的证人**。要是他开口作证说「**不是病死，是跳下去的**」，那就要出大乱子——「而且也就成了医院在说谎」。结果**没找到**：「听说医院想尽了各种办法要找到他，结果还是没找到」。护士说自己心里觉得那简直跟傻瓜似的，「那种事早晚都会露馅的嘛」，可结果还是没有闹到明面上。"
    info_point: "b167（5923–5927）。这里第一次把「病死」定性为医院的口径而非事实。那个「男学生」是直哉——**但原文全程只说『その男子生徒』、不点名**，译文同样不点名，答案里点不点出是谁**都算对**（见 seg1 头注的出题纪律）。"

  - id: q7
    question: "护士在最后提出了一个她自己都觉得过分的反转推论，是什么？"
    reference: "她先说「确实，要是没有那件事，钱说不定是不会出的」；接着反过来想——「**因为『希望对方出钱』，所以才有了那件事**——这样想，说不定也是可能的」。说完她立刻道歉：「对不起，我说了非常、非常过分的话呢。对不起。真的对不起……」。"
    info_point: "b167（5934–5937）。全书最黑的一句，而且**说话人自己当场收回**。译文若把因果关系的方向译反（「有了那件事所以要钱」），这个推论就变成平铺直叙的事实陈述，那句道歉也就没有着落了。"

  - id: q8
    question: "千秋的生父在电话里说了些什么？谈话是怎么结束的？"
    reference: "他说错在对方那边，「**能拿的东西那自然是全都拿到手了哦。连包装带蝴蝶结一起**」；被质问时说「**所·以·说。你不也没缺过什么吗？** 能拿的东西，我就好好好地拿去用了呗」，又说「你说什么都没用了。已经太晚了」。他还提议见面，说「你也还记得吧……可别说忘了……」，并问她「你还住在那边吗？就是那个，从**不是我的、『温柔的爸爸』**手里让过来的房子」。谈话的结束：他被打断，只剩「**别跟我开玩笑，你。喂，等一下！**」——**这一行没有说话人标签**，读作电话已被挂断之后从听筒里漏出来的声音。（原文没有明写是谁挂的，答成「电话被挂断了」即可。）"
    info_point: "b167 scene_e2s_20_6（5891–5899）。⚠ **5899 是全段唯一一行没有说话人标签的旁白式怒吼**——它已经是电话被挂断之后从听筒里漏出来的声音，格式上的这个变化就是「她挂了」的全部提示。译文保留无标签形式是必须的。"

  - id: q9
    question: "彩野的母亲讲了女儿高一那年发生的什么事？后来怎么处理的？"
    reference: "高一时，**他和那孩子两个人闹翻了**——在那之前一直是青梅竹马、好得很，从来没吵过那么大的架，「突然就」。母亲说自己也不知该怎么办。之后两人不再一起上学，各走各的；没过多久**女儿说晚上睡不着**，问下来「已经有五天左右了」，母亲这才吓了一跳，**把她带去了医院**。她还提到：那孩子出事故之前、（姐姐）过世的那时候，失眠得很厉害，「说是要用稍微强一点的」。另外她说，要是没有人家那边的协助，治疗费实在负担不起。"
    info_point: "b168 scene_e2s_20（5992–6009）。母亲这一段把 s5/s7f 已知的因果补了最后一块：彩野的失眠→就医→**处方**，与护士那条药害线在这里合流。⚠ 「稍微强一点的」是原文的委婉说法，不得替换成药名。"

  - id: q10
    question: "酒吧老板对Yuichi寄存那瓶酒有什么看法？他自己接下来打算做什么？他最后识破了千秋的什么事、凭什么？"
    reference: "看法：酒是他存下的，说的是「**要交给那家伙**」；但老板说「仔细想想，他拜托的到底是那瓶酒呢，**还是别的、心情上的什么东西**呢……」。打算：他要**把这家店再改回酒吧**——「我觉得比起这种店，还是原来的店更合我的性子」，并数着「一、二、三……**１０年**，啊。一转眼就过去了呢」。识破：他最后说「**你的故事，写完了让我读读好吗？**」，凭据是「刚才我起了那个话头时你的反应，我就明白了哦——**你正在写故事**，这件事」；他还说「慢慢写就好」。"
    info_point: "b167/b168/b155 段（5967–5968、6033–6053）。老板「把店改回 BAR」呼应 CLAUDE.md 的「店 10 年后改回 BAR」。⚠ **他先前那段『把登场人物的名字换成自己的名字，内容就容易记住』的闲聊是钩子**——千秋的反应暴露了她在写故事，那段闲聊本身也是全书阅读机制的自指。"

  - id: q11
    question: "章节 EX2 里有两段几乎相同的开篇（都是听见远处的『回家的歌谣』、要侧耳、要写下话语）。这两段有什么不同？这个不同说明了什么？"
    reference: "两段的差别在**后半是否成立**：一段里「听那支曲子」这件事被**反复换字写了三次**（得**盯**那支曲子／得**停**那支曲子／得**听**那支曲子），而「写下话语」也一路退化——「得把话语写下才行」→「话语」→「把话语写下」→最后停在「**得把话语续写下**」，**句子断在半途、没有说完**。另一段则干净利落：「得听那支曲子才行。」「得把话语续写下去才行。」并接上「――故事。」「得把故事，续写下去才行。」。这个差别说明：前一段是**意识正在涣散**时的版本（开头就写着「意识渐渐远去」），后一段是完整、清醒的版本。"
    info_point: "e2s 5675–5689 ↔ e2f 4784–4794。⚠ **本段唯一完全没有机械闸的结构性考点**：两组 jp 不全等、不触 W3/W4、e2s 侧零锚点。原文的同音异字 `きかない/訊かない/聴かない`（聞/訊/聴 同音）在中文里换了载体——用**盯/停/听**承接（v13 由 闻/问/听 改为同音别字 汀/厅/听；**P5 SEG-7 用户再裁为 盯→停→听**：dīng 声母错→tíng 声调错→tīng 全对，在「字」之外又加了「音」这一维的收敛，且中环「停」是**真动词、整句成立、意思偏成『让曲子停下』**，对位原文 `訊く`「本身成词但义偏」那一环），保住了「同一件事被反复换字写」这个动作；5689 的断句也原样保留。若译文把三次统一成「听」、或把 5689 补成完整句，这个考点即消失。"

  - id: q12
    question: "在Sakura与「ドーナツ的哥哥」的回想里，她最后鼓起勇气确认了一件事，对方怎么回答？这段对话的呈现方式发生了什么变化？"
    reference: "她问：「**你是，Yuichi同学……对吧……？**」对方用温柔的声音回答：「**不是哦。我不是Yuichi**」。呈现方式的变化：这段对话中途从普通的「」引号**切换成了 ≪…≫ 括号**（并且说话人标签也变成带 ≦≧ 的形式），而回答那一句的说话人标签是**【≦＊＊＊≧】**——不再是【Yuichi】。"
    info_point: "b170 scene_e2f_50（4838–4850）。**e2f 全章的支点**：雪乃在她编纂的『如果』线里，第一件事就是把当年那个误认**改正过来**。⚠ 说话人标签由【Yuichi】变【≦＊＊＊≧】、引号由「」变 ≪≫，两处形制变化**就是这个改正本身**，译文一处都不能抹平。"

  - id: q13
    question: "在这条「如果」线里，雪乃和直哉互相拿对方的什么糗事开玩笑？"
    reference: "雪乃说他没有眼光——「**把我错当成男孩子的人**，说这种话」；直哉立刻回敬——「把**我的名字都记错**的人说的话，那可真是准得很呢」。（两人是为了那个『甜甜圈包』好不好吃在斗嘴。）"
    info_point: "b170 scene_e2f_90（4906–4907）。⚠ 这两句是**全篇诡计的自嘲式回收**：「把我错当成男孩子」与「把我的名字记错」正是现实里 Sakura 误认直哉为Yuichi 的那件事，被写成了一对轻松的玩笑。译文若把「名字记错」译得笼统（如「认错人」），回收就落空了。"

  - id: q14
    question: "雪乃亲手做的那份东西出了什么问题？她是怎么发现的？护士看过之后对她说了什么？"
    reference: "她做的是巧克力（二月，材料由千秋帮忙准备、她融了巧克力捏出形状）。发现问题：她无意间用手指沾了碗上残留的巧克力碎屑舔了一下，觉得「有什么不对劲」，赶紧去看巧克力的包装。于是她问护士：「蛋糕啊，还有那个……**甜甜圈上面常撒的那种、银色的小粒粒**，叫什么来着？」护士答：「呃——……你说的，难道是**银珠糖**？」——她这才确认那东西**当然是甜的吧**。护士接过包装端详之后，把手放在她头上摸着说：「**他呀，你可要好好珍惜才行哦**」。"
    info_point: "b170 scene_e2f_180（5009–5028）。5017/5020 是锚点，逐字沿用。⚠ `アラザン`→**银珠糖** 是直哉↔雪乃↔千秋 三代暗号的源头（s7f 16109「草莓味巧克力上面、撒着银色糖粒的那种」）。护士那句话是全章最轻也最重的一处——她看懂了包装上的什么，原文不说破。"

  - id: q15
    question: "雪乃向由加里老师申请了什么？她给它起了什么名字？"
    reference: "她申请办一个**展出/节目**（出し物），由加里说「当然可以，这种自主的尝试大欢迎」，并说会去帮她们确保展位空间。老师问展示空间的名字定了没有，直哉答「名字已经定好了」，雪乃说：「**我想，就把它定为『第二物语』**」。"
    info_point: "b170 scene_e2f_200（5078–5092）。5092 是锚点。**这是全篇标题在正文里被点破的位置之一**（另两处是 5647、5670）——『セカンドノベル』的三重题意里，「文化祭展位名」这一重就落在这里。"

  - id: q16
    question: "在天台上，雪乃说自己之所以还活着，「全部的理由」是什么？她有一句话到嘴边又咽了回去，是什么？"
    reference: "她说：「中庭里我等着直哉的那时候」「因为**直哉≦回来了≧**」——「那，我想就是我还在这里的『**所有的全部的理由**』」。咽回去的话是：「**『明明是你自己留了级』**」——这句刚要出口，她就打住了。（直哉当时正拿「我是学长、说话不用敬语完全没问题」打趣。）"
    info_point: "b170 scene_e2f_190（5057–5068）。⚠ `≦戻ってきてくれた≧` 的强调括号原样保留——它标出的正是这条「如果」线与现实的**分岔点**。咽回去的那句「留级」呼应 e1s 五年后Yukari 的玩笑「你不是留学，是留级哦」，两处必须能互相认出来。"

  - id: q17
    question: "章节 EX2 里重讲了一遍章节 8 天台上的那场对话（「有过想要杀掉一个人的时候吗」那一场）。这次重讲，说话人标签和称呼上做了哪些改动？"
    reference: "**所有名字都被抹掉了**：提问的一方由【千秋】变成 **【≦女学生≧】**，回答的一方由【直哉】变成 **【≦＊＊＊≧】**；称呼也跟着改：原本千秋喊的「**直哉哥**」变成了「**老师**」，说「彩野姐姐住院的时候」也改成了「**那个人**住院的时候」。台词本身基本照旧——仍是「老师，你有过……想要杀掉一个人的时候吗？」「――这个嘛」「我怎么也没法觉得，故事里登场的人物『只有』Yuichi学长」直到「我既可以作为读故事的人成为Yuichi，也可以作为写故事的人成为Yuichi」。"
    info_point: "b171（5474–5499）↔ s8f（16575–16599）。⚠ **jp 只在名字处不同，故 W4 结构上报不出这一族**（`直哉さんは` vs `先生は`、`彩野さんが` vs `あの人が`），只有 5474 一行有锚点兜住。译文必须让读者认出「这是刚才那一场，只是名字被抹了」——匿名化本身就是 EX2 的叙述立场。⚠ 前缀卡141 已写明「Yuichi 原来是直哉」，故本题不问「他是谁」，只问**改了什么**。"

  - id: q18
    question: "全书最后，女学生对「老师」提出了什么请求？游戏的最后三行分别是什么？"
    reference: "她说故事的结局她已经先定好了，是——「**故事的最后，我想写成 Happy End**」，并问「……**可以拜托您吗？**」。（在这之前她说那是「……**我们的，故事**」。）最后三行：①「**我们的故事已≪全部≫完结。**」；②「**第二物语：完**」＋（Ｃ）日本一ソフトウェア／テクスト。（同一行，中间以断行分开）；③「**承蒙您拿起本书，非常感谢。**」"
    info_point: "b172 结尾（5666–5671）。5647／5667 是锚点。⚠ 5670 形制敏感：行首与断行后各有 6 个半角空格、全角 `（Ｃ）` 与 `／`、公司名 `日本一ソフトウェア／テクスト` **不译**。⚠ 5671 用的是「本**书**」而不是「本作/游戏」——全篇最后一句仍把自己称作一本书，与「第二物语＝要写的续篇」同构，不得改写成「本游戏」。"
