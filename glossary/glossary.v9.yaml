conventions:
  - id: quote-marks
    title: 给原文未加引号处补『』的口径
    rule: |
      仅限以下两种情形之一，且须在 notes 登记：
        (a) 原文在**近旁**已对同一词用过该体例（援引原文自身体例）；
        (b) 不补则**中文不成句**（句法必需）。
      不满足则不补。已入线的三处均合规：8192 纸面『是』『否』属 (a)+(b)；8369『你』？属 (b)（须标示"被拼出来的那个词"）；
      1994/1997/2030 裸『她』属 (a)（原文自身 1996/2014 即写『彼女』）+ (b)（中文「她」不能作名词中心语，
      「这个她」「钱仙的那个她」是病句）。同段的代词位与喃喃列举位（1990/2027）不补，分治正确。
  - id: numeral-width
    title: 「数字全角/半角跟随原文」的适用边界
    rule: |
      适用：UI/系统串（章节编号、■おしらせ 等）、原文刻意的字形游戏、暗号数字串（如 6494「２２６２」）。
      **不适用：母题实物名**——此类按「同物同名」统一（用户裁决 v7，首案 2378 十円玉）。
      两条规则冲突时，母题实物名的指称一致性优先。
  - id: honorific-exceptions
    title: 〜さん→〜同学 默认表的具名例外
    rule: |
      默认仍为 style.md 的「〜さん→〜同学」。具名例外（用户裁决 v7，维持）：
        ユウイチさん → ユウイチ先生（7791 对仗形「アヤノさん→アヤノ小姐」、7913、9304、9308）。
      依据：①中文「先生」在全段仅用于此揶揄敬称，日文 先生 一律译「老师」（106/107，唯一例外 8123 校長先生→校长），
      二者不混读；②与「アヤノ小姐」构成 小姐/先生 对仗；③9308 需 ユウイチ 嫌弃该称呼「恶心」，
      换「同学」太中性、玩笑会塌。新增此类例外须同样具名登记，不得泛化为「可自由偏离默认表」。
  - id: active-json-scope
    title: 一个词该不该进 active.json（v8 新增，三条件全满足才进）
    rule: |
      active.json 是 check_batch W2 的**单值字面比对**词表，也是**唯一随 context.md 注入译者**的定译清单
      （build_context 注入面＝active.json + style.md + voices/；glossary.vN.yaml 不进 context.md）。
      入表三条件：
        ①**已可裁决**——饱和度过闸（≥0.8），或有 saturation-gate-override 里的具名覆盖理由；
        ②**尚有未译占位**（全 ledger 出现数 > 已入线数）——W2 只在待译批次上跑，
          对饱和度 1.000 的词永不触发，登记只增词表长度。此类词改记 ratified 节；
        ③**单值且实测无误报**——对已入线全部译文算 W2 命中率，须≈1.000，且该词不按义二分。
          二分词（モチーフ／ジュース／シンプル）刻意不收，其分治口径改写进 style.md，否则译者看不到。
      值可以是**词干**（如 寝癖→登记「睡翘」），意为「该词干须出现在译文里」，中文按句法位置自由变形（v7 体例）。
  - id: saturation-gate-override
    title: 饱和度闸门（gate=0.8）的具名覆盖理由（v8 新增）
    rule: |
      闸门衡量的是「本词的语料证据是否已足够多到可以从中归纳出稳定译法」，默认**未过闸即滚存到下段**——
      在 10% 的证据面上锁死全书术语正是 spec §0 要避免的过早收敛。
      以下四类是**证据量之外的强制约束**，可覆盖闸门，但每次覆盖须在本表逐条写明属哪一类：
        O1 **对偶/对仗依赖**——对偶词已在表内，或伏笔回收句靠该词的字面对仗才成立
           （v8 首案：バッドエンド 对 ハッピーエンド；両思い 对 15768/15769 的『ではない』反转句）。
        O2 **已入线译文自相矛盾**，须回改统一（v8 首案：ジュース，9825 的候选是草莓牛奶/咖啡）。
        O3 **牵动冻结骨架或图片轨**，两轨必须同向（v8 首案：贋作/ニセモノ 与卡 41 链词、选项图）。
        O4 **用户当场裁定**（v8 首案：裏技→作弊）。
      不构成覆盖理由的（曾被提出并驳回）：「这个词很显然/没有歧义」「已入线部分零例外」「它是机制词」——
      前两条恰恰是过早收敛最常见的自我说服，第三条只提高优先级、不改变证据量。
      典型驳回例：分岐→分岔 已入线 31/31 零例外且是玩家须辨认的机制词，仍按 0.585 滚存。
  - id: recall-must-be-visible
    title: 回改项若不进 glossary/style.md/voices，须在 notes 留显式记录（v9 新增）
    rule: |
      背景（seg2-s3 §45 的实测结论）：生产会话开工时登记过一条风险——**patches 是覆盖层，
      而译者读到的前缀正文来自 append-only 的 forward**，于是「已回改的旧译法」可能仍在
      前缀里现身，被下游批次当成先例照抄。本段两处验收（10639 千秋→彩野姐姐、
      10454 ジュース→饮料）**均未兑现该风险**，原因是 `context.md` 第四节整篇内嵌
      `active.json` + `style.md` + 7 份 `voices/`，**冻结骨架的优先级压过了前缀里的历史文本**。
      但**风险并非不存在**：它依赖「被否决的旧译法恰好被 glossary/style.md/voices 覆盖」。
      一旦某次回改的理由是纯语感/纯本地化（不产生任何可登记的词条），这层保护就不存在。
      规矩：**每条回改必须落在至少一个「译者看得见」的面上**。译者看得见的面只有三个——
      `active.json`、`style.md`、`voices/*.md`（`build_context._render` 的注入面；
      `glossary.vN.yaml` 与 `skeleton/anchors.yaml` 之外的 skeleton 均**不**进 context.md）。
      若某条回改在这三面里都无处安放，**须在 `pilot/lanes/<lane>/data/notes/<chapter>.md`
      追加一条显式记录**（写明 id、旧译、新译、一句话理由），使它至少出现在同章后续批次的
      译者手记里。适用先例：SEG-1 的 `裏技`→作弊；本段的 11565／12244／12166／12128／12129。
      反面不适用：本段的 `射的`→打气枪 已进 active.json + speakers.json，`屋台`→小吃摊、
      `ペン`→签字笔 已进 style.md/glossary，均无须另留 notes。
