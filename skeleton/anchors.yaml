      zh: "我做出微笑。_n或者说，努力牵动脸上的肌肉，让自己能露出微笑。"
      recall: "微笑的努力复现句，定译源 voices/naoya.md §3；s5s 15173 仅主语作「私」（另条，zh 相同）；s7f 16395 过去式变体（另条）。任务书所记 e2f 镜像经查不存在，实际复现在 s5s/s7f。"
