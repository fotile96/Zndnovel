# v19 修订（2026-08-19）：故事层人名罗马音化（Ayano/Yuichi/Yukari/Sakura…）+ 天文馆→天象馆已落于 title_zh/body_zh；tr_note 保持历史原文。涉名流式 body 经 tools/zh_wrap（jieba）重排（宽 12 全角），结构卡逐行替换保结构。
# v22 修订（2026-09-08）：卡 73「参加社团活动的孩子→学生」（v19 C3 漏网）；body 换行＝tools.bake_card.plan_body 输出（v21 口径）。

- card: 40
  variant: "a"
  title_zh: "对Yuichi嘛……"
  body_zh: "Ayano回答Sakura\n说，对Yuichi谈不上\n喜欢，也谈不上讨厌。"
  tr_note: "标题依 plotTitle 无句尾句号（卡面实为「……。」，差异记于 jp 侧 note）；「ユウイチのことは……」以「嘛……」再现支吾拖音，与卡 38「含糊其辞」选项的结果卡定位相合。"
- card: 41
  variant: "a"
  title_zh: "选择：谜题"
  body_zh: "正确答案：\n「女孩」\n普通的家→父母→被关起来\n\n「画作」\n没有问题→原作→假货"
  tr_note: "谜题语境依 s2s_190_sel 系列：女孩题＝所见惊人光景其实是「普通的家中景象」、起因是父母（她自幼被关在阁楼）；画作题＝赝品做工没有问题、原因出在原作（原作本身是假货）。「→」箭头链与两题间空行依原卡；日文「→ニセモノ」因行宽折行，中文一行排下不再折。**v8 回改（用户裁决 2026-08-02）**：链尾原作「赝品」，但它对应的原文是 `ニセモノ` 而非 `贋作`——正文轨 v8 已定 贋作→赝品（9593–9615，7/7）／ニセモノ・ニセ物→假货（9597/9598/9609，3/3），旧译与正文轨反向，且链尾读「赝品」会被理解成「贋作那件东西」，而原意是「原作本身是假货」。图片轨待办：选项图 `png/select/sel_s2s_193c_sel_b`＝『元にした物がニセ物』须同向作「假货」。"
