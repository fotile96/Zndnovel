      确指部位的描写语境可用「手臂」。复现句族逐字以 skeleton/anchors.yaml 为唯一基准；
      已人工核准的卡面译文（cards.zh，如卡 170/171）维持原判不追溯。}
  - {jp: 手首, zh: 手腕, note: 与 腕 分立（手首をつかむ→抓住手腕），勿与「手」混用}
  # 纸张类三分法（用户裁决）
  - {jp: メモ, zh: 字条}
