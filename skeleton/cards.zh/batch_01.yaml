# 字段与断行/结尾标记/选择卡诸约定同 batch_00.yaml 头注（每行 ≤12 全角、title ≤14 全角；
#   （おわり）→（完）、（完結）→（完结）贴行末；选项行独立成行；「の展開があり。」→「有以上分支展开。」）。
# 本批补充：
#   - 卡 41（谜题答案卡）保留「→」箭头链与两谜题间空行；链词日后与 select 选项图译文统一。
#   - 卡 61 原卡（完結）独行且非整数缩进，中文重排后统一按贴行末处理。
#   - 卡 40/70 标题依 plotTitle 不带句尾句号（卡面多句号差异见 jp 侧 note）。
