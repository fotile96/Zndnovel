# 术语表 v20 —— 2026-08-26，P5 SEG-5 段末：数字形制的两条细化
#
# append-only：本文件只增不改，v19 的全部条目继续有效。本版只做一件事——
# 把 v19 `word_families.概数序数` 那条规则的**两个边界**写实。原条文是：
#
#   概数（两三年/一两次）与序数（第二名）汉字化，计量位维持全角随原文
#
# 两次实测显示这条在边界上不够用：SEG-5 的 16223 与全库清点各撞到一处。

# ══════════════════════════════════════════════════════════
# 修订一：序数的判据是「原文是不是序数形」，不只是「〜位」
# ══════════════════════════════════════════════════════════
revision_v20_ordinal:
  rule: >
    序数一律汉字化。判据看**原文的序数形**，不只看名次词 `〜位`——
    `〜ページ目`／`〜年目`／`〜枚目` 这类 `〜目` 结尾同样是序数形。
  why: >
    v19 的 `概数序数.exempt` 写着「序数面已净（14409 维持）」，但当时只扫了
    `〜位`。2026-08-26 全库清点扫出三处 `〜目` 漏网，全部改齐：
  recall_ids: [247, 2184, 15567]
  detail: >
    247 `手帳の１ページ目`→「笔记的**第一页**」；
    2184 `５年目になる`→「今年是**第五年**」；
    15567 `１枚目の`→「**第一张纸**上」。

# ══════════════════════════════════════════════════════════
# 修订二：计量位按位数分——一位数汉字化，两位数及以上维持全角
# ══════════════════════════════════════════════════════════
revision_v20_measure:
  rule: >
    计量位（人数、个数、次数…）**一位数汉字化**（两个人／三个汉堡／四个人），
    **两位数及以上维持全角随原文**（３０个人／２５５个汉堡／５１２个／１５分钟）。
  why: >
    v19 原条文是「计量位维持全角随原文」，一刀切。实测中文里小数目用全角读着别扭
    （`２个人`），大数用汉字又太长（`五百一十二个`）。用户 2026-08-26 裁定按位数分。
  recall_ids: [16223, 7702, 14404, 15886, 15893]
  detail: >
    16223 `２人の人物`→「**两个人**」（SEG-5 裁决时人工改，本条为其追认）；
    7702 →「**三个**汉堡」；14404 →「**四个人**一起玩」（同行的 `１５分钟` 维持全角）；
    15886 →「这**四个人**」；15893 →「『登场人物**四人**』」。
  boundary: >
    **不适用**于以下几类，它们的全角是形制不是计量，一律维持：
    ①章节／段编号（`セクション４`→「章节４」，750／751／17167）；
    ②暗号数字串（6259／6426 族，v19 已豁免）；
    ③年份、时刻、页码等编号位；
    ④**原作自己就把汉字与全角混排**的行——`三週間に１度`（3968）、
    `１回打ったから、残りは三発`（5279）——照搬混排，不要"修复"。
  scope_note: >
    2026-08-26 全库复扫：序数位仍全角 **0**、一位数计量位仍全角 **0**
    （上面 boundary 列的五处除外，它们不属计量位）。全库仍含全角数字 457 行，
    均为编号／暗号／大数／原作混排。

# ══════════════════════════════════════════════════════════
# 顺带澄清：『登場人物４人』不是卡名
# ══════════════════════════════════════════════════════════
clarify_v20_not_a_card:
  note: >
    15893 的 `『登場人物４人』` 读起来像卡名，实际**不是**——`plotTitle` 与
    `skeleton/cards.{jp,zh}.yaml` 全表都没有这张卡；它是直哉对"那四张人物名卡"的
    描述性指称（真正的卡在 15895 叫 `『それぞれの人物名』`）。故本次改它
    **不需要动 skeleton**，`skeleton-v2` 冻结面未受影响。
