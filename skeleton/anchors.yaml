      jp: "【由加里】「もう一度だけキスして。……お願い」"
      zh: "【由加里】「再吻我最后一次。……求你了」"
      recall: "定译源 voices/yukari.md §6；她在直哉身上送别Yuichi的影子；与 e1s 天台线（3962/3963 组）对读。"
    - id: 16225
      jp: "『誰も見た事のない夕焼けの秘密は、屋上に行けばわかる』。――『屋上の夕焼けには真実が見える』、だ。"
      zh: "『谁都没见过的晚霞的秘密，去天台就会明白』。――就是『天台的晚霞里，能看见真实』。"
