    尚无进展一事感到惊讶。'
  tr_note: 「两情相悦的咒语」与卡 35 第 4 选项字面一致。
- card: 38
  variant: a
  title_zh: 选择：对Yuichi的心意
  body_zh: '「直说喜欢」

    「含糊其辞」

    有以上分支展开。'
  tr_note: 「含糊其辞」与卡 33 第 3 项同译。
- card: 39
  variant: a
  title_zh: 喜欢Yuichi
  body_zh: 'Ayano回答Sakura说，自己

    喜欢Yuichi。Sakura报以

    仿佛放下心来的笑容。'
  tr_note: ''
- card: 40
  variant: a
  title_zh: 对Yuichi嘛……
  body_zh: 'Ayano回答Sakura

    说，对Yuichi谈不上

    喜欢，也谈不上讨厌。'
  tr_note: 标题依 plotTitle 无句尾句号（卡面实为「……。」，差异记于 jp 侧 note）；「ユウイチのことは……」以「嘛……」再现支吾拖音，与卡
    38「含糊其辞」选项的结果卡定位相合。
- card: 41
  variant: a
  title_zh: 选择：谜题
  body_zh: '正确答案：

    「女孩」

    普通的家→父母→被关起来


    「画作」

    没有问题→原作→假货'
  tr_note: 谜题语境依 s2s_190_sel 系列：女孩题＝所见惊人光景其实是「普通的家中景象」、起因是父母（她自幼被关在阁楼）；画作题＝赝品做工没有问题、原因出在原作（原作本身是假货）。「→」箭头链与两题间空行依原卡；日文「→ニセモノ」因行宽折行，中文一行排下不再折。**v8
    回改（用户裁决 2026-08-02）**：链尾原作「赝品」，但它对应的原文是 `ニセモノ` 而非 `贋作`——正文轨 v8 已定 贋作→赝品（9593–9615，7/7）／ニセモノ・ニセ物→假货（9597/9598/9609，3/3），旧译与正文轨反向，且链尾读「赝品」会被理解成「贋作那件东西」，而原意是「原作本身是假货」。图片轨待办：选项图
    `png/select/sel_s2s_193c_sel_b`＝『元にした物がニセ物』须同向作「假货」。
