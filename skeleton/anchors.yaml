      jp: "だから、_n今、_n『物語』を。"
      zh: "所以，_n现在，_n该讲『故事』了。"
      recall: "全篇框架句；与 e2f 4793/4794「――故事。得把故事，续写下去才行。」及 5647「第二物语」收束链呼应；「物語→故事」v4。"
