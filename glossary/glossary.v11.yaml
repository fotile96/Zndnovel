conventions:
  active-json-key-coverage-3rd-direction:
    since: v11
    title: 「键」的第三种失效方向——标记与空格会切断词键
    body: >
      v10 已记两个方向（键太窄→静默漏检；键太宽→跨词边界误报）。v11 补第三个：
      **原文里的标记与空格会把词键切断，使饱和度算出 0/0**，外观与「原文没这词」完全相同。
      本段实测两例：
      ① **ruby 标记**——`紡ぎ出す` 键算出 0/0，因为原文是 `<紡,つむ>ぎ出す`；词干 `紡` 才是 4/4。
      ② **分かち書き空格**——`スープのもと` 键算出 0/0，因为绘本原文是 `スープの もと`；`スープ` 才是 4/4。
      另本段还实测到一次「键太窄」的活用形失效：`耳をかたむける` 算出 0/0，原文是连用形 `耳をかたむけ`，
      真实饱和度 3/19 = 0.158（19 行里 16 行是 crd 的『【（ヒント）】章节５…』模板串）——
      **若不核对就照 0/0 当「无出现」，会把一个 16% 的词误当成可裁决词。**
      纪律不变：**任何 0/0 一律回原文核对后再定**，且核对时要同时想到「窄／宽／被切断」三种可能。

  saturation-is-not-evidence-by-itself:
    since: v11
    title: 饱和度数字本身不是证据——命中的原文必须逐行看过
    body: >
      `ラスト` 本段实测：饱和度表报 8 出现 / 6 覆盖 / 0.750（可裁决），逐行核对后
      真正作「末尾」义的只有 1 处，其余是 `コントラスト`（4）与 `イラスト`（2）。
      **数字是对的，含义是错的。** 凡准备把一个词登进 active.json，
      在算 W2 之前先把该键在 ledger 里命中的每一行原文打印出来看一遍——
      这一步的成本是几秒钟，省掉它的代价是一条永久误报的词条。
      片假名短键（`ラスト`/`メモ`/`ベース`/`ピンチ`）尤其高危：片假名词之间天然大量互相包含。

  frozen-skeleton-answers-first:
    since: v11
    title: 拿到「需委员会拍板」的项，先查冻结骨架的 tr_note
    body: >
      本段交上来的三条「需裁决」里有两条**骨架早已定稿**：
      `口づけ` vs `キス` 的分层写在 cards.zh 卡 80 的 tr_note 里；
      日期全角/半角的正文-卡名分离写在卡 193 的 tr_note 里。
      译者与生产会话都读得到 cards.zh，但 **tr_note 字段不进 context.md**，
      所以现场看不到它——这不是谁的疏忽，是注入面的边界。
      **裁决会话的固定动作：任何用词/体例类提案，先 grep skeleton/cards.zh 的 tr_note。**
      （开发轨可考虑把命中批次卡片的 tr_note 也注入 context.md，见移交待办。）
