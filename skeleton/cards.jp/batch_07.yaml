# skeleton/cards.jp/batch_07.yaml — 卡面日文转写 batch 07（card 140–159）
# 来源：png/card/crd_<N>_a.png 逐字转写（规程 A）。
# 字段：card(int) / variant("a"|"d") / title_jp / section_label / body_jp / note
# 约定：
#   - 卡面上的换行处以 \n 记录（双引号标量，\n 为换行转义）。
#   - section_label 为右栏全部文字；右栏上下两个标签槽位之间以 \n 相连
#     （如 "セクション4\nあらすじ"）。
#   - 右栏标签「セクション4」的「4」在卡面上为半角字形；
#     卡 140–145 右栏仅有一行「物語あらすじ」，无第二标签槽位文字。
#   - 卡 140–144、158 标题中的拉丁字母与数字为全角字形（Ｓｅｃｔｉｏｎ６、
#     ＳｅｃｔｉｏｎＥｘ１、ＥＸ２ 等，与 snr_common.lua plotTitle 逐字一致）；
#     卡 158 右栏标签中的「EX2」为半角字形。
#   - 特例：卡 144 只有标题与右栏标签，正文区无任何文字（见该条 note）。
