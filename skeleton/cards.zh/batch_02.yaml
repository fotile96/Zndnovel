  variant: "a"
  title_zh: "与Yuichi接吻"
  body_zh: "烟花升上夜空。Yuichi和\nAyano亲吻了。（完结）"
  tr_note: "标题キス→接吻、正文口づけ→亲吻，随原卡用词之别；（完結）→（完结），末行恰排满 12 字宽、无垫空格。"
