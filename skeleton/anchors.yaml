- chapter: s0f
  items:
    - id: 6067
      jp: "【私】「どうぞ。……遅かったわね。道、混んでた？」"
      zh: "【我】「请进。……来晚了呀，路上堵车？」"
      recall: "定译源 voices/yukari.md §6；与 e1f 3904「请进。……来得真早，路上很空？」为镜像句对（同一房间、同一转笔癖、相隔五年），两处措辞须互文。"
