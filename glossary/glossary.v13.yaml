      まあまあ、と言ったところ: 算是还可以吧
    scope: 0 行回改（三形现状即自洽）
    saturation: ほどほど 1.000 / ぼちぼち 1.000 / まあまあ 0.818
    rationale: >
      三个近义词在原文里是三个不同的词，且 4673/4674 是**同一轮对答的一问一答**
      （ユウイチ 答「ほどほどって所」→ ユカリ 答「ぼちぼちって所」），合并会读成复读。
      3910（e1f）的第三形与前两形同族。成条的目的是**免得下段遇到同词再判一次**。
    key_scope: >
      ⚠ **键必须锁在「〜って所／と言ったところ」构式上，不得登记裸 `まあまあ`。**
      裁决会话实测：まあまあ 未覆盖的 2 处**都不是「还行」义**——
      5183（e2f）『【直哉】「まあまあ。他にも行くところは…」』是**劝解语气词**（好啦好啦），
      5842（e2s）『【≦看護師≧】「まあまあ！ すっかり大きくなっちゃって！」』是**惊叹词**（哎呀呀）。
      登记裸词会在 seg7 两处全部误报。见 conventions/w2-key-must-match-the-construction。

  - id: hodouin
    title: 補導員 → 辅导员（否掉译者造的「风纪指导员」）
