# W4 复现句族豁免清单（`tools/polish_check.py --w4-full` 读取）
#
# 与 config/qa_quote_suppressions.yaml 同一套纪律：
#   · 清单与数据分开存放，评审能一眼看全「我们一共豁免了什么」；
#   · `reason` 必填，缺一条就拒绝加载整份清单——没有理由的豁免等于把闸悄悄关掉一块；
#   · **被豁免的命中照样打印、照样计数**，只是不计入「需要处理」那一栏。藏起来等于恒绿。
#
# ## 为什么每条都要登记 `forms`
#
# 只按 jp 豁免整个句族，会在「这个族日后冒出清单外的第三种译法」时静默放过——那正好是
# 这道闸最该响的时候。所以豁免记录必须连**豁免当时该族并存的全部译法**一起登记；判定时
# 要求该族的现有译法集合是登记集合的**子集**，出现新形就照常报出来，并在消息里点明
# 「该族已豁免、但出现了清单外的新译法」。
#
# `ids_at_exemption` 只是留痕（豁免当时该族有哪些 id），不参与判定。
#
# 字段：jp / forms / reason（必填）/ date / source / ids_at_exemption
