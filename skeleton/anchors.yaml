      zh: "【Yuichi】「我喜欢Ayano。比谁都喜欢」"
      recall: "改写后故事层的告白定稿；说话人标签【Yuichi】而语音为 NAO——同名诡计最终形态，译文不点破；「喜欢Ayano」与 16337/16343 同族。"
