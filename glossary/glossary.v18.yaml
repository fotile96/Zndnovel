w3_recalibration:
  what: "`check_batch.w3_ratio()`：对白行 1.15 → **1.25**，其余维持 1.15"
  why: >
    连续三段的实裁：SEG-5 `15970`、SEG-6 `4065`、SEG-7 `5216` 三次撞 W3 都由用户
    **主动放行**，三次全在带 `【说话人】` 前缀的纯对白行，三次的理由同构——
    「压回行宽就会丢掉语气、指向或体貌」（分别丢时间指向、邀请口吻、习惯体＋同位语）。
    成因是结构性的：**日语对白短，汉语补主语、补语气词、把习惯体显化之后天然更长**；
    旁白/叙述行没有这个压力，故只放宽对白一侧。
  impact_measured: >
    改前按控制会话自己立的前提跑了影响面（全八段候选 34,130 行 + 车道现行 16,693 行）：
    **候选面 212→158（少报 54，占 0.16%）；已入线面 99→71（少报 28）。**
    少报的 28 行**全部是对白行**（设计如此）；按超限幅度排序抽看前 12 条，
    「骗你的骗你的。开玩笑开玩笑」「问过什么……」「……工作的地方，之类的……」之类，
    **没有一条像是真会溢出的**——全是日语极短、汉语补完语气词后自然变长。
  keyed_on_jp: >
    ⚠ `w3_ratio()` 按 **jp** 判是不是对白行，不按 zh。若按 zh 判，
    一条丢了 `【】` 前缀的译文反而会拿到宽松阈值——那等于**奖励 R2b 违规**。
    该判据有专测钉死。

