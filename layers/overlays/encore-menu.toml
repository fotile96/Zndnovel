target  = "snr_mainmenu.lua"
profile = "release"
why     = """
依据 docs/finale/mainmenu-entry-plan.md（机制测绘）与
docs/ops/finale-stage-impl-2026-09-02.md（落地记录，L845 硬编码 11→#layerKeyCur、
共享循环 6 处 layerKey3→layerKeyCur 的定案）。commits a9533a0（8 处改动落地）与
653b0ad（层 198 常驻方案证伪回退，snr_common 零改动、snr_mainmenu 净变化收窄）。
七个操作把「卡 140∧144」新增第五种菜单形态：L1 表加 layerKey4（12 项，插入
finale 于 section7 之后）与 title_14_a 的宽 117/高 68；绘制函数新增 elseif 分支
（工作层同步 layerLoad 直载 title_14_a——层 198 常驻已证伪，见 CLAUDE.md「已知坑」）；
CIRCLE 分发插 finale 项（doScriptScene=fin-10 → run snr_finale）；原「卡140∧¬144」
分支补 l0_0.layerKeyCur = l0_0.layerKey3，让菜单尾部三处共享重绘调用（L845 循环
上界、两处 layerKey3[l1_1]/[l1_0] 各 3 处）改用 layerKeyCur 而非写死 layerKey3——
无 144 时走 layerKey3（11 项，原版面逐字保留），有 144 时走 layerKey4（12 项）。
⚠ op4 的锚点「elseif l1_0 == l0_1.library then」在基座里命中 2 次（形态 2 与
形态 2+140 两个 CIRCLE 分发块共享这行文本，缩进相同）——用 count=2、occurrence=-1
钉住「最后一处」而非改锚点本身：真正要接续的是 section7 那条 CIRCLE 分支（其后
紧跟 library 分支），只有形态 2+140 的那一份具备 section7，是 occurrence=-1 命中的
那处；形态 2（无 140）的 library 分支前面没有 section7 分发，不应该、也从未被
今日的手工改动触碰。
encore 项横向摆位 2026-09-11 由 194 改 184：用户目检「偏右」，按盘上实际烤字面
（build/sysgim_title_zh 与 finale_menu）量墨迹质心——主列 story/fragment/section7/
library/option 的质心在 x≈239–243（bbox 中心 241.5–245），encore 在 x=194 时质心 251.9、
右偏约 10 px；x=184 时质心 241.9、bbox 中心 242.5，与主列齐。原 194 是按日文面
（带小注、墨迹更宽）估的，小注擦掉后主列的墨心整体左移，encore 没跟着改。
"""

