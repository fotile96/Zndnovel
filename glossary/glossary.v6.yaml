  - {jp: 手帳, zh: 笔记, note: （或【笔记本】，根据上下文选择更通顺的）用户裁决，更符合中文习惯}
  - {jp: 物語, zh: 故事, note: v4 起与お話合并同译「故事」（用户裁决）；专名例外：「第二物语」「已失去的梦之物语」保持「物语」}
  - {jp: お話, zh: 故事}
  - {jp: 記憶ルート, zh: 记忆路线}
  - {jp: １５分の記憶, zh: 15分钟的记忆}
  - {jp: セカンドノベル, zh: 第二物语, note: 用户裁决＝中文社区通称；logo/标题图另由图片轨处理}
  - {jp: Ｔｒｕｅ Ｃｏｌｏｒ, zh: True Color, note: 保留英文（spec 定）}
