#
# 人工核对状况（未逐条全核）：q2/q5/q12/q16 的标准答案已比对本段译文原句；q12 曾疑「翻过围栏」
#   主语有误，查证为两个不同场面（1047 行是アヤノ、2422 行是ユウイチ），主语无误。q16 提到「彩野
#   在现实里从天台跳下去」经核为本段正文原有（直哉的联想），非标准答案外泄后文。
#   q13/q14 的 info_point 经人工改写（原稿把门控归属标错）。其余各题未逐句复核。
segment: seg3-s4
questions:
  - id: q1
    question: "ユウイチ独自琢磨字条来历时，认为自己需要弄清哪两点？"
    reference: "一是字条是被『某个人』塞进他口袋的，还是有人递给他的——但他没有从谁手里接过东西的记忆；二是『什么时候』被塞进来的——他不记得课间休息时有谁靠近过自己。他还补充说约两小时前课间买饮料时右边口袋里装着零钱包，若当时有字条应该会发现。"
    info_point: "ユウイチ视点开场后的第一段内心推理，体现第一人称叙事与理性口吻。若译文把『塞进来/递过来』的区别混淆或漏掉两个问题，后续他去图书室试探ユカリ老师的动机就不成立。"

  - id: q2
    question: "ユウイチ口袋里露出来的那张字条上写着什么内容？"
    reference: "『谁都没见过的晚霞的秘密，去天台就会明白』。写在名片大小的小纸片上，字迹偏小、接近圆体字，看上去像女孩子写的字。"
    info_point: "字条是第4章核心指引道具。若译错『晚霞』『天台』等关键词，ユウイチ上天台、遇见サクラ、夕阳=真实的主题都会失联。"

  - id: q3
    question: "アヤノ反复否认字条是自己放的后，ユウイチ和アヤノ各自去了哪里？"
    reference: "ユウイチ说字条好像挺有意思，决定上天台看看；アヤノ说自己还有事，要去小菊（田径部的孩子）那边一趟。两人分头行动，ユウイチ独自顺着楼梯上了天台。直哉在后续对话中确认：『不是我』的展开会回到章节３。"
    info_point: "s4s_30_sel「私じゃない」分支的后果：两人分开，ユウイチ独自上天台，故事转入ユウイチ视角。若译文让两人同行，ユウイチ单独遇见少女及アヤノ去找小菊打听楼梯传闻的支线都无法成立。"

  - id: q4
    question: "ユウイチ到图书室向ユカリ老师打听字条时，ユカリ老师做了什么让他立刻离开？"
    reference: "ユカリ老师没有回答，而是默默拉住ユウイチ的手，把他带到百科全书的书架那边——周围没有其他学生——然后伸手环住了他的肩膀。ユウイチ甩开老师的手，说了句『我走了，再见』就走了。"
    info_point: "ユカリ老师与ユウイチ的特殊关系伏笔，也是后文直哉/彩野讨论『章节3目击两人抱在一起』的回收点。若译文把环肩弱化成普通肢体接触，暧昧与紧张感都会丢失。"

  - id: q5
    question: "ユウイチ在天台把字条给那个少女看时，少女是怎么反应的？之后她说了一句什么意味深长的话？"
    reference: "她瞥了字条一眼，没有露出半点迟疑，轻轻点了点头——承认字条是自己放进去的。她接着问ユウイチ看到字条时怎么想，随后低声说：『明明如果是你，说不定就能救下她的。』"
    info_point: "少女=サクラ的身份確認与『说不定就能救下她』的关键伏笔（关系到谁从天台坠落）。若译文把她的承认译成否认或犹豫，后面的对话与消失都变得不合逻辑。"

  - id: q6
    question: "少女说完『说不定就能救下她的』之后，ユウイチ听到了什么？他查看的结果如何？"
    reference: "先是从身后传来响动，回头却没有任何人的身影；接着从『下面』传来一种沉闷的、不祥的声音，随后是连续两次尖叫。他跑到铁丝网边朝中庭望去，但中庭和平时完全一样，并没有人掉下去。"
    info_point: "『从下面传来的声音』是全篇最重要的悬念装置。若译文把『下面』『中庭』的空间关系译错，读者会不知道声音来自哪里，サクラ消失与ユウイチ慌张去找アヤノ的连锁反应也无法理解。"

  - id: q7
    question: "ユウイチ回到教室找アヤノ时，看到教室里是什么状态？"
    reference: "以アヤノ的课桌为中心，像是画了一个圆一样，周围一圈课桌横倒在地；アヤノ的书包被随意扔在地板上，签字笔、铅笔、笔记本等文具散落一地。『只有』アヤノ的东西是这样。"
    info_point: "教室的异常是『アヤノ出事』的视觉信号，『只有』二字强调她被单独选中。若译文丢掉『只有』或把课桌倒地的范围模糊化，ユウイチ的不安和后续寻找都失去依据。"

  - id: q8
    question: "ユウイチ在アヤノ的笔记本里发现了哪些东西？请至少举出三样。"
    reference: "①夹在书页里的橡皮，上面刻着『ユウイチ』的名字；②记着按五十音顺序排开的文字的一页（ユウイチ认出是钱仙用）；③借夕阳斜光才看清的一页上有被擦掉的淡淡字迹，读作『ユキ』；④最后一页正中间写着『再见』；⑤翻页时手指被纸边缘划破流血。"
    info_point: "笔记本是回收章节1（钱仙）、章节2（橡皮写名字）道具的集合点，『再见』与『ユキ』是ユウイチ不祥预感的来源。若这些细节译丢，后文4B中笔记本变空白的反转也失去铺垫。"

  - id: q9
    question: "ユウイチ和アヤノ后来去教职员室查学生名册找『サクラ』，结果如何？"
    reference: "整个学校（不只他们班或年级）的学生里，姓或名带『サクラ』的一个也没有；唯一的例外是1年级一位叫『樱子（サクラコ）』的学生，但アヤノ去见了之后确认不是同一个人。此后サクラ再没有出现过，关于她的情报就此中断。"
    info_point: "4A『消えたサクラ』结局的关键事实：サクラ在学校里不存在。若译文把例外者处理成サクラ本人，或把范围缩小到班级，超自然感和结局意义都会崩掉。"

  - id: q10
    question: "4A结局里，ユウイチ和アヤノ后来每到傍晚就会做什么？这个习惯是怎么来的？"
    reference: "没有特别的事要办的傍晚，两人会一起去天台。因为サクラ说过『当橙色的光把四周包裹起来的时候，据说就能看到谁都没见过的晚霞』，而她自己『没有资格看』；ユウイチ和アヤノ相信在天台看落日说不定就能看见『真实』。ユウイチ指着夕阳说『真美啊』，アヤノ点头。"
    info_point: "4A结局的核心意象：橙色晚霞与『真实』。若译文把『真实』译成普通形容词（如『很美』），这个『晚霞=真实』的主题就完全丢失。"

  - id: q11
    question: "在4B展开中，アヤノ独自检查与サクラ的交换笔记本时发现了什么异样？"
    reference: "笔记本里原本写满的字全部消失，每一页都是干干净净的空白；她确认书脊处也没有撕页的痕迹，像是整本被掉包了一样。而且这时她又听到了刚才已经听过一次的『歌』的旋律。"
    info_point: "4B『サクラを待つ』的核心超自然现象：サクラ存在的痕迹被抹去。若译文把空白笔记本解释成『被偷了』或『拿错了』，就失去了『存在消失』的含义。"

  - id: q12
    question: "4B的最终场景中，アヤノ透过走廊窗户在天台上看到了什么？她喊话之后结果如何？"
    reference: "她看到ユウイチ和一个长头发的女孩子在天台上，月光照到脸时认出那是サクラ。アヤノ打开窗户大喊『ユウイチ！』，ユウイチ的脸慢慢转向她，但没有回答；就在アヤノ要第二次呼喊时，两个人慢慢地、把脚往前迈了出去。"
    info_point: "4B 结局：ユウイチ 被 サクラ 带向死亡，アヤノ 无能为力，与 4A 的得救形成对照。若把『两个人迈出脚』译成『ユウイチ 迈出脚』或模糊处理，Bad End 的事实与冲击力都会受损。**背景（题面未问、不计入判分）**：喊话之前 ユウイチ 已翻过围栏背靠栏杆（2422）、サクラ 握住他的手（2436）——首跑时标准答案含这两点，而题面限定的是『喊话之后』，受试按题面正确作答却被判『部分对』。**标准答案宽于题面即制造假阳性**，故收窄。"

  - id: q13
    question: "直哉在归纳サクラ的提问规律时得出了什么结论？对字条回答『没有兴趣』会怎样？"
    reference: "直哉说，サクラ递来话题（钱仙、咒语、楼梯传闻等）时，凡是回答『没有兴趣』『真无聊』或者拿它开玩笑的，故事都会变成Bad End；具体到字条，回答『没有兴趣』的话，她（サクラ）就会消失掉。"
    info_point: "サクラ 提问的分支规律：回答「没有兴趣」「真无聊」或拿它开玩笑 → Bad End。这是本段内的分支门控（**不是** review_focus 里的 s4s_490_sel→s8——那条需持卡 141 才出现第 3 项，本段正文未走到）。若译文不点明「没兴趣→Bad End」的规律，读者无法理解选择肢的意义。"

  - id: q14
    question: "直哉认为要走到『查看アヤノ课桌』的场面，ユウイチ在天台上必须怎样回答サクラ的提问？"
    reference: "必须回答『试着相信也无妨』（相信サクラ同学）。直哉说这样回答之后，サクラ的回应是『夕阳的事，アヤノ同学大概也是相信的哦』——彩野同学正是在听到这句话后，提出要追加『查看课桌』的展开。"
    info_point: "通往「查看アヤノ课桌」→笔记本→4B 路线的触发条件：须回答「试着相信也无妨」。这是本段内的分支门控（**不是** review_focus 里的 s4s_100_sel→e1——那条需持卡 142 才出现「先生を受け入れる」，本段正文未走到）。若把回答内容或サクラ的回应译错，4B 分支的触发条件就断了。"

  - id: q15
    question: "ユウイチ在分析字条时提到自己身上背着一个『致命的缺陷』，是什么？"
    reference: "睡眠不足。他说最近就算钻进被窝也几乎没有睡着过的感觉，上课时意识发飘、集中不了，所以就算真的从谁手里收下过字条，也很可能转头就忘个精光。"
    info_point: "ユウイチ第一人称口吻与个人状态的呈现，解释他无法确定字条来路的原因。若译文把这个缺陷译成别的（如『记性差』），与后文的具体挣扎脱节。"

  - id: q16
    question: "彩野同学看到字条上的内容后，说了什么让直哉感到吃惊的话？"
    reference: "她说那张字条上写的内容，自己总觉得好像『在现实里也见过』，虽然说不清是什么时候、在哪里见的。直哉由此想到，这说不定和彩野同学在现实里从天台跳下去的事有关。"
    info_point: "字条连接故事与现实的接口。若译文把『在现实里见过』译成『在梦里见过』或『在书里见过』，直哉联想到坠落事故的伏笔就被切断。"

  - id: q17
    question: "直哉解释ユカリ老师在图书室对ユウイチ的举动时，说这个场面和章节3的什么内容连着？"
    reference: "和章节3里『アヤノ同学目击到ユカリ老师和ユウイチ抱在一起』的场面连着；正因为有这个前情，ユカリ老师才会在图书室对ユウイチ做出环肩的举动。"
    info_point: "ユカリ老师与ユウイチ关系的跨章节回收，『抱在一起』是理解老师行为的关键。若译文省略或弱化这个『目击』，老师的举动就变得莫名其妙。"

  - id: q18
    question: "ユウイチ在天台找到アヤノ并试图阻止她时，アヤノ有哪些反常的言行？请至少举出两点。"
    reference: "①她威胁『你再往前来，我就从这里掉下去』，并张开双臂像小孩子模仿飞机一样；②她力气大得不正常，甩开ユウイチ时让他手腕隐隐作痛；③她说出『サクラ同学，消失掉了吧？』『如果サクラ同学是从这里掉下去的，你觉得她是怎么掉下去的？像这样？』等自己不该知道的话；④她反复喊『『约定』……约定不守可不行的！』『不要进到『我的里面』来！』；⑤最后她掰开ユウイチ抓住围栏的手指，又抓住他的手臂，ユウイチ心想『照这样下去真的要……！』——游戏结束（Bad End）。"
    info_point: "天台Bad End的分支表现——アヤノ像被サクラ附身，重复章节1的『约定不守可不行』。若译文把『不要进到我的里面来』或『约定』这些关键台词译丢，被附身感与章节1的呼应就消失了。"
