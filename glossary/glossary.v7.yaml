# 术语表 v7 —— 2026-08-02 P2 试点收尾裁决（Task 46 Step 2 人工评审 gate 通过后解冻术语层）
# v6→v7 变更点（七项体例/术语裁决 + 译者自标最高优先级四条，证据见
#   docs/superpowers/reports/2026-08-01-p2-pilot-report.md §8 与 .superpowers/sdd/2026-07-31-p2-pilot-opus-run/progress.md）：
#   ①お話/物語 合并规则新增「双关/元指称语境局部豁免」条款（结构性反例 847-852）；
#   ②新增「补『』」体例（两种情形之一方可补）；
#   ③「数字跟随原文」写明适用边界——不适用于母题实物名（用户裁决：2378 回改「十日元硬币」）；
#   ④〜さん→〜同学 默认表增列具名例外 ユウイチさん→ユウイチ先生（用户裁决：维持）；
#   ⑤新增 モチーフ，按「被取材的现实对象／作品题目」二分；
#   ⑥腕 的两个句族分治写进定译（撤销「需先定 s7f 兑现句」的跨段阻塞，理由见下）；
#   ⑦8144 汉字「由加里」闯入故事层＝原作孤例，照录不归一（写入 note 防后续批次被「统一」掉）；
#   ⑧译者自标最高优先级四条：扁桃体→杏仁核（假朋友）、寝癖→头发睡翘了、
#     『あらすじ』を作成する 动词缺口、メモ↔手帳 的指称优先原则。
# 召回令（v7，随本 commit 执行）：
#   - skeleton/anchors.yaml：成对补锚 8478 与 15775（サクラ 汉字呼名装置，全 696 条 SAK 行仅此 2 处）；
#   - pilot/lanes/opus/data/patches.jsonl：2378 回改「十日元硬币」（reason=recall, glossary_v=7）；
#   - glossary/active.json：新增 寝癖／扁桃体／十円玉。**新体例——active.json 的值＝「可字面校验的核心串」，
#     不必等于本表 zh 的完整定译**（用户裁决 2026-08-02）。缘由：check_batch W2 是 `term in jp and tr not in zh`
#     的整串比对，对随句法位置变形的短语类定译必然误报——寝癖→「头发睡翘了」实测 11 条已译行里误报 7 条（64%），
#     全部是正确译文。故 active.json 登记词干「睡翘」（11/11 命中，误报归零），完整定译仍以本表 zh 为准。
#     扁桃体→杏仁核、十円玉→十日元硬币 本就是单值实词，整串登记即可（实测各 1/1、11/11 零误报）。
#     **モチーフ 刻意不入 active.json**——它按义二分（原型／题材），而 W2 是单值字面比对，
#     收录必然对其中一读产生恒定误报（同 F8/F11 的噪声类型）；该条只在 glossary 里作人工准绳。
#   - glossary/style.md：补『』体例、数字跟随原文的适用边界、〜さん 默认表的具名例外。
#   本次**不**追溯 skeleton/cards.zh/（卡面定稿经用户核准，与本次各条相容）。
# 未裁决：notes/*.md 余下 212 条提案维持未裁决状态。理由——它们绝大多数是单次出现的章内提案，
#   而本段仅覆盖全书约 10%（35/339 批）；在 10% 的证据面上锁死全书术语，正是 spec §0 要避免的过早收敛。
#   P3 全量前应按母题/词族成批裁决，而非逐条即兴。
# 变更规则：只增版本号（v2, v3…）不改旧版；变更须发召回令（spec §2.3）
