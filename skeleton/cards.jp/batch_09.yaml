# skeleton/cards.jp/batch_09.yaml — 卡面日文转写 batch 09（card 180–195 及编外卡 200）
# 来源：png/card/crd_<N>_a.png 逐字转写（规程 A）。
# 字段：card(int) / variant("a"|"d") / title_jp / section_label / body_jp / note
# 约定：
#   - 卡面上的换行处以 \n 记录（双引号标量，\n 为换行转义）。
#   - section_label 为右栏全部文字；右栏上下两个标签槽位之间以 \n 相连
#     （如 "セクション5\n日記"）。
#   - 右栏标签「セクション5」「セクション6」的数字为半角字形；
#     各卡标题/正文中的日期与编号数字（７、９、１６、５、２ 等）及「：」为全角
#     （与 snr_common.lua plotTitle[180..195] 逐字一致）。
#   - 特例：卡 200 为编外卡，plotTitle 无对应条目，标题栏为半角英文 SectionEx2
#     （见该条 note）。
- card: 180
  variant: "a"
  title_jp: "サクラの日記：７月（書きかけ）"
  section_label: "セクション5\n日記"
  body_jp: "物語の私も、やっぱり病弱\nです。たまにいく学校はと\nても退屈。でも、中庭には\nアヤノさんが居るから、今\nは楽し……"
  note: "标题「（書きかけ）」示为未写完的日记：正文止于「は楽し……」，……后无句号。"
- card: 181
  variant: "a"
  title_jp: "サクラの日記：９月１６日"
  section_label: "セクション5\n日記"
  body_jp: "中庭で、アヤノさんの知り\n合いのユウイチさん（友達\n……彼氏？）とお話ししま\nした。ユウイチさんから美\n味しいドーナツを貰っちゃ\nいました。"
  note: "正文「（友達……彼氏？）」的（）？均为全角；「お話しし」为双「し」（放大确认）。"
- card: 182
  variant: "a"
  title_jp: "サクラの日記：９月１６日（夜）"
  section_label: "セクション5\n日記"
  body_jp: "でも、昼間長く外に居すぎ\nたせいか、その日の夜はと\nても苦しくて……。"
  note: ""
- card: 183
  variant: "a"
  title_jp: "サクラの日記：９月２０日"
  section_label: "セクション5\n日記"
  body_jp: "また、ユウイチさんと会っ\nて、また、ドーナツを貰っ\nちゃいました。美味しかっ\nたです。"
  note: "第 2 行「貰」与卡 181 的「貰」经像素比对为同一字形，且前后文（再次从ユウイチ处得到甜甜圈）相符，确认为「貰」而非「買」。"
- card: 184
  variant: "a"
  title_jp: "サクラの日記：９月２２日"
  section_label: "セクション5\n日記"
  body_jp: "立ち聞きって、良くないで\nすよね……。悪いこと、で\nすよね……。"
  note: ""
- card: 185
  variant: "a"
  title_jp: "サクラの日記：９月２３日"
  section_label: "セクション5\n日記"
  body_jp: "悪いことをするから、だか\nら、その罰が当たったんだ\nと思います……。"
  note: ""
- card: 186
  variant: "a"
  title_jp: "サクラの日記：９月２９日"
  section_label: "セクション5\n日記"
  body_jp: "うたを歌ったり、ユウイチ\nさんにまたまたドーナツを\n貰ったり、色んな事があり\nました。"
  note: "首词「うた」为平假名、随后「歌ったり」用汉字（原版式如此）。"
- card: 187
  variant: "a"
  title_jp: "サクラの日記：断片"
  section_label: "セクション5\n日記"
  body_jp: "アヤノさんに伝えたいろん\nな事……アヤノさんは少し\n「信じやすい」事が心配と\nいうこと、告白するなら夏\nかな……ということ、あと\n……とっておきのオマジナ\nイ！"
  note: "末行「イ！」的！为全角；「オマジナイ」为片假名。"
- card: 188
  variant: "a"
  title_jp: "サクラの日記：１０月３日"
  section_label: "セクション5\n日記"
  body_jp: "さいきんは身体のちょうし\nがあまりよくありません。\nずっと、夏がつづいていれ\nば、いいのに……。"
  note: ""
- card: 189
  variant: "a"
  title_jp: "サクラの日記：１１月１２日"
  section_label: "セクション5\n日記"
  body_jp: "さむくなってきたね。でも\nたまにわたしは、中庭にい\nって「外」を見てたりしま\nす。"
  note: ""
- card: 190
  variant: "a"
  title_jp: "サクラの日記：２月１３日"
  section_label: "セクション5\n日記"
  body_jp: "ちょっとちょうしが、わる\nいので、ちゃんとした、日\n記はこんどかきま……"
  note: "正文止于「かきま……」，……后无句号（日记未写完即中断）。"
- card: 191
  variant: "a"
  title_jp: "アヤノの返信：１０月３０日"
  section_label: "セクション5\n日記"
  body_jp: "サクラさん、元気？ 手紙\nありがとう。また何かオモ\nシロイウワサがあったら、\n教えてね！"
  note: "「元気？」与「手紙」之间为一个半角空格（字距实测约半格）；？！均为全角；「オモシロイウワサ」为片假名。右栏第二槽位仍为「日記」。"
- card: 192
  variant: "a"
  title_jp: "失われた夢の物語"
  section_label: "セクション6\nあらすじ"
  body_jp: "物語の題名は「失われた夢\nの物語」（おわり）"
  note: "右栏标签为「セクション6」（6 为半角字形，本批唯一非 5 的一张）。第 2 行闭引号」与左括号（之间的视觉空隙系全角字形边距所致（」贴字位左侧、（贴字位右侧），经字距实测两字符相邻、无空格。「（おわり）」后无句号，正文即止于此。"
- card: 193
  variant: "a"
  title_jp: "２月、中庭"
  section_label: "セクション5\nあらすじ"
  body_jp: "二月。中庭には雪が降って\nいた。書きかけの物語を残\nして、「あの子」は、行っ\nてしまった。　　（完結）"
  note: "标题用全角数字「２月」，正文首词用汉字「二月」（原文如此）。末行「てしまった。」与「（完結）」之间空两个全角位，按两个全角空格记录（恰使（完結）齐行尾）。"
- card: 194
  variant: "a"
  title_jp: "中庭のアヤノさん"
  section_label: "セクション5\nあらすじ"
  body_jp: "中庭でアヤノとサクラは話\nし合う。アヤノは約束があ\nるからと、小走りに建物の\n中に入っていく。"
  note: ""
- card: 195
  variant: "a"
  title_jp: "セクション５：アヤノ"
  section_label: "セクション5\nあらすじ"
  body_jp: "セクション５、２番目の主\n人公は「アヤノ」"
  note: "标题与正文中的「５」「２」「：」为全角（经字距实测确认）；右栏标签「セクション5」的「5」为半角。正文「アヤノ」后无句号（与卡 10 同款式）。"
- card: 200
  variant: "a"
  title_jp: "SectionEx2"
  section_label: "物語あらすじ"
  body_jp: "私たちの物語。"
  note: "编外卡：plotTitle 无对应条目，标题栏为 SectionEx2。标题为半角英文字母与数字，卡面按每字一个全角位疏排（字距实测每字符占一全角格）。右栏仅上槽位一行「物語あらすじ」，无第二标签槽位文字。"
