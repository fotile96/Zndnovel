#      台词把它讲了出来（4755–4758 三个 Staff Roll），故以 q18 覆盖其**语义**那一面。
#   ⚠ b159（s4s 3 行）与各 crd stub 未出题——是 `选择：ユカリ先生` 的门控残片与卡片提示行，
#      无独立剧情内容。
