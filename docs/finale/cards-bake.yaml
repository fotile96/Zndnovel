# work/finale/cards-bake.yaml — 谢幕卡组文案源（卡 201–207，编外，不在路线上）
# 体例照 skeleton/cards.zh.yaml；body_zh 的换行按 wrap_body_zh(font_size=9/max_width=110/max_lines=7)
# 语义（yaml 换行仅供人读，烤字管线会按词边界重排——见 glossary v21 linebreak_rule）。
# section 栏暂定『谢幕』二字（落地版面不合适再议）；空白卡不编号、不烤字。
# 七张卡的正文均为各轨模型独立撰写的原文，统稿零改字；作者与通道记于 tr_note。
# ⚠ 上一条有且仅有一处具名例外（2026-09-12 用户裁决）：全卡组的单字「人」一律标作
#   『人』，共 10 处（201 标题/正文、202×2、203、204、205 标题/正文×3）。理由是给
#   「讲述的人」这一层双关一个可见的标记——本章既有标记法即 17303『你』和『你们』
#   （『』＝这个词有两层；「」＝引述一句话，如 17405「不擦掉」），故取 『』 不取 「」，
#   一并避开与对白括号的嵌套冲突。**排除 L26『走进无人的教室』**：那里的「人」是否定
#   副词的一部分，不是名词，包起来读不通。此例外严禁外推到卡组以外或「人」以外的字。
- card: 201
  variant: a
  title_zh: 把故事拉上来的『人』
  body_zh: '有个故事从高处

    坠落。讲述的『人』探出

    围栏，一句一句，

    把它拉了上来。

    每一句都对回原样，

    一句也没有弄丢。

    这一次，抓住了。（完）'
  tr_note: 反编译轨；glm-5.3[1m] 经 paseo/packy 派发（2026-08-31）。末行接序章约定句族（6085/16130）。
- card: 202
  variant: a
  title_zh: 笔记的第一页
  body_zh: '走进无人的教室。

    散落的故事读过一遍，

    才知道：同一个名字

    有两种写法，同一个『人』

    有两个名字。把这些

    写进笔记的第一页——

    之后的『人』，接着讲。'
  tr_note: 骨架轨；fable 子代理（2026-08-31）。与彩野笔记首页锚句（248）成对位。
- card: 203
  variant: a
  title_zh: 第一遍的声音
  body_zh: '记忆只有十五分钟。

    坐下，读一遍梗概，

    从上一个『人』停下的

    地方，用另一种话，

    把故事第一次讲出声。

    讲到哪里，写在背面，

    然后忘记。　　（未完）'
  tr_note: 初翻生产轨；opus 子代理（2026-08-31）。（未完）结尾标记沿卡组既有体例。
- card: 204
  variant: a
  title_zh: 同一个名字
  body_zh: '讲故事的『人』换了一个又

    一个，名字却要一直是

    同一个。叫错的不擦掉，

    只在下面添上新的，和

    这一次改口丢掉的东西。

    谁翻到这一页，都看得见

    当初错在哪里。'
  tr_note: 裁决与召回轨；opus 子代理（2026-08-31）。「不擦掉」＝glossary append-only 纪律的戏内化。
- card: 205
  variant: a
  title_zh: 读第二遍的『人』
  body_zh: '故事由许多『人』轮流讲成。

    有一个『人』靠梗概接上，

    把它从头读了两遍，

    只为听出哪一句

    不像同一个『人』说的。

    笔记上写定的话，

    要改，就先举手。'
  tr_note: 润色轨；fable 子代理（2026-08-31）。「先举手」＝锚点软锁 adjudicate=true 的戏内化。
- card: 206
  variant: a
  title_zh: 写卡片的手
  body_zh: '为了让故事讲下去，

    把卡片上的字换过一遍：

    量好每一张，让新的字

    住进旧的字住过的地方。

    字与卡框，原是同色。

    只有「谁都没见过的晚霞」

    那一张，无字可换。'
  tr_note: 烤字轨；fable 子代理（2026-08-31）。「原是同色」据 bake-decisions 字色实测；卡 94 本无正文，故「无字可换」。
- card: 207
  variant: a
  title_zh: 下一段
  body_zh: '她翻开卡片，

    梗概只有几行。

    没有结局，

    该我讲了。

    晚霞还在等。'
  tr_note: 审计与判分轨；deepseek-v4-flash 经项目 api_client 管道（purpose=finale-card:audit-judge，2026-08-31，已入 api_ledger）。翻卡演出的收尾卡，其后接空白卡。
