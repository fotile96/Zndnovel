  # ─────────────────────────────────────────────────────────────
  subete_no_machigai:
    term: 全ての間違い
    zh: 根本的错误
    old: 一切错误
    ids: [15483, 15485, 15487]
    why: >
      用户 2026-08-13 改写 15487 时批注「上下文中『全ての間違い』多次出现，需要都统一」。
      这三行是 s6f 里由加里与直哉的**一问一答一驳**（由加里「那就是一切的根本错误」→
      直哉「什么根本的错误，那种东西哪里都不存在」→「如果要说『存在根本的错误』的话……」），
      三行必须同词，否则直哉的反驳落不到由加里说的那个东西上。
      「一切错误」在汉语里读作「所有的错误（复数）」，而原文说的是**一个根源**；
      「根本的错误」把单数性与根源性都带住了。
    active_json: "不进——15483 的落点是「一切的根本错误」，裸键单值比对会对自己的正解误报"

