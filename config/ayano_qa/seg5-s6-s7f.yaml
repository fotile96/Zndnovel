# 彩野测试题库 · seg5-s6-s7f（18 题）。出题纪律见 seg1-s2 题库头注。
# 受试者只看得到：①严格早于本段的 142 张卡片梗概（6738 字符）；
#   ②SEG-5（b139–154：s6s/s6f/s7f/crd）的中文译文。
# info_point 只进报告、不进受试者与判分员的提示词。
#
# 段绑定：本段前缀是**历段最厚的一次**——142 张卡，含全部日记卡 177–191 与章节梗概卡
#   133–139/145、193–195。故出题前先对前缀做了关键词穷举：
#   `误认`/`误会`/`原型`/`探望`/`True Color`/`Ｔｒｕｅ`/`天台的晚霞`/`真实`/`秒表`/`遗书`
#   在 6738 字符的前缀里**各出现 0 次**——本段的全部核心揭示在卡面上没有任何落点。
#   贴边的三张卡也已逐字读过、确认只是模糊一句：卡96『サクラ同学的谜题』只说「要施咒语
#   居然还有题目要解」（无题面无答案）；卡97『绝对灵验的咒语』只说「那个咒语绝对灵验」
#   （无双重含义）；卡105/106 只说アヤノ有自我暗示/强迫观念的倾向（无「直哉把这张卡收进
#   口袋、不交给她」这一本段事实）。
#   **闸经对照验证**：3 道答案明摆在卡面上的对照题与 18 道真题**混在同一次调用里**跑
#   （R-A 章节4B梗概→卡138、R-B サクラ日记9月16日→卡181/182、R-C 绘本三行→卡145）。
#   结果 **18/18 真题判「不能答」、3/3 对照题判「能答」且逐条点出卡号**。驳回理由**逐题不同
#   且能指出最贴边的那张卡**（如 q1「卡41 只给谜题的正确答案、没有题目条件」、q16「卡85 提到
#   楼梯没有尽头、但未写幼年被困天台的原因」）——是逐题核对而非批量盖章。
#   ⚠ **闸的卡号引用另经人工抽验 8 张（41/27/85/125/188/138/181/182），全部准确**——
#   这一步不能省：若它在编卡号，那 18 个「不能答」就只是漂亮话。正是这一步查出了 q12 的
#   子句泄露（详见 q12 的 info_point），闸自己没报。
#
# 分岔题的判据（seg1 头注新增纪律，本段严格执行）：q2 涉及 s6s_60_sel 二选一，
