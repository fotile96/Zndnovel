  - id: yuichi-san-speaker-split
    title: ユウイチさん 按说话人三分（千秋侧→学长），并撤销 chiaki.md 的 ★ 待裁决标记
    decided_by: user
    date: 2026-08-05
    split:
      千秋（五年后言及）: ユウイチ学长
      アヤノ / ユウイチ（揶揄敬称位）: ユウイチ先生   # v7 具名例外，本次不动
      其余全部（サクラ／直哉旁述／女子生徒／彩野母…）: ユウイチ同学
    scope: 5 行回改（patches.jsonl, reason=recall, glossary_v=13），全部在本段 s8f
    patches: [16582, 16583, 16584, 16590, 16603]
    saturation: 0.860（50 处，已入线 43）
    speaker_breakdown:   # 裁决会话机械跑出，是本条成立的全部依据
      千秋: 5            # 全在 s8f＝本段；现状「同学」→ 改「学长」
      直哉旁述: 21       # 同学 19 / 未入线 2（含本段 16587）
      サクラ: 12         # 同学 12
      ≦女子生徒≧: 4     # 未入线，全在 e2f
      アヤノ+ユウイチ: 4 # 先生 4（v7 具名例外）
      女子生徒/彩野母/≦サクラ≧: 4
    rationale: >
      `voices/chiaki.md:23` 把它记作「ユウイチ学长」并**具名点了 16582–16584**，但该行自带
      ★口径待裁决标记；而全库已入线的每一处都作「ユウイチ同学」，「学长」在正向线零出现。
      译者判给语料，把冲突送段末——这是本段与口调表最直接的一次冲突。
      裁决时的关键取证是**按说话人拆开**：50 处里只有 5 处是千秋的，全部在本段 s8f。
      「学长」＝同校高年级：千秋比他低五届、五年后正在同一所母校读高中，这个关系对她成立；
      对サクラ（同级住院生）、彩野母（成年人）、直哉旁述都不成立。
      ★ 冻结骨架卡 190『サクラ的日记：9月16日』的 tr_note 写着
      「ユウイチさん→ユウイチ同学（与アヤノ同学同式的校园称呼）」——**那是サクラ的日记，不在千秋辖内**，
      故本裁决**不推翻任何骨架**。
      ⚠ 16587 是**直哉旁述**（不是千秋台词），虽在同一推理段内，按说话人分治**维持「同学」**。
    voices_action: >
      voices/chiaki.md:23 撤掉 ★口径待裁决 标记，值保持「ユウイチ学长」并注明
      「**仅千秋侧**；其余说话人见 style.md 称呼后缀表」。

  - id: wakaranai-pragmatic-split
    title: わからない 按语用二分 —— 不理解→不明白 / 不知所措→不知道
    decided_by: user
    date: 2026-08-05
    split:
      不理解（听不懂 / 想不通）: 不明白
      不知所措（不知道该怎么办）: 不知道
    scope: 1 行回改（4618，reason=recall）
    saturation: 0.939（163 处，已入线 153）
    patches:
      - id: 4618
        before: 不明白。
        after: 我不知道。
    rationale: >
      已入线 153 处压倒性作「不明白。」，译者按复现句族纪律跟随了既有 6/6 同文先例——处理无误。
      但 4618 的语境是「该说什么？该怎么做？」之后的自问，语义是「不知道该怎么办」而非「不理解」，
      跟随后中文生硬。用户裁定分治，并具名给出 4618 的新译**带主语**「我不知道。」。
      ★ **提前定名的理由**（conventions/register-the-most-concentrated-family-early）：
      该词未覆盖的 10 处**全部落在 e2f(7)/e2s(3)＝下一检查段 seg7**，
      而 e2s 正是全书对上下文依赖最强、最后翻的一段——等它入线，形就固化了。
    style_md_note: 二分词表新增一行；主导形「不明白」不变，只在「不知所措」位取「不知道」。

  - id: device-latin-halfwidth
    title: 器物上的英数字面一律半角（对「随原文字宽」的具名例外）
    decided_by: user
    date: 2026-08-05
    rule: >
      作品内器物（播放器、按键、液晶屏）上的英文单词与文件名，中文一律用**半角拉丁**，
      不随原文的全角字宽。独立英文词按 v12「保留英文的词」加前后半角空格；
      **文件名作为一个整体不加内部空格**。
    scope: 3 行回改（reason=recall）
    patches:
      - id: 16517
        before: 液晶屏上显示出『姐姐．ｍｐ３』。
        after: 液晶屏上显示出『姐姐.mp3』。
      - id: 16038
        before: 按下了一直在放音乐的播放器的ＳＴＯＰ键。
        after: 按下了一直在放音乐的播放器的 STOP 键。
      - id: 16043
        before: 按下了ＰＬＡＹ键。
        after: 按下了 PLAY 键。
    rationale: >
      译者按 v12「半角形只适用于原文是片假名的定译英文词」＋同一台播放器已入线的 16038（全角）
      落了全角，处理自洽；但 `voices/chiaki.md` 写的是半角『姐姐.mp3』，两面打架，必须动一处。
      用户裁定取半角。★ **16043『ＰＬＡＹ键』是裁决会话额外查出的第三行**——
      同一台播放器、同一块液晶屏，只改 16517/16038 会在同一台机器上留下两种字宽，故一并回改。
    boundary: >
      ⚠ **PSP 手柄按键不在本条内**：17092/17196/17218 的『Ｒ按钮／Ｌ按钮／□按钮／○按钮』
      维持全角——那是主机硬件的按键刻字，游戏自身 UI 即以全角渲染，与作品内的卡带播放器不是一类。
      ⚠ 亦**不影响**作品名随原文字宽（『Ｔｒｕｅ Ｃｏｌｏｒ，』仍是全角拉丁）。

  - id: hodohodo-three-way
    title: 「〜って所／と言ったところ」三分（三个近义「还行」）
