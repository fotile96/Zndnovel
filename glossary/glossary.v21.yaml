recall_c1_cards_zh_linebreak:
  why: >
    v19 C1 把故事层片假名人名转成罗马音时，正文轨（单行字符串）全部命中，
    但 `skeleton/cards.zh.yaml` 的 `body_zh` 是**按卡面宽度硬折行的多行字符串**，
    人名可能被 `\n` 劈开（`サ\nクラ`／`ユカ\nリ`／`ユ\nウイチ`）。逐行替换匹配不到，
    于是这 3 处留在了骨架里。2026-08-30 全库复扫 `title_zh`／`body_zh` 时发现。
  cards:
    37:
      before: "回答两情相悦的咒语后，サ\nクラ对两人关系尚无进展一\n事感到惊讶。"
      after:  "回答两情相悦的咒语\n后，Sakura对两人关系\n尚无进展一事感到惊讶。"
      note: "`サクラ` 劈在第 0/1 行之间。日文原卡 `サクラは` 完整落在第 1 行，中文这个断点是重新折行时产生的。"
    74:
      before: "放学后，为传闻之事在学校\n里探索。从保健老师和ユカ\nリ老师那里得到情报。途\n中，看到了在校内走动的ユ\nウイチ。"
      after:  "放学后，为传闻之事在\n学校里探索。从保健老师\n和Yukari老师那里得到\n情报。途中，看到了在\n校内走动的Yuichi。"
      note: "两处：`ユカリ` 劈在 1/2 行、`ユウイチ` 劈在 3/4 行。"
  exempt:
    card_168_yuki: >
      card 168 的 `「ユキ」` **不转写**——它是 v19 `exempt.kana_pun_yuki` 的
      ユキ 双关族（雪／往く／ユキノ 三重双关），与正文 15067/15068/15073 等同族。

  # ── 换行怎么定的（这一条是给后续所有 cards.zh 改动的通用口径）──
  linebreak_rule: >
    **新 `body_zh` 的换行＝烤字管线的实际输出**，用 `tools.measure_card.wrap_body_zh`
    在 `font_size=9 / max_width=110 / max_lines=7`（＝`bake_card.py` 的 `BODY_MAX_WIDTH`
    /`BODY_MAX_LINES`）下算出，不是人工排的。
  linebreak_why: >
    **yaml 里的换行对卡面图没有影响**——`bake_card.plan_body()` 调
    `wrap_body_zh(card, body_zh, font, 110, 7)` 重新折行，把宽度驱动的 `\n`
    合并成 run 再排（实测：带换行输入与拼平输入的输出逐字相同）。
    两个推论，都已实测确认：
      ① 「断名」在烤字时本来就会自动消失（`サ\nクラ` 被合并回 `サクラ` 再排）——
         **卡面上从未出现过断开的假名，真正的问题只是假名本身**；
      ② 既然 yaml 的换行只影响人读 yaml 的观感，就让它等于烤字输出（所见即所得），
         省掉核对时在脑子里再折一次行。
    ⚠ 因此**不要**把 yaml 的换行当成卡面排版的依据：全库 196 张里有 **106 张**
    现存断行与烤字输出不同（yaml 是「尽量填满」风格、烤字是 zh_wrap 的词边界优先），
    这个不一致 skeleton-v1 起就在，无害。
  measured: >
    card 37：3 行、最宽 99px；card 74：5 行、最宽 99px；均无截断（上限 110px）。
    顺带全库复核：196 张按烤字管线重排，**截断 0、超宽 0**——包括现存 yaml 里
    16 行 >110px（最宽 115px，全是 v19 就地替换罗马音撑宽的行），它们在烤字时
    会被重排掉，不会溢出。
  followup: "png/card/crd_37_a.png 与 crd_74_a.png 须重烤（本版落地时一并执行）。"
