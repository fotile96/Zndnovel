    - id: 8478
      jp: "【サクラ】「約束、まもってくれないんだ。彩野さん」"
      zh: "【Sakura】「原来，你不肯为我遵守约定呀。彩野同学」"
      recall: "★汉字呼名装置（v7 补锚，与 s6s 15775 成对）：Sakura 全库 696 条 SAK 语音行里**仅 2 处**用汉字「彩野さん」，
