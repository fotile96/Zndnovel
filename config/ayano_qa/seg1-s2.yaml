# 彩野测试题库 · seg1-s2（15 题）。出题纪律见 P3 devwave1 plan Task 8。
# 受试者只看得到两样东西：①严格早于本段的 46 张卡片梗概（s0f/s1s/s1f，每张约 28 字）；
# ②SEG-1（b36–62：s2s/s2f/crd）的中文译文。所有标准答案都必须能仅凭这两样推出。
# info_point 末尾标注该信息点所在的批次（bNN）或场景（如 s2f_40），不标译况——
#   译况会随生产进度失效（P3 devwave1 task-9 M1 修复：出题时只译到 b46，此后
#   译到 b56+ 就会让"已译/未译"标注过期）。某题涉及的批次是否已译完，运行时看
#   ayano_test 报告里的「缺译 N 行」提示即可，不必也不应写死在题库里。
# 严禁剧透 s2 之后的真相（题面与标准答案均不得出现 s7f 才揭示的内容）。
# 段绑定（终审 I4）：拿别段的题库跑本段曾静默 rc=0 全绿——seg2 的前缀恰好包含
# seg1 全部 6 张答案卡（41/44/45/46/58/134），受试模型一行译文不看即可满分。
# **标准答案里凡原文不点名处，不得以全知补名作为得分点**（seg6 实测，最要紧的一条）。
#   seg6 q17 曾把戒指的转交人写成「托 ナオヤ 转交」，而原文 4704 是『彼が渡してくれた』
#   ——用 `彼`、不点名。译文「是他交给我的」正是全知纪律第 3 条要求的处理，受试没点名
#   恰恰证明译文守住了不点名，**却因此被判「部分对」**。
#   **这是恒绿假信号的镜像形态：题目在要求译文泄露原文没泄露的信息。**
#   出题人握有全库全知，最容易在参考答案里不自觉地把后文/别处的名字补进来。
#   判据：写每一条参考答案时回查该行原文——原文用代词/泛称的，答案也只能用代词/泛称，
#   或明写「点不点出是谁都算对」。
# 涉及分岔的题，标准答案**必须依章节 main() 调度器**判定走向，不得按 lua 的文件行序读
#   （seg4 q6 即栽在这里：互斥两支的 vms 在文件里相邻，被读成一条时间线，反把答对的
#   受试判成错）。受试者看到的 source 是**按 id 区间切的批**、含全部分支文本，所以他和
#   出题人踩的是同一个坑——题面须写明「这是二选一」，别让分支歧义冒充理解缺陷。
segment: seg1-s2
questions:
  - id: q1
    question: "ユウイチ约アヤノ这个周六出去玩，アヤノ为什么没能当场答应？两人最后把出去玩的日子改到了什么时候？"
    reference: "因为アヤノ在这之前已经先和另一个女孩子（隔壁班的サクラ同学）说好，这次休息日要是有空就两个人一起去买东西；虽然还没等到对方的回复，但毕竟是她这边先约的人家。ユウイチ听后说「有约在先那也没办法」，于是两人把出去玩改到下周。"
    info_point: "周末去处伏笔（review_focus 指定项）＋时间线先后：与サクラ的约定在先、与ユウイチ的约定在后，容易被读成同一个周末。"

  - id: q2
    question: "アヤノ拿「之前一起看星星」当理由邀ユウイチ去天文馆，ユウイチ是怎么回应的？这段对话里出现了什么对不上的地方？"
    reference: "ユウイチ完全不记得有过那回事，还指出「我现在根本就没骑自行车上学」，反过来说アヤノ多半是上课打瞌睡做了什么奇怪的梦。アヤノ自己也纳闷「咦。……真奇怪啊……？」——也就是说，アヤノ记得的那段「和ユウイチ一起看星空、他推着自行车」的回忆，在ユウイチ那边并不存在。"
    info_point: "周末プラネタリウム 伏笔（review_focus 指定项）＋时间线/记忆矛盾：这是全段最容易被当成闲聊而丢掉的一处不对劲。"

  - id: q3
    question: "在走廊上和サクラ同学同行时，アヤノ为什么刻意放慢脚步？她由此想到了什么？"
    reference: "因为サクラ走得很慢，一不留神就会超到她前面去，アヤノ便顾及着她、把步调放慢与她一致；后面赶时间的男学生咂着嘴越过了两人。アヤノ由此想到：想要看见サクラ同学的笑容，就必须把步调放到她走路的速度上才行，那些在走廊上匆匆赶路还要咂嘴的人，是看不到她笑容的。"
    info_point: "本段最文学的一处内心独白，也是「アヤノ与サクラ亲近」这条线的情绪支点；措辞一丢就变成普通的走路描写。"

  - id: q4
    question: "サクラ在教咒语之前先出了两道推理题。这两道题的正确答案分别是什么？"
    reference: "第一题「小小的女孩」：女孩打开阁楼门后看到的那幅有冲击力的光景，只不过是房间的外面——因为那个女孩一直都生活在阁楼房间里。第二题「赝品的男人」：赝品本身的做工完全没有问题，问题出在被仿的原作上（アヤノ答「原因在于原作」，サクラ判定答对）。"
    info_point: "ナゾトキ 选择迷宫的题面与解答（review_focus 指定项）：推理逻辑一旦译歪，读者就无法判断アヤノ是答对还是答错。"

  - id: q5
    question: "アヤノ在サクラ的推理题上答错了，文中提示这会带来什么影响？听故事的直哉和彩野对「谜题」这件事下了什么判断？"
    reference: "答错的那一版里，アヤノ走出图书室时惦记着「有些地方答错了还是有点在意，要是不会影响到サクラ同学的『咒语』内容就好了」；答对的那一版则确认「サクラ同学出的题目我好像也都没答错」。直哉和彩野在整理卡片时判断：既然特意准备了「全部答对」的场面，说明谜题不只是单纯的过场，而是有可能影响到后面的展开；答错也不会带来好结果，所以谜题还是要好好答对。"
    info_point: "ナゾトキ 多层选择迷宫的因果（review_focus 指定项）：答题结果 → サクラ配出的咒语内容 → 后续展开，这条因果链只靠这两处提示传达。"

  - id: q6
    question: "被サクラ追问「你对ユウイチ是怎么想的」时，アヤノ给出了两种不同的回答。分别是什么？サクラ听到其中一种回答后为什么松了一口气？"
    reference: "一种回答是「喜欢……吧，嗯」，并说自己最近不知为何特别在意ユウイチ、还常梦见和他牵着手；另一种回答是「说不上喜欢也说不上讨厌」，理由是青梅竹马、一直待在一起，ユウイチ对她来说「太近了」，从没往那方面想过。サクラ在听到「喜欢」这一版时把手按在胸口松了口气，解释说施咒语时「强烈地想着」很重要，アヤノ祈愿得越强，咒语就越容易灵验。"
    info_point: "s2s_390 夜晚成立三条件之一（对ユウイチ的心意，review_focus 指定项）；两版回答的差别是后半段分歧的起点。两版回答均在 b47。"

  - id: q7
    question: "サクラ替アヤノ配出的「咒语」，在这段故事里出现了几种不同的做法？分别是什么？"
    reference: "出现了三种。①「看着夕阳听歌」：一边听傍晚在住宅区播放的、给孩子们听的『回家的歌谣』，一边在心里想着愿望。②「把课本翻过来，在翻过一页的地方写上心上人的名字」，アヤノ的情况该用现代文课本。③「把橡皮从套子里取出、写上心上人的名字再装回去」，只要在橡皮用完之前不被任何人发现就算成功。"
    info_point: "咒语（オマジナイ）三分支的具体做法，是本段的核心道具；橡皮那一条同时呼应前缀卡『橡皮』。"

  - id: q8
    question: "直哉说，至今为止在彩野讲的故事里登场的サクラ同学「好像有两种」。他指的是哪两个场面？他为此拿出了哪两张卡片？"
    reference: "一种是本段图书室里那位感觉很温柔的サクラ同学，直哉说印象上和章节 1 里两人一起请钱仙的场面很相似，为此拿出了『放学后的钱仙』的卡片；另一种是章节 1 里，失去意识的アヤノ在天台上遇见的那位サクラ同学，为此拿出了『她的名字』的卡片。直哉觉得这两边的印象差得很多。"
    info_point: "跨段指代（同一个名字指向两副面孔），答案必须同时用到前缀卡（卡21『放学后的钱仙』、卡27『她的名字』、卡22/卡28）与本段正文——只靠梗概续听的人最容易在这里把两个サクラ合并成一个。"

  - id: q9
    question: "在现实层，彩野说这一段故事「不用直哉特意递卡片也能归纳梗概」，可她担心的是什么？直哉答应了她什么？"
    reference: "彩野说故事本身很短很简单，梗概马上就能归纳出来；但她觉得这个故事「枝叶特别多」，脑子里全是「如果是这样的展开，故事会变成什么样呢」的分岔，理不清。直哉把这理解成「错综复杂的故事」「针对分岔的结果可能有很多」，并答应尽可能帮忙——把针对各个选项的结果一一记到卡片上，注意别让她脑子搅成一团。"
    info_point: "s2f/crd 现实层框架（review_focus 指定项）：这段是「选项→卡片」这套机制的自我说明，也是彩野讲述状态的直接描写。"

  - id: q10
    question: "那天放学后，ユウイチ为什么先回家了？アヤノ又是用什么借口留在学校的？她随后遇到了什么尴尬？"
    reference: "ユウイチ说今天是新作游戏的发售日，难得零花钱也到手了，要去买游戏，所以先走一步。アヤノ支支吾吾地说「等一会儿要去图书室」「想着去学习一下」，被追问学什么时脱口说出「占卜……不对，是书！有点事情想查」，还硬扯上「而且还是心理学呢」。ユウイチ走后她嘟囔「也不想想人家的心情」，被教室里还没走的同学听见并起哄「怎么，アヤノ你被甩了？」「当情侣的可真辛苦呢」，アヤノ慌忙否认「我们才不是情侣什么的」。"
    info_point: "时间线先后（同一个放学后：先与ユウイチ分开→再赴与サクラ的约）＋称呼变化（同学口中的「情侣」与アヤノ的否认）。"

  - id: q11
    question: "在ユウイチ被什么东西引上天台、故事走向坏结局的那一版展开里，文中给出的「提示」说，要让未来有所不同需要做到哪几件事？"
    reference: "提示说了两句：一是要好好回答サクラ（把她出的推理题答对）、并认真对待咒语（相信它「绝对会灵验」地去做）；二是「对他的心意」——也就是アヤノ怎么回答自己对ユウイチ的感情——可能会改变未来。三者合起来才能避开那个结局。"
    info_point: "s2s_390 夜晚成立判定三条件（review_focus 指定项）：全段唯一一处把三个分支条件明写出来的地方，漏译或译散就再也推不出来。b47"

  - id: q12
    question: "那天傍晚做完咒语后，アヤノ在空无一人的校舍里追上ユウイチ时，察觉到他有哪些不对劲？"
    reference: "①无论她在后面怎么叫，ユウイチ都不回头、不停步，反而加快脚步；②自己跑步的声音在校舍里响得很清楚，ユウイチ上楼梯却完全没有脚步声；③他一路上到通往天台的门前——而放学后、尤其是这个时间，天台的门本该锁着，可门却毫不费力地就打开了，ユウイチ像是「早知道没上锁」一样径直走了进去。アヤノ因此觉得寒气上涌、预感很坏。"
    info_point: "夜晚展开（s2s_500 线）的悬疑核心，三处异常缺一不可；同时是「屋上」母题的复现。b47"

  - id: q13
    question: "在现实层的黄昏校庭，千秋最后追问到了什么？直哉分别怎么回答？"
    reference: "千秋追问到两处：第一个问题是「直哉先生为什么没有出现在那个『故事』里？」直哉答不上来，只能说「那个……我也不知道」，并且说完就后悔了。第二个问题是「你没有向彩野同学告白吗？」直哉回答「做不到。是『不可以那么做』」，但并没有说明为什么不可以。千秋道歉，直哉反而向她道谢，心里想着现在能这样对自己直言的只有她（一个十一岁的女孩）了。"
    info_point: "s2f 现实层框架（review_focus 指定项）＋人物指代：千秋是本段现实层唯一把话挑明的人，直哉的两次「不知道」是这一章现实层的情绪底色。b58"

  - id: q14
    question: "由加里老师为什么特意拜托直哉「对那孩子温柔一点」？「那孩子」指谁，她的处境是什么？"
    reference: "「那孩子」指千秋。由加里老师通过教师之间的关系打听到：千秋家里在姐姐去世后父母很快离婚，千秋被母亲带走；母亲随后再婚，没多久又离婚，现在和另一个男人一起生活。小学那边的老师说，问千秋情况她永远只回一句「没问题，在家有人教我念书」，成绩也不差，但那位老师凭多年直觉在意她是不是在说谎、或者父母是不是管教过头。由加里老师还允许千秋在暑假里进校舍避暑，并说千秋是サクラ的妹妹，或许能给直哉一些帮助。"
    info_point: "s2f 现实层框架（review_focus 指定项）＋指代关系：整段用「あの子」指称，中文若不点明「那孩子＝千秋」，读者极易与彩野混淆。b58/b59"

  - id: q15
    question: "在这一天的最后，直哉认为故事里的哪个部分和现实之间存在「微妙的差异」、值得再深挖？"
    reference: "他注意到：故事里聊到游泳池和天文馆时，彩野说过「现实里并没有特别和ユウイチ去过那种地方」。直哉觉得这个微妙的差异可以再挖一挖，甚至该更详细地问问——如果讲一个「连放学后的约定也没有」「也没特别和ユウイチ去过哪里」的、更贴近现实的版本，说不定会生出新的展开；而在那样的展开里，说不定自己也能作为登场人物出现。"
    info_point: "周末プール/プラネタリウム 伏笔的回收位（review_focus 指定项）＋s2f 章终框架：这是把「故事层」与「现实层」明确对照起来的唯一一处，也是直哉全章动机的落点。b59"
