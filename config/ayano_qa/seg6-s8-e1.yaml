# 剧透核查：全部 18 题均取自本段正文。seg7（e2s 千秋多年后的调查、e2f）的内容**一处未提**。
segment: seg6-s8-e1
questions:
  - id: q1
    question: "天台上ユウイチ把アヤノ拉回来的那一段，他向她说了什么？他要她「回」到哪里去？这段话里他对她的称呼出现了什么不寻常的地方？"
    reference: "他先想「就是现在，≪正是我向アヤノ说出心意的时刻≫」，然后告白：「我喜欢アヤノ。比谁都喜欢」。要她回去的地方是「另一侧」——「回去吧。到另一侧去。到『围栏的另一侧』去」。**不寻常之处**：同一段里他喊了一声「**彩野……同学！**」——说话人标签是【ユウイチ】，喊出的却是现实层的汉字名「彩野」而不是故事层的片假名「アヤノ」。最后他紧紧攥住她的手，使出浑身力气把她拉上了≪这一侧≫。"
    info_point: "b155 s8s_40（16785／16788／16790／16794／16799）。16788 是锚点。**16790 是本题真正的考点**——双层人名在这一行破了口子，是「说话的其实是直哉」的文本证据；若译文把它统一成「アヤノ」或统一成「彩野」，这个破绽就没了。"

  - id: q2
    question: "章节８故事层的最后，天台上的两人（【女学生】和【男学生】）说了些什么？男学生最后在做什么？"
    reference: "女学生问：「谁都没见过的晚霞，那到底是什么呢？」男学生想着她这句话的意思。随后她说自己有点困了、但还不想回家，男学生答：「稍微，休息一会儿就好。没关系，我会守着你的」。她闭上眼睡着，发出安稳的鼻息；**男学生一边望着她的睡脸，一边等着朝阳升起**。"
    info_point: "b155 s8s_50（16804–16815）。16804 是锚点。两人在这里被降格为无名的【女学生】【男学生】——全知纪律第 3 条，译文同样不得点名。「等着朝阳升起」是与 s8f 黎明结局的接榫，也预告了『谁都没见过的晚霞』其实是朝阳。"

  - id: q3
    question: "彩野小时候在天台上看到的那道『晚霞』，真相是什么？"
    reference: "那并不是晚霞。误闯进学校的彩野哭累了，就那样在天台上睡着了；她的父母花了**整整一夜**四处找她。等父亲终于找到她时，天空——**是朝阳正照亮着四周**。也就是说她把清晨的阳光当成了「晚霞」。"
    info_point: "b157 s8f_30（16523–16527）。全篇最核心的一处解密，且**分两行给出**（16526 以破折号断在半句，16527 才落下答案）。译文若把这个断口填平或提前说出「朝阳」，这处演出就废了。"

  - id: q4
    question: "黎明时分直哉把彩野带回家的经过是怎样的？这一天之后彩野怎么样了？"
    reference: "他看着彩野的眼睛说「差不多，该回家了」，她像个幼小的孩子一样点头站起；他扶住她、把她的手搭到自己肩上，说「来，我背你」，她有点害羞地「嘿咻」一声把体重交到他背上。她指着太阳说「这片『晚霞』好漂亮啊」，他答「……嗯」。回家路上，**他和小千秋、还有老师小声唱着《浜千鸟》**，一路送她回了家——「仿佛她的故事的结局，本来就是那样一般」。之后：**从这天起，彩野再也没有去过学校**；『彩野的故事』到此完结，「可是，≪这个故事≫，还要再继续一小会儿」。"
    info_point: "b157 s8f_40/50（16528–16547）。16543 是锚点。⚠ 这一段的说话人是**【ナオヤ】**（片假名），不是【直哉】——他在故事层的身份里把她背回家，复现了她父亲当年的那一幕。译文保留片假名是必须的。16539 彩野仍称它为『晚霞』，与 q3 的真相对照。"

  - id: q5
    question: "五年后在天台上，千秋说她怎么也没法觉得故事里登场的人物『只有』ユウイチ——她是**凭哪几条依据**推出这一点的？她由此得出「老师」在故事里应当处于什么位置？"
    reference: "依据有两条：①**ユウイチ不擅长应付医院**；②**彩野住院时来探病的是「老师」（直哉）**。由这两条推出：姐姐把老师误认成了ユウイチ，于是创作出了『故事』。她得出的位置判断是——「**『老师』本来是，必须被包含进故事里的人**」。"
    info_point: "b157 s8f_90（16582–16585）。⚠ 本题初版问的是「说出了什么结论」，而那个结论（ユウイチ 其实是直哉）**就写在前缀卡141『章节 7 梗概』上**，受试不看正文也答得出，会稀释信号。改为问**依据链**——两条依据都只在本段正文里，且第①条正是 q14 里那句闲聊（「像医院一样的味道受不了」）的回收。这一处是核对段绑定闸的卡号引用时发现的，闸自己在题级仍判「不能答」。**注意她用的是「老师」而不是「直哉哥」**：五年后他成了母校教师，称呼随之变化。"

  - id: q6
    question: "千秋追问「彩野在故事结局里放进去的『ユウイチ』，会不会其实是——」时，直哉是怎么回答的？"
    reference: "他先说「谁知道呢，我不明白」，接着说：「――是『故事』啊。就是故事。故事里有ユウイチ在」，然后是那句关键的：「**我既可以作为读故事的人成为ユウイチ，也可以作为写故事的人成为ユウイチ。就是这么一回事**」。（他没有正面承认，而是把问题移到了「故事」的层面上。）"
    info_point: "b157 s8f_90（16591–16594）。16594 是锚点。这是全篇对「直哉＝ユウイチ」这一诡计给出的最终态度：不消歧，改用读者/作者的双重身份来接住它。译文若把它译成一句直白的承认，全知纪律第 2 条即被破坏。"

  - id: q7
    question: "サクラ（附在千秋身上）说她也必须道歉，是为了什么事？那台音乐播放器原本是什么？"
    reference: "她要为『信』的事道歉——那封信成了整起事件的起因。至于播放器：「**那台音乐播放器呢，本来是给千秋的生日礼物**。我跟她说『等到生日那天，就可以打开它哦』，然后交给了她」。直哉的回应是：「是个好孩子哦。不管是谁的嘱咐都相信，好好地遵守了约定」。"
    info_point: "b157 s8f_100（16623–16635）。把 s7f 的关键道具回溯成一件「生日礼物」——姐姐把要交代的事藏在一份礼物里，妹妹因为守约而在五年后按下了播放键。这处因果只在本段给出。"

  - id: q8
    question: "サクラ与直哉道别的那一段：她提出了什么请求？直哉为什么拒绝、又实际做了什么？他最后是怎么称呼她的？她提出的最后一个要求是什么？"
    reference: "她说「呐，ナオヤ同学，我可以吻你吗？」直哉想了一会儿摇头拒绝：「不行哦，**也得替小千秋想想**」（身体是千秋的）。但他随后抱住她小小的身体，**轻轻地把嘴唇贴上了她的脸颊**。称呼：他连着叫了三种写法——「**サクラ……ユキノ……『佐仓 雪乃』**」。她的最后要求是：「**下次再见面的时候，要用我的名字叫我哦**」。"
    info_point: "b157 s8f_120（16660–16680）。16660／16680 是锚点。**三种写法连叫是双层人名机制的收束点**（平假名／片假名／汉字全名），译文必须保留三形并置；拒绝的理由「得替小千秋想想」也不能译丢——那是这一吻落在脸颊而不是唇上的全部理由。"

  - id: q9
    question: "直哉交给千秋的笔记本上，他当场做了什么改动？他把什么权利交给了她，理由是什么？"
    reference: "笔记本封面上写着『Ｔｒｕｅ Ｃｏｌｏｒ』；他从胸前口袋取出圆珠笔，**在标题末尾添上了一个「，」**，成为『Ｔｒｕｅ Ｃｏｌｏｒ，』。他把**副标题**的决定权交给她——「副标题，希望由你来定」，理由是「要把这个故事传下去的你，有这个资格」；并说「后续由你来写」。千秋说自己写不出来，他答：「写得出来的。**因为你已经存在于故事之中了**」。"
    info_point: "b157 s8f_150（16705–16716）。16705／16706 是锚点。**逗号是全篇题眼**（＝续篇＝『セカンドノベル』），全角「，」写在标题末尾，作品名保持全角拉丁不动。"

  - id: q10
    question: "ユカリ 老师和ユウイチ 在天台上第一次搭话，起因是什么？那扇门有什么毛病？"
    reference: "起因是ユカリ 出不去了。门的毛病：合页上的铁锈得掉渣、合页上开了个洞，下雨时雨水灌进去把它锈坏了；结果是——「**进天台的门很轻，出去的时候却要用力**」。她说「我还以为自己被关在里面了呢」，并对ユウイチ 说「多亏你过来了」。（ユウイチ 后来还教她：以为被关住的时候，朝门把手附近轻轻踢一脚就行。）"
    info_point: "b161 e1s_10_22（3924–3931、3949）。**这扇「进得来出不去」的天台门，与彩野幼年被困天台是同一个母题的两次实现**（彩野那次是门槛高出一级台阶）——本段第一场就把它重放了一遍。译文若把门的机理译含糊，这层呼应读不出来。"

  - id: q11
    question: "「不良少年」和「不良教师」这两个称呼是怎么来的？两人后来用哪个词概括彼此的关系？他们各自去天台的理由是什么？"
    reference: "初夏在天台上重逢时，ユカリ 先招呼「啊，不良少年」，ユウイチ 回「什么嘛，原来是不良教师」——两人互相调侃对方翘班/翘课。关系的概括词是「**共犯**」：ユウイチ 问她为什么来天台，她答「我想，是和ユウイチ君差不多的理由哦」，他便说「那，我们就是共犯了呢」。理由：ユウイチ 是「一『计算』出溜出课堂也不成问题，就跑到天台上躲清静」；ユカリ 是「休息时间无处可去，只能在天台上打发时间」——共同点在于「**在无处可去这一点上**」。"
    info_point: "b161 e1s_10_23/24（3962–3963、3990–4001）。3962／3963／3995 都是锚点，且与 b163 结尾 4776/4777 的告别（【不良少年】／【不良教师】作说话人）**首尾闭合**——那两行的说话人标签本身就是这两个词。"

  - id: q12
    question: "夏日祭那天ユカリ 为什么一个人？她向ユウイチ 坦白了什么？ユウイチ 听完之后说了什么？"
    reference: "她本来说好和熟人一起看烟花，对方临时有工作来不了。坦白的是：**她刚刚分手了**——和大学时同一个社团起交往的男友，渐渐联系不上；「所以今天，我想着这是最后的机会。要是这样还见不到，就干脆分手。结果今天，果然，就是这样」。她随后为说这些道歉，还说「我不是拿你当替代品哦。不是的……应该，不是的」。ユウイチ 的回应是「**谢谢你把这么重要的事告诉我，老师**」，并笑着问她「待会儿，杏子糖，要不要吃？」"
    info_point: "b161 e1s_10（4053–4132）。ユカリ 的语域在这一场从「逗弄学生的老师」滑到「向学生示弱的成年人」，是 25 连场里第一处转折。「不是拿你当替代品」这句的犹疑（说了又收回）是她全篇的核心矛盾。"

  - id: q13
    question: "ユカリ 说她在考虑辞去教师，理由是什么？ユウイチ 请求她做什么？"
    reference: "理由：她本想更认真地面对每一个学生，「可是呢，做不到。当教师的，没有时间」——备课、应付家长；教师之间也颇多龃龉，学校还有隐瞒体质。更根本的是「我到底有没有教别人东西的资格呢。老实说――我没有自信」「待在学校里呢，有时会喘不过气。很奇怪吧，居然是我觉得憋闷」。ユウイチ 的请求：「**如果是那样的话，能不能等到我们从学校毕业？**」并说「我也会……在毕业之前，想想自己能为老师做点什么」。"
    info_point: "b161 e1s_10_2（4141–4167）。这个请求在本段末尾被兑现两次——4626 ユウイチ 再次请她「在我回来之前继续当老师」，以及五年后 4740–4742 她答「至少到你毕业为止」。三处构成一条贯穿线。"

  - id: q14
    question: "ユウイチ 家里出了什么事？他为什么总在天台上睡觉？后来他去看医生拿到了什么？"
    reference: "家里：父亲本是工作狂几乎不着家，最近好像被公司辞退了；有人介绍新去处但他本人不起劲，「所以就在家里瘫着。这三个月左右都是」；母亲天天晚上催他快去工作，两人吵到半夜。ユウイチ 说「烦死了，随你们的便吧——虽然心里这么想……可父母吵架这种事，果然还是挺难受的」，并说自己**一直睡眠不足**。之所以在天台睡：「去保健室的话，就太扎眼了……而且**那种像医院一样的味道，我有点受不了**」。后来他顺路去了趟医生那儿，说「硬要说的话这个，是精神方面的东西」，**拿了安眠药**，但「起床的时候特别难受，总觉得脑袋一直晕乎乎的」；另外他提到「上周老妈回娘家了」。"
    info_point: "b161/b162 e1s_10_3、10_7（4182–4196、4367–4390）。「像医院一样的味道受不了」这句在本段是闲聊，**却正是 q5 里千秋推理的支点**（ユウイチ 不擅长应付医院 → 去探病的不可能是他）。同一事实在两个章节里承担完全不同的功能，译文两处都不能弱化。"

  - id: q15
    question: "ユウイチ 向ユカリ 告白时，他说想去留学的三个理由里第三个是什么？他知道说了会失去什么？他最后请求她什么、她怎么回答？"
    reference: "第三个理由：「当然，是老师的事啦。ユカリ老师」——「我之所以觉得去留学也行，是因为有老师在」。他知道的代价：「我知道。老师是老师，我是我。所以我要是现在对老师说了这种话，就『**再也不能在天台上遇见了**』」，而那个地方他「曾经真的很喜欢……大概今后的人生里，也再找不到能让心里这么安稳的地方了」。他还说「**不想让给任何人**」。最后的请求：「老师也是，可以的话，**在我回来之前，希望你能继续当老师。到我毕业，为止**」。她的回答是**点头**——叙述行随即说「因为这就是我的答案」；她还说「ユウイチ君回来的时候，我一定会去见你的哦」。"
    info_point: "b163 e1s_10_14/15（4584–4630）。⚠ **她的回答是一个动作而不是一句台词**（「我点了点头。」＋「因为这就是我的答案。」）——这是全段语域最吃紧的一处，译文若把点头写轻或补出台词，这个答复就没有分量了。"

  - id: q16
    question: "图书室里两人分别前，ユウイチ 说他接下来要去做什么？他和ユカリ 约好了什么？他离开前最后说的那句话是什么？"
    reference: "他说「现在，我被アヤノ叫到天台去了。说是之前查的那件东西，答案弄明白了。也得跟那家伙说说往后的事呢」。约定：下个休息日见面，地点定在「『天台』吧。中午」，ユカリ 还问要不要给他做便当。离开前他忽然停住，小声嘀咕了一句「**……アヤノ？**」，ユカリ 问怎么了，他说「嗯，抱歉，没什么。那我走啦！」（此前ユカリ 心里已有『什么』卡住，叫过他的名字，却说「没什么，小心点」。）"
    info_point: "b163 e1s_10_15（4642–4655）。**这是坠楼那一天的前一刻**，读者已知结局、ユカリ 不知。「……アヤノ？」他到底看见了什么，原文不说；4643「有『什么』卡在心里」也不说破。译文两处都必须保持不消歧（全知纪律第 2 条）。"

  - id: q17
    question: "五年后中庭那一场，「留学」的真相是什么？ユカリ 手上戴的是什么、怎么来的？她对他开了句什么玩笑？"
    reference: "留学是**谎话**。ユカリ 说：「我听说你曾经想退学。从你父母那里听说的。可是留学，他们说不知道有那种事」；他答「实际上，我根本没想过以后的事。所以说不定，真的会去留学也不一定。毕竟就只有钱是有的，我家」，又承认「说实话，我是想逃走。**和那家伙一样**」——她于是说「那，就是一半真一半假的感觉吧」。戒指：**是「他」交给她的**——「嗯。是他交给我的。他说这是老师的东西」。⚠ 原文此处只说「彼」、**不点名**，故答案里点不点出是谁**都算对**；她说「虽然拖了好久，不过还是得好好道谢才行呢。谢谢你。我，非常高兴」。玩笑：「**你不是留学，是留级哦。真遗憾呢**」。（她还问他「有嫉妒过ナオヤ君吗？」，他答「那是当然」。）"
    info_point: "b163 e1s_10_19（4703–4772）。⚠ **本题初版把戒指的转交人写成「托ナオヤ 转交」当作得分点，是错的**——原文 4704 是 `【教師】「うん。彼が渡してくれた。…」`，用 `彼`、不点名（`ナオヤ` 要到 4725 才出现，且说的是「各种事都拜托他」、不特指戒指）。译文「是他交给我的」正是全知纪律第 3 条要求的处理，受试没点名恰恰证明译文守住了不点名，却因此被判「部分对」。**这是恒绿假信号的镜像形态：题目在要求译文泄露原文没泄露的信息。** 由 SEG-6 生产会话查出，已改。⚠ 说话人在这一场变成【教师】【男学生】而不是【ユカリ】【ユウイチ】——原文降格、译文同样降格，不因译者全知而还原人名。「和那家伙一样」的「那家伙」原文不点名（多半指アヤノ），**保持不消歧**。「留学/留级」的谐趣在中文里靠共用「留」字承接。"

  - id: q18
    question: "ユカリ 说的三个 Staff Roll 分别是什么？在最后的研究室场景里，女学生问了老师什么、老师怎么答的？"
    reference: "三个 Staff Roll：「第一个 Staff Roll 是故事」／「第二个 Staff Roll 是真正的结束」／男学生问「第三个 Staff Roll 呢？」，她答「**或许没有，也或许只要有谁去写故事，就会继续下去。不就是那样的东西吗？**」。研究室场景：老师正在给打印纸批红，说「现在正在做最后的确认，批红。我想明天或者后天就能交给你」；女学生问『**能写到这个地步吗？**』，老师答「当然」，并接着说「**不写到这个地步就没有意义了**」。（老师另问「你那边顺利吗？」，女学生答『算是还可以吧』。）"
    info_point: "b163 e1s_10_18/19（4699–4758）＋ b165 e1f（3906–3910）。⚠ `エンドロール` 的定译是 **Staff Roll**（半角拉丁、与汉字间留空格，v12 用户裁决，与 Happy End／Bad End 同族），**不作「片尾字幕」**。e1f 这一场是ユカリ 在给千秋的稿子批红——第三个 Staff Roll 正在被写出来，是全段的收束。3904 那一行另是序章 6067 的五年后镜像句。"
