  tr_note: "标题「サクラさん」→「サクラ同学」，与卡 25「选择：声音的主人」第 2 选项逐字一致（本卡即该选项的展开）。"
- card: 178
  variant: "a"
  title_zh: "章节 5：Sakura"
  body_zh: "章节 5的主人公是\n「Sakura」"
  tr_note: "同卡 10 款式；「サクラ」后无句号依原卡。"
- card: 179
  variant: "a"
  title_zh: "Sakura的日记：9月13日"
  body_zh: "在中庭，Ayano同学与我\n相遇……是这样一个故事。\n物语中的我，试着向Ayano\n同学打听了中庭的传闻。"
  tr_note: "日记卡标题式「サクラ的日记：＋半角日期」自本卡起（口径同卡 10「章节 1」）；「物語の私」→「故事中的我」（日记本身是虚构套层）；アヤノさん→アヤノ同学；ウワサ→传闻。"
- card: 180
  variant: "a"
  title_zh: "Sakura的日记：7月（未写完）"
  body_zh: "故事中的我，果然也\n是体弱多病。偶尔才\n去的学校非常无聊。\n不过，中庭有Ayano同学\n在，所以现在很开……"
  tr_note: "标题「（書きかけ）」→「（未写完）」；正文止于「楽し……」的词中截断（「楽しい」没写完），中文以「很开……」（「开心」没写完）再现；……后无句号依原卡。"
- card: 181
  variant: "a"
  title_zh: "Sakura的日记：9月16日"
  body_zh: "在中庭，和Ayano同学认识\n的Yuichi同学（朋友……\n男朋友？）说了会儿\n话。还从Yuichi同学那里\n得到了好吃的甜甜圈。"
  tr_note: "ユウイチさん→ユウイチ同学（与アヤノ同学同式的校园称呼）；全角括注（朋友……男朋友？）保留；ドーナツ→甜甜圈（贯穿全篇的暗号物）。"
- card: 182
  variant: "a"
  title_zh: "Sakura的日记：9月16日（夜）"
  body_zh: "可是，或许是白天在外面待\n久了，那晚非常难受……。"
  tr_note: ""
- card: 183
  variant: "a"
  title_zh: "Sakura的日记：9月20日"
  body_zh: "又和Yuichi同学见了面，\n又得到了甜甜圈。很好吃。"
  tr_note: "双「また、」以双「又」再现。"
- card: 184
  variant: "a"
  title_zh: "Sakura的日记：9月22日"
  body_zh: "偷听这种事，很不好的，\n对吧……。\n是坏事，对吧……。"
  tr_note: "双「ですよね……。」的自责反问以双「对吧……。」再现，迟疑读点保留。"
- card: 185
  variant: "a"
  title_zh: "Sakura的日记：9月23日"
  body_zh: "因为做了坏事，所以，所以\n才遭到了惩罚，我是这么想\n的……。"
  tr_note: "「するから、だから、」的结巴以「所以，所以」再现。"
- card: 186
  variant: "a"
  title_zh: "Sakura的日记：9月29日"
  body_zh: "又是唱了歌，又是再\n一次得到Yuichi同学的\n甜甜圈，发生了好多事。"
  tr_note: "「～たり～たり」→「又是…又是…」，「またまた」→叠在「又是」上的「再一次」；原文首词平假名「うた」与后文汉字「歌」的书写差无法迁移，从略。"
- card: 187
  variant: "a"
  title_zh: "Sakura的日记：断片"
  body_zh: "告诉Ayano同学的种种……\n担心Ayano同学有点「容易\n相信」这件事，告白的话就\n在夏天吧……这件事，还有\n就是……压箱底的咒语！"
  tr_note: "备忘残句体：以「……这件事」的罗列句式保留残缺列举感，末句全角「！」照录；「とっておきのオマジナイ」→「压箱底的咒语」（备选「珍藏的咒语」）；「信じやすい」引号保留；标题「断片」直用（备选「残页」，「片段」因与 UI 词フラグメント→片段撞名回避）。"
- card: 188
  variant: "a"
  title_zh: "Sakura的日记：10月3日"
  body_zh: "最近身体的状态不太好。要\n是夏天，能一直持续下去，\n就好了……。"
  tr_note: "原文平假名比重上升（さいきん／ちょうし／つづいて，病况渐重的笔迹先兆），中文以素朴用词＋迟疑逗号渐进过渡，与卡 190 全稚拙体衔接。"
- card: 189
  variant: "a"
  title_zh: "Sakura的日记：11月12日"
  body_zh: "天冷起来了呢。\n不过偶尔，我也会去中庭\n看看「外面」什么的。"
  tr_note: "开头「ね」＝对交换日记对象的搭话语气→「呢」；「外」的引号保留并补足为「外面」（久居病房者眼中的外界）；「見てたり」→「看看…什么的」。"
- card: 190
  variant: "a"
  title_zh: "Sakura的日记：2月13日"
  body_zh: "身体有点，不舒服，所以，\n像样的，日记下次再……"
  tr_note: "原卡全平假名＋错位读点（病中稚拙笔迹，本批唯一）：中文以稚拙短语、错位顿逗（「像样的，日记」拆断定语）、动词悬空再现——「かきま……」系「かきます」词中截断，中文以「下次再……」不出动词对应；……后无句号依原卡。"
