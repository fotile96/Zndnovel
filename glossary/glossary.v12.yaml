    rationale: >
      原文 `よろしく` 同时是「代我问好」与「往后交给你了」两读，中文无双读词。
      本段 15353 是**ユウイチ留给直哉的唯一遗言**（经酒吧老板转达），取托付侧『拜托了』，
      问候侧一读明确丢失；而已入线 683『お嬢ちゃんにもよろしく』取的是问候侧「问声好」——两处分治是有意的。
