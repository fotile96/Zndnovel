conventions:

  saturation-gate-repointed:
    since: v14
    title: main 收官后，饱和度的「未覆盖」只指向 extra/ambient 轨——登记判据随之改写
    body: >
      main 轨 100% 覆盖之后，`saturation.py` 表上任何没到 1.000 的词，
      **未覆盖处必然全部落在 extra 轨（829 行：卡名/场景名/卡片提示串/存档名）
      或 ambient 轨（56 行：系统告示与彩野递错卡的反应串）**。
      于是 active.json 的登记判据从「全库还有多少没译」变成
      「**剩下那几处会不会与 main 已落定的形分歧**」——这是一个完全不同的问题：
      ① 剩余处若与冻结卡名逐字相符，**它根本不是翻译任务**（见 frozen-skeleton-lookup-for-name-lanes），
         登记零收益。本版的 `いつもの` 即因此被判**不入表**（剩余 6 处全是卡名位，且 W2 仅 0.528）。
      ② 剩余处若是系统串位而已入线的对白位另有形，**裸键反而正确**（对剩余批次零误报）。
         本版的 `作成` 即属此类（169/169 系统串位，W2 0.882 的未命中全在被排除的对白位）。
      → **操作要求**：main 收官后每登记一条 active.json，必须先把
        「剩余那 N 处的载体类型（plot_title / card_msg / scene_title / ambient）」列出来，
        再决定入表与否。只看饱和度数字会同时犯上面两种相反的错。

  frozen-skeleton-lookup-for-name-lanes:
    since: v14
    title: 卡名与场景名不是翻译任务，是查表任务
    body: >
      v11 的 `frozen-skeleton-answers-first` 说的是「裁决前先 grep `skeleton/cards.zh` 的 tr_note」——
      那是**逐条**的。v14 发现它有一个**规模化形态**：
      extra 轨 829 行里 **364 行（44%）与冻结卡名逐字相符**
      （plot_title 195/195、scene_title 155 唯一串 /169 行、card_msg 的 `『X』` 全部）。
      这些行的正确译文早在 `skeleton-v1` 就冻结了，**重译不是浪费而是引入不一致**：
      卡面图片按 `cards.zh.yaml` 重制，卡名总表与场景名条是同一个名字的另外两处露出。
      → 已成硬规则写进 style.md。派发单必须显式携带这条，并给出机械对表方法。
      → 更一般的形态：**凡冻结面已给出答案的位置，先查表再动笔**；
        在裁决会话，这一条还额外意味着「本项根本不必送用户」。

  not-all-ledger-rows-are-text:
    since: v14
    title: ledger 里混有不是文本的行（反编译产物的必然）
    body: >
      `tools/build_ledger` 按 `vms(id, voice, <第三参数>)` 抓取，**第三参数不总是字符串字面量**。
      实测 6 行：id 1/2/4/5/58 是 lua 变量或字符串拼接表达式（提取器存下了源码文本），
      id 3 走 `oCom.debagvms`（调试函数）。
      这类行译出来是**回写脚本时的硬故障**（lua 表达式变成中文字符串常量）。
      → 用户已裁「不译，zh 原样等于 jp」，写进 style.md。
      → **判据必须是看 lua 原文**（`grep -n 'vms(<id>,' lua_scripts/`）；靠「jp 长得像不像代码」会漏
        ——id 3 是一句完整通顺的日文，只有回原文才看得出它走的是 debagvms。
      → 开发轨待办：`build_ledger` 宜给这类行打 `kind: non_text` 标记，别让每一轨各判一次。

  wide-key-can-fake-a-rollover-item:
    since: v14
    title: 滚存项本身也要过一次「把未覆盖行的 jp 打出来看一眼」
    body: >
      `バー` 被 seg6 §8 列为**连挂四段的最高优先滚存项**，理由是「未覆盖 56 处全在下一段」。
      v14 把那 18 处（数字随进度变化）逐条打出来：**`ハンバーガー` 1 处 ＋ `ゲームオーバー` 17 处，
      一处真酒吧都没有。** 即 v10 体例②「键太宽→跨词边界误报」不只会造成误报，
      **还会凭空造出一个看起来很紧急的滚存项，并让它逐段滚下去**。
      发现成本＝一条列印语句；不发现的代价＝连续四段把一个不存在的问题排在最高优先。
      → v13 的 `w2-key-must-match-the-construction` 要求「**登记前**看未覆盖行」，
        本条补的是「**列进滚存清单时**也要看一次」——滚存清单是下一段的输入，
        错误在那里比在词表里传得更远。

  # ── 承前有效，本版不动 ──
