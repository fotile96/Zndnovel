segment: seg5-s6-s7f
questions:
  - id: q1
    question: "サクラ在信里出的推理谜题，题目条件是什么？正确答案是什么？"
    reference: "条件：有Ａ、Ｂ、Ｃ三把椅子，分别坐着アヤノ、サクラ、ユウイチ三人；三人的属性是——アヤノ不说谎、サクラ说谎、ユウイチ既说真话也说谎。坐Ｂ椅子的人说「Ｃ是アヤノ」，坐Ｃ椅子的人说「Ａ是アヤノ」。正确答案：Ａ＝アヤノ、Ｂ＝サクラ、Ｃ＝ユウイチ（アヤノ在选项里选的是第５项）。"
    info_point: "s6s_110 图书室段的谜题题面（15578–15586）与解答（15589，crd 侧 368「５号才是正确答案」）。三人的说谎属性一旦译错，题目就无解；前缀卡96 只说「要施咒语居然还有题目要解」，题面与答案都不在卡上。b142/b144"

  - id: q2
    question: "アヤノ在哪里读サクラ寄来的信，是一处二选一的分岔。两边各自通向什么结果？"
    reference: "①「在家读」——回到家、回到自己房间拆开信，读到信的开头（サクラ说热天已经过去、白天能出门了，又说从护士那里听来一件有意思的事，那个人的母校和アヤノ的学校是同一所），之后是「书信往来了很多次，可隆冬之中、春天来临之前，信件戛然断绝」的回想，最终**■游戏结束**（提示：「适合读故事的地方是……」）。②「在图书室读」——空无一人的图书室里拆开信，第１张纸上写着「推理谜题！」，故事继续（接着就是那道三把椅子的谜题）。**这是互斥的两条路，不是先后发生的事。**（只答出其中一边并说明它是选择的结果，也算对。）"
    info_point: "s6s_60_sel「選択：どこで読む」。参考答案依 snr_s6_10_s.lua:1125-1153 调度器判定。选项2 需持卡才出现（分支解锁机制）。若把两边译得界限模糊，读者会把 Bad End 读成正传。b139/b140/b142"

  - id: q3
    question: "サクラ溜出医院来到学校天台，交给アヤノ什么东西？她提出了怎样的请求，理由是什么？"
    reference: "她从睡衣底下取出一本笔记本交给アヤノ——封面写着『故事的草案』，因为在衣服底下放了很久而微微带着暖意，里面密密麻麻写满了字。请求是：后面的部分由アヤノ来写，「两个人，一起写故事。由アヤノ同学来改变我的故事。把它变成我和アヤノ同学的故事」。理由是「因为我一写，就会『变成那样』」——她说自己一去想『故事』，结局就会变得阴暗，她写不出来。"
    info_point: "b145 天台场（15633–15639、15653–15659、15683–15684）。『故事的草案』这个封面标题与后文『True Color』的诞生直接相扣；「一写就会变成那样」是サクラ 自知命不久矣的侧写，译得含糊则请求的动机全失。"

  - id: q4
    question: "サクラ在天台上说了什么关于自己身体的话？临走前她请アヤノ答应一件与ユウイチ有关的事，是什么？"
    reference: "她说「大概，我，已经，活不了太久了」，并说虽然没有被明确这么讲过，但从上次检查开始，医生和护士小姐的样子就有点奇怪；随即又自我否定说「这说不定是我搞错了……是我想太多了」。请求是：「呐，アヤノ同学。……如果ユウイチ同学来到这里，要好好地接住他哦」「求你了——」，并接着说「这样一来，我的，任务就算结束了吧」。"
    info_point: "b145（15673–15678、15704–15707）。「接住他」这句是第 7 章直哉再现那一天的伏笔源头；「我的任务就算结束了」点明サクラ 已在为身后事布置。"

  - id: q5
    question: "サクラ在天台上开了一个什么玩笑？两人在校门口告别时，アヤノ朝操场喊了什么？"
    reference: "玩笑：她把手搭上围栏，アヤノ惊叫着朝她的手臂伸出手时，她绽开笑容说「骗、你、的」。告别：看见サクラ从校舍里走出来后，アヤノ用尽全身力气朝操场喊「『Ｔｒｕｅ Ｃｏｌｏｒ』！」，サクラ回过头，アヤノ又喊「这个『故事』的标题！」，两人互相挥手直到看不见为止。"
    info_point: "b145（15708–15712、15729–15737）。这里是标题『Ｔｒｕｅ Ｃｏｌｏｒ』在全篇的**诞生位**，且刻意用全角拉丁书写；前缀 142 张卡里「Ｔｒｕｅ」出现 0 次。围栏玩笑与后文两人真的坠落形成回响。"

  - id: q6
    question: "「中庭的雪」一场里，彩野说自己应该更早察觉到「能变成两情相悦的咒语」的什么含义？"
    reference: "她说：假如「≪某个人≫，有两个女孩喜欢着」的话，那个咒语里面还包含着**让『并非』两情相悦的那一方消失**的意思——「明明应该更早察觉到的」。这句是对着（已经不在的）サクラ说的，紧接在「原来你喜欢的是≪ユウイチ≫呢」之后。"
    info_point: "b148（15766–15769）。全段最容易被当成普通台词读过去的一句，却是彩野把サクラ之死归咎于自己的核心逻辑；「让并非两情相悦的人消失」若译散或译反，这条动机链就断了。"

  - id: q7
    question: "在做卡的场面里，直哉依次给彩野看了哪些东西，才让她想起故事的标题？她想起的标题是什么？"
    reference: "直哉依次给她看：章节１、章节２、章节３Ａ、章节３Ｂ、章节４Ａ、章节４Ｂ、章节５的梗概卡片，然后是「在天台找到的『故事』的标题」（『总有一天你会看到的故事。』），最后是章节４『口袋里的字条』的场面。看完后彩野说「我想起来了。和サクラ同学一起做的、『故事』的标题」——『Ｔｒｕｅ Ｃｏｌｏｒ』。（另：中途只要递错一次卡片就会失败，须重来。）"
    info_point: "crd_103『選択：ノート』大谜题，b147（394–433、435–444）。这是全书第一次把「卡片＝记忆的外部载体」这一机制用作解谜装置；递卡顺序若译乱，读者无法理解为什么是这个顺序唤回了记忆。"

  - id: q8
    question: "小千秋为什么没有早一点把姐姐拜托她的事告诉直哉？直哉如何纠正自己的说法？"
    reference: "因为两人第一次在操场上互相自我介绍时，直哉把当时知道的『全部』都说了——他在追查彩野的『故事』、他不是『ユウイチ』、ユウイチ已经死了、他从城里回乡。而小千秋知道那个『アヤノ与ユウイチ的故事』的内容，所以说不出口。直哉先问「为什么没有早一点告诉我」，随即自己纠正：「不，不对。不是『没有告诉我』……是有什么难以开口的事，对吧？」——即**不是『没有说』，而是『说不出口』**。他还反省自己当初把情报硬塞给她是为了显示能耐、是一种示威，若分阶段慢慢说，也许不必绕这么大一圈。"
    info_point: "b150 s6f_10（15298–15321）。「没有说」与「说不出口」的区分是这一段的全部重量所在，译成同一个意思就塌了。直哉紧接着说「小千秋需要道歉的地方，１００％，不，１２０％都没有」。"

  - id: q9
    question: "酒吧老板最后想起了ユウイチ寄存威士忌时的哪两件事？"
    reference: "①ユウイチ反复念叨「反正等你来了，就替我跟你说一声『拜托了』」，说了好多好多遍（同时他整个人晃晃悠悠，还把洗手间弄脏得别的客人进不去）。②他对存放位置极尽挑剔——老板指着架子说放这儿，他说不行、那么不显眼的地方会忘掉；说别处也不行、地震一来就会掉下去；老板反驳「这里没问题，不会掉的」，他回了一句**「唯独再掉一次，我可绝对不要」**。老板还说，自己之所以还记得要把威士忌交给直哉，说不定正是因为那顿挑刺留在了脑子里。"
    info_point: "b150 s6f_20（15353、15383–15395）。「唯独再掉一次」是ユウイチ 坠楼的语义双关，也与由加里随后说的「落下的东西，和掉了的东西」相扣；译成普通的「不想再弄丢」就把双关磨平了。"

  - id: q10
    question: "由加里老师拿出来给直哉看的两样东西分别是什么？第二样东西的背面有什么？"
    reference: "①ユウイチ的「遗书」的复印件——从笔记本上撕下的一页，写着『叹气、家人、天台、不安、失去、父亲、完结』，每个词都画着○并用线连起来，字迹潦草像胡乱涂写；据说原本放在ユウイチ的桌上。由加里说的是「被说成是遗书的东西」。②一张字条，是她和ユウイチ「在图书室」抱在一起时掉在他脚边的，正面写着『谁都没见过的晚霞的秘密去天台就会明白』——与彩野的『故事』里出现过的那张字条文字一模一样。背面按五十音顺序写着平假名（『あいうえおかきくけこ……』），也就是**请钱仙用的纸**；角落里还留着天台那本『故事』上插图的涂鸦。直哉与由加里都判断那不是ユウイチ的字迹，看上去像女孩子的字。"
    info_point: "b150 s6f_40（15443–15479）。这是全书把「现实」与「故事」正式对上的第一处硬证据。『遗书』其实是解暗号的笔记，这一反转在第 7 章才揭晓（15941–15943），本段只给物证。"

  - id: q11
    question: "由加里老师为什么没有把那张字条交给警察？她要直哉答应她什么？"
    reference: "因为她想，把那张纸交出去，她和ユウイチ君的关系就会被人知道——「说不出口。我害怕」。她说那就是「一切错误的根源」，被直哉打断（「什么一切错误的根源，那种东西哪里都不存在」）。她要直哉答应的是：**「不要去死」「学生死在我眼前的样子，我再也不想看到了」**。"
    info_point: "b150 s6f_40（15480–15511）。这个约定在第 7 章由加里包扎伤口时被再次点名（16155–16157「昨天我说的话，你还记得吗？」「活下去」），是跨批的复现结构。"

  - id: q12
    question: "直哉在操场上向彩野宣布他要做什么？彩野听到后的反应是什么？"
    reference: "他先说「接下来，我要成为ユウイチ」，接着说「我要重现ユウイチ从天台坠落的那一天」。彩野的反应：听到这句话的瞬间动作停住了，小声说了句「别这样」（她已经察觉到直哉打算做什么）。直哉心里想的是：这一次，轮到我动起来了。"
    info_point: "b152 s7f_20/50（17034–17035、15850–15854）。全篇的转折宣言。「别这样」在本段出现多次，是彩野已经察觉的信号，也是她后面「不要啊——不要」的前奏。⚠ 本题初版后半问「サクラ同学等了多久」，**答案在前缀卡27**（「『那孩子』说，自己等アヤノ来到这里，已经等了５年」）——段绑定闸在题级仍判「不能答」（前半不在卡上），但该子句会稀释信号，故换成段内独有的「彩野的反应」。这一处是核对闸的卡号引用时发现的，不是闸报出来的。"

  - id: q13
    question: "递卡的场面里，直哉交给彩野的「故事的登场人物」是哪几张卡？另外有一张卡他刻意没有交给她，是哪一张、为什么？"
    reference: "登场人物是四张卡：アヤノ、ユウイチ、サクラ、ユカリ老师（在这之前先交的是「Ｔｒｕｅ Ｃｏｌｏｒ」这张，作为故事诞生的『理由』）。直哉说「也就是说，这个故事是以现实中存在的人们为基础制作出来的」，并想到「而我，并不在其中。所以，我，必须推进这个故事」。刻意不交的那张，是关于**彩野「容易受到暗示」的体质**（自我暗示／强迫观念）的卡——他把卡片收进了胸前的口袋，心想「这张卡片，没有必要交给アヤノ同学」「这件事，只要我一个人知道就够了」。"
    info_point: "b152 s7f_70–160（15865–15891）与 s7f_260（15964–15968）。递卡段是全书唯一「译文必须与已定稿卡面逐张对齐」的位置。**「刻意不交的那一张」是本题的真考点**——前缀卡105/106 已写了アヤノ 的自我暗示倾向，但「直哉把它藏起来」这一体贴只在本段正文里。"

  - id: q14
    question: "直哉在教室里为「再现那一天」做了哪些准备？他的手是怎么受伤的？另外，紧接着那一段布置播放器的描写（翻开笔记本第一页、按ＳＴＯＰ、接上外接扬声器、按ＰＬＡＹ）通篇没有主语，做这件事的其实是谁？何以见得？"
    reference: "直哉的准备：换上从校舍里『借来』的、不知是哪个男学生的室内鞋并重新系紧鞋带（不能再穿拖鞋在校内走动）；从裤子口袋取出手表、切换到秒表模式；做了个大大的深呼吸。受伤：他翻开笔记本最后一页取出请钱仙用的纸摊在课桌上时，书页边上夹着一片**美工刀的刀片**，右手被划开，伤口比他以为的深得多；他在纸上用力甩手臂，让血滴落在纸上染出颜色。**布置播放器的那一段不是直哉，是小千秋**——那十行无主语描写以「……姐姐。」收尾，而サクラ（佐仓雪乃）正是小千秋的姐姐；紧接着的下一段里直哉说「真怀念啊」，听的是**乘着风从远处传来**的曲子，说明按下ＰＬＡＹ的人不是他；后文小千秋也确实「把放在窗边的播放器，重新放回了口袋里」。"
    info_point: "b152。**场景边界**：`scene_s7f_290`「始まりの時間」＝16024–16035（直哉：换鞋 16028、秒表 16031）／`scene_s7f_300`「始まりの歌」＝16036–16045（**千秋**，末行 16045「……姐姐。」）／`scene_s7f_310`＝16046 起（直哉听远处的曲子）。⚠ **本题初版把 16036–16043 算作直哉的准备**，是出题人按 id 连号顺读、未查场景边界所致（与 seg4 q6 同型的错误），由 SEG-5 生产会话查出、经 lua 复核确认。改正后反而成了本段最好的一道题：**那十行原文无主语、中文也无主语，读者只能靠末行的「姐姐」认出施动者**——译文若擅自补出主语或把「姐姐」译散，这个判断就没了。「彩野的注意力只有约 15 分钟」的机制在 16032 明写；秒表最后停在 14 分 15 秒（16263）。"

  - id: q15
    question: "播放器里放的是什么？录下它的人是谁？为什么这首曲子是「开启故事的钥匙」？"
    reference: "放的是一盘磁带，录着歌声；录下它的人是**小千秋的姐姐「佐仓雪乃」——也就是サクラ同学**，她为了难得才能见上一面的妹妹，把录进自己歌声的磁带交给了她。伴奏是传到医院里的『回家的歌谣』，サクラ就是和着它唱的。它之所以是钥匙：几年前『回家的歌谣』每到傍晚就用比现在更大的音量从学校附近街区放出来，不光这所学校、连サクラ住院的那家医院也能听到；而这首歌**正是彩野父亲喜欢的歌**（也就是父亲来接被困天台的彩野时背着她唱的那首）。"
    info_point: "b152 s7f_310（16046–16055）。**「佐仓雪乃」＝サクラ 的双层写法在这一行并置**——汉字侧译中文、片假名侧保留原形，是双层人名机制的样板位（首次揭示位 14494 在 SEG-4）。把任一侧统一掉，这行的全部信息量就没了。"

  - id: q16
    question: "叙述里回溯的彩野幼年被困在天台上的经过，她出不去的具体原因是什么？"
    reference: "她小学低年级时，星期天吃晚饭为一点小事和父亲吵架，出了家门却再无别的去处，想着「先爬到高的地方眺望一下风景」，于是溜进家附近那所高中、上了天台。风吹过、看着风景平静下来后想回家道歉，却发现**无论怎么踮起脚尖，手都够不到天台那扇门的把手**——因为天台的门为了防止雨水流进校舍，装在了高出一级台阶左右的位置上。就因为这道落差，她陷入了「进得来却出不去」的状态。那种年幼时体会到的绝望在她心里留下了很深的伤。"
    info_point: "b153 s7f_430（16196–16204）。全书最关键的一处「机制性」解释——绘本『总有一天你会看到的故事。』、『谁也没见过的夕焼け』、以及彩野一受刺激就往天台跑的行为模式，全部由这一段的门槛落差生出。译得笼统（如只说「门打不开」）就丢掉了因果。"

  - id: q17
    question: "サクラ犯下的那个「错误」是什么？彩野为什么始终没有把「让故事结束的方法」告诉直哉？"
    reference: "错误：サクラ和「ユウイチ」是在医院的中庭遇见的，她因为对方是来探望住院的彩野的，就认定那是ユウイチ；但ユウイチ受不了医院、探望彩野只有她住院时的那一次——**真正常去探望彩野的人是直哉**。サクラ把和彩野说话的那个人误认成了『ユウイチ』，于是给故事里的男主角取名『ユウイチ』，故事从此「脱线」。彩野不说的理由：让故事结束的方法，就是让顶着ユウイチ这个名字的直哉取代ユウイチ、作为故事里的人物去行动——也就是「直哉承认自己就是ユウイチ，再由他向彩野告白」。彩野**不想让直哉去承担那个角色**，才想把所有问题自己一个人扛下来。而且她无法保有连续的记忆，所以只要把「不把真相告诉直哉」写进笔记当成规则，那就会成为绝对不会被打破的规则——在故事里，也在现实里。"
    info_point: "b153 s7f_520–590（16304–16313、16409–16443）。全书的核心诡计。也解释了『章节４Ｂ』（所有人都死去）与『章节３Ｂ』（否定与ユウイチ的 Happy End）这两条黑暗分支为什么会诞生（16427–16428）。"

  - id: q18
    question: "彩野悬在天台外面时，是什么让她重新使上力气？最后直哉说接下来要创作的故事是什么？"
    reference: "是**小千秋的呼喊**——从地面上传来，小千秋用几乎要撕裂开来的声音一遍遍喊着「アヤノ同学！」（与其说是呼唤，不如说已经是喊叫）。彩野嘀咕了一句「……サクラ……同学」，随后能感觉到她手臂上渐渐恢复了力气，最后彩野的手反过来抓住了直哉的手臂，被拉了上来。最后在天台上，由加里老师问「这个『故事』接下来会通向哪里呢」，直哉答：「章节４，从『谁都没见过的晚霞』分岔出去的新选项，『Ｔｒｕｅ Ｃｏｌｏｒ』。这就是接下来要创作的故事」。"
    info_point: "b153 s7f_570（16363–16391）与 s7f_620（16465–16469）。千秋的喊声在文本里被标成【サクラ】『アヤノ同学！』——彩野听到的是姐姐的声音，这个说话人标签的处理是本段一处高风险位。结尾直哉的回答是全篇标题『セカンドノベル』三重题意之一（要写的续篇）。"
