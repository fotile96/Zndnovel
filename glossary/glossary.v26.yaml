revision_v26_bamen_register:
  rule: >
    系统串位（≪…≫ 卡片说明 19 行、○102、【＊＊＊】967、mesNot 系统台词 61/72/75/81/82、
    crd_6 教程帮助文 18 条、17045）保持「场面」，与烤字 UI（sys_5_d/sys_5_f/sys_13_a/tut_2_b/tut_4_b/sys_1_g）
    同形；对白与旁白位（直哉／彩野的做卡框架对话、_f 章旁白）一律「段」族。`シーン` 一律「场景」不变。
  template:
    - "この／その／あの／ここの場面 → 这一段／那一段"
    - "どの／どこの場面 → 哪一段"
    - "『X』の場面 → 『X』那一段（指当前段作『X』这一段）"
    - "〜する場面（だね） → 「〜的那一段（，对吧）」或「这一段是〜」——句式不强求统一，只统一名词形"
    - "一場面／もう一場面／最後の／次の／前の場面 → 一段／另外一段／最后一段／下一段／前一段"
    - "光杆或复数（他の／色んな／同じような／分岐する／一部の場面） → 段落"
  why: >
    汉语没有一个词能同时站住 UI 标签与口语两个语域：「场面」在做卡对话里生硬（通读者 134 处不约而同改掉），
    「场景」已是 シーン（58 行，含 UI），「片段」已是 フラグメント（模式名）。按语域分立后，
    同句并存的 744/954/1080/2401/2407/2584/3591 正靠「段／场景」区别开，UI 与系统串继续与烤字同形。
  kept_as_is: >
    用户维持的通读个例不回改：3429「这一段落」、1020「这个段落的『故事』」、10332 シーン「那一场景」；
    「段落」带指示词的变体（2744/2977/2994/3252/3401/3580…）视同段族，不归一。
    530「因为这之后，就是最后的场面了」用户复看后维持（最後の場面＝故事收尾处，「最后的场面」成立）。
    e1s 4414 `嘘をつく相手と場面`＝「场合」义，不在此列。967【＊＊＊】是卡片不足的系统提示，保持「场面」。
