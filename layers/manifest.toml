[base]
dir          = "lua_scripts"
ledger       = "data/ledger.jsonl"
ledger_extra = "data/ledger_extra.jsonl"

[lane]
dir = "pilot/lanes/opus/data"      # forward.jsonl / patches.jsonl / forward_extra.jsonl

[compiler]
luac       = "~/pyluadec-refactor/build/luac_sz4"   # 环境变量 SNDL_LUAC 覆盖
header_hex = "1b4c75615100010404040800"

[overlays]
order = ["fonts", "cardname-halfwidth", "encore-menu", "finale-read-flag", "title-logo-zh", "finale-gallery-cg", "novel-notice-s1f", "novel-notice-entry", "boot-dedication", "strip-ipl", "boot-handoff"]   # 文件名去 .toml，施加顺序

[[scripts]]
file    = "scripts/snr_finale.lua"
member  = "script/snr_finale.lua"
profile = "release"

[gim]
replace = [["card_zh", "card"], ["select_zh", "select"], ["select_voice_zh", "select"],
           ["scene_zh", "scene"], ["plot_zh", "plot"], ["sysgim", "sysgim"],
           ["sysgim_title_zh", "sysgim"], ["sysgim_note_zh", "sysgim"], ["sysgim_panel_zh", "sysgim"],
           ["event_zh", "event"], ["cutin_zh", "cutin"], ["cutin_tut_zh", "cutin"],
           ["mode_zh", ""], ["memory_thumb_zh", ""]]           # (build 产物目录, 成员前缀)
new     = [["finale_cards", "card", "card/crd_1_a.gim"],
           ["finale_menu", "sysgim", "sysgim/title_13_a.gim"],
           ["finale_title", "sysgim", "sysgim/title_01_a.gim"],
           ["boot_dedication", "sysgim", "sysgim/IPL01.gim"],
           ["finale_event", "event", "event/eve_74_x.gim"],
           ["finale_voice", "event", "event/eve_0_i.gim"],
           ["finale_select", "select", "select/sel_voice1_sel_a_on.gim"]]  # + 模板成员

[[fonts]]
size = 17
member = "pgf/LXGWWenKai-Regular.pgf"
[[fonts]]
size = 9
member = "pgf/LXGWWenKai-Regular-09.pgf"

[eboot]
source   = "assets/EBOOT.dec.elf"     # PPSSPP dump 的解密 EBOOT 截到 elf_size（584689 B）；版权物，不入库
sha256   = "8737f1d35db01e9cde98efb09c8272c835195f46321b4b2b75fdb36a6ece2c50"
iso_path = "/PSP_GAME/SYSDIR/EBOOT.BIN"
order    = ["kinsoku", "ruby-p5", "msgcol-px", "savebuf", "ios-movie"]     # layers/eboot/*.toml 施加顺序（区间不得重叠；ios-movie 层 profile="ios"，只在 build_disc 的 ios 阶段施加）

[ios]
# iOS 变体盘 game_zh_ios.iso：release 出盘随 iso 必出（test 剖面要 --ios）；仅推荐 iOS 商店版 PPSSPP（1.20.x）。现行盘不受影响。
# 依据 docs/ops/movie-playback-ppsspp-2026-09-24.md「追记：iOS」；固件模块取自本作 UMD 自带 6.20 升级包（解密）。
iso_name   = "game_zh_ios.iso"
module_dir = "/PSP_GAME/USRDIR/module"          # 加载例程写死的 disc0 路径与此一致（tools/ios_eboot.py PATHS）
modules    = ["mp4msv.prx", "libmp4.prx"]       # tools/ios_fwmod.py 产物（输入/输出指纹钉在该工具常量里）

[ios.movies]                                     # tools/ios_movie.py 产物指纹（FFmpeg 9.0.1，bitexact）
"op.mp4" = "01ce192fbc40cc93e8d691d39a83f5d5c1f756d1822cf37847c800635fc161cb"
"ed.mp4" = "be97c0d1708aaf57b1c3a1cc6409c523f687f5c32ce3408e2591d239a89a7446"
# ↑ [[movies]] 已换成用户素材的成员（现为 op.mp4）不再从原片重采样，对应指纹闲置；撤掉该条登记即自动退回。

[[movies]]
# 盘内 /PSP_GAME/USRDIR/movie/ 成员换成用户压制的影片——两张盘（game_zh.iso 与 game_zh_ios.iso）都用；因为也进 iOS 盘，
# 音轨必须是 44.1k（闸 layers._check_movies 与出盘阶段都核）。素材是原盘影片的衍生物：放 assets/movie/（版权物不入库），
# sha256 钉在这里；换素材 = 换文件 + 改 sha256。
member = "op.mp4"
source = "assets/movie/op_zh.mp4"
sha256 = "4da553b21056d44fa4307e30311b6873ab7c13735650aeebb8c5aecdc88c90e3"
why    = """中文字幕版 OP（歌词原文 + 译文；文字卡「「…うそ。」」配译）：用户 2026-09-26 交付的 op_v3_44100.mp4 第三版（第二版基础上
调整字幕描边）。按原片 PSP 参数重压（x264 Main L2.1、ref=3、无 B 帧、weightp=0、VBV 2000k/2000k），480×272 SAR 161:160、
29.97、6085 帧，音轨 AAC-LC 44.1k 立体声；画面逐帧、音频零偏移对齐原片。第二版（与本版只差字幕描边、音轨逐包相同）
在 iOS 目录盘上驾驶 PPSSPP 1.20.4 与最新 master 均 PASS；本版按用户意见未再驾驶。"""

[sound]
# 新增曲目进 SOUND.BIN（pack 容器，原 99 成员逐字节不动，新成员按名有序插入；引擎只吃带 smpl 的 AT3+，
# 详见 docs/superpowers/specs/2026-09-17-encore-bgm-injection-design.md）。编码：tools/at3p.py encode；
# 闸：layers.py check 的 _check_sound（指纹、头部规则、不与原成员撞名）；build_disc 的 sound 阶段装配。
iso_path = "/PSP_GAME/USRDIR/SOUND.BIN"
encoder  = "build/atracdenc/build/src/atracdenc"   # tools/build_atracdenc.sh 产物；SNDL_ATRACDENC 覆盖

[[sound.tracks]]
member        = "bgm/bgm_fin_1.at3"          # cGetFileName("bgm", "bgm_fin_1")：谢幕章 fin-30/35 翻卡与转述
source        = "assets/audio/bgm_5_x_edit.wav"   # 用户自供 bgm_5_x remix（48 kHz 立体声 3:21），不入库
source_sha256 = "3c8b4d20638758d5b60d47b93dca26e1be2330a270fccc7a955fd31f9a67adcd"
artifact      = "audio/bgm_fin_1.at3"        # layers/ 相对路径；发布字节的唯一真源，入库
sha256        = "e47d45e857258bc6330363d7e42710fdfcb2f411ed97dce4931262e31f105f9c"
loop_start    = 0.0                          # 秒（源 PCM 时基）；整曲循环——用户 2026-09-21 裁定回绕到 8bit 开头
trim_end      = 196.0                        # 3:16 裁尾：3:16–3:18 数字静音后的 3 秒残段不要
target_lufs   = -21.0                        # 源 −14.5 LUFS → 增益 −6.5 dB，峰值 −6.5 dBFS

[[sound.tracks]]
member        = "bgm/bgm_fin_2.at3"          # cGetFileName("bgm", "bgm_fin_2")：谢幕第二段 fin-80『全屏窗口』
source        = "assets/audio/bgm_5_x_edit2.wav"  # 用户自供第二支 bgm_5_x remix（口哨配 8bit 鼓点，48 kHz 立体声 3:16.6），不入库
source_sha256 = "ed9ae2e899cfbeb08e89f0f573e8178fe270c46a95b7d24fe85480b608941492"
artifact      = "audio/bgm_fin_2.at3"        # layers/ 相对路径；发布字节的唯一真源，入库
sha256        = "d34f0f61b605bfea56d538fb8ca87fbb2085a31ff1485c09cab901d57918bcaf"
loop_start    = 0.0                          # 整曲循环——用户 2026-09-25 裁定不琢磨循环点
target_lufs   = -21.0                        # 源 −15.8 LUFS → 增益 −5.2 dB，峰值 −9.1 dBFS；与 bgm_fin_1 同响度
