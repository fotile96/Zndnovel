# 卡号 → 触发/授予章节 映射（P3 devwave1 task-7 Critical 修复：彩野测试反剧透闸）。
# 用途：tools/ayano_test.py 的 assemble_context() 用它判定「卡组梗概前缀」里
# 每张卡是否严格早于当前受测段——不是"当前段及之前"，而是**严格早于**（同段的
# 章节梗概卡/关键词卡/场景卡一律不算"此前"，否则前缀会泄本段自己的答案）。
#
# 覆盖范围：196 条 = plotTitle[1..195] 全部真实卡 + 编外卡 200（对应卡 144 同期
# 内容，见 skeleton/cards.zh.yaml 卡 200 的 tr_note「与卡144对应」，故同记 e2f）。
# 未在此文件出现的卡号（理论上不应存在，若未来卡表变动出现新卡）在
# assemble_context() 里按"无法归章"处理——默认排除（安全方向：宁可前缀薄，
# 不可能泄题；参见 task-7-report.md 的 Critical 修复记录）。
#
# 推导方法（三类来源，逐一在 lua_scripts/ 里核实，未跑运行时解析）：
#   1) 场景/选择卡（157 张）：lua_scripts/snr_common.lua 的
#      `sceneId2aCard.<sceneId> = <card>` 真实赋值（过滤掉 38 条重复覆盖的噪声键
#      `sceneId2aCard.keyword = N`，键名字面就是 "keyword"，是反编译噪声，
#      CLAUDE.md 已记载）；每个 sceneId 用 `scene_<sceneId> = function` 精确定义
#      模式去 23 个章节脚本（snr_s0_10_f.lua … snr_e2_10_f.lua）里定位，8 个
#      sceneId 在多个脚本里以字符串形式被引用（如别章 RUN 目标）但只在 1 个脚本
#      里真正定义，已用严格模式消歧（如 e2s_10 在 s5s/e2s 都被提到，但
#      `scene_e2s_10 = function` 只在 snr_e2_10_s.lua）。
#   2) 章节梗概卡 133–145：crd_133..145 是 9 行 stub（不揭示信息），真正的授予点是
#      对应 `_f` 章节脚本收尾的 `gameSave.myCard[N].hold = 1`，已逐个 grep 定位
#      （133→s1f、134→s2f、135→s3fa、136→s3fb、137→s4fa、138→s4fb、139→s5f、
#      140→s6f、141→s7f、142→s8f、143→e1f、144→e2f、145→s3fc），与
#      CLAUDE.md「完成各章 _f 框架剧本时授予」一致。
#   3) 关键词卡（25 张：95-97/105-107/109/114-117/119-132）：多数由 Story 场景闭包
#      `myCard[N].hold=1` 直接授予（定位到所在 `_s` 脚本）；97/115/126 三张查无
#      直接闭包，改为定位授予它们的 crd_N 脚本本身对应的主卡章节（crd_56 主卡是
#      卡 56、crd_51 主卡是卡 51、crd_10 主卡是卡 10——`gets=[...]` 里的副产物
#      与主卡必是同一次现实层做卡事件，同章节）。
#
# 章节短码 → 段号（config/segments.yaml 的 seg）的换算**不写死在本文件**，由
# tools/ayano_test.py 在运行时从 config/segments.yaml 动态推导：同一章节可能横跨
# 多段（如 s3s 横跨 seg2/seg4、s4s 横跨 seg3/seg6——分支剧情来回跳章的实况，
# CLAUDE.md「跨章跳转」有载），保守取该章节出现过的**最晚**段号；未出现在任何
# 段 `chapters` 里的章节（s0f/s1s/s1f——P3 范围外、开工前已译完）记为段 0，恒早于
# 全部 P3 段。这个保守规则会让 s3s/s4s 里实际发生在更早段的部分也被排除在稍晚
# 一点的段之外（前缀略薄），但绝不会把还没轮到的内容错纳成"此前"——安全方向
# 由任务方明确拍定，权衡记录见 task-7-report.md。
#
