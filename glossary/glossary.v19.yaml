# ══════════════════════════════════════════════════════════
# 修订二（C2）：千秋ちゃん 分流（「小千秋」废止）
# ══════════════════════════════════════════════════════════
revision_c2_chiaki:
  rule: >
    「千秋ちゃん」按场合分流（用户决定）：角色对白（呼唤/直称/第三人称提及）与第一人称
    心理→**千秋酱**；中立叙述骨架→**千秋**；高频段用代词或省略（本窗口只做称谓层，
    代词密度优化留 P5 段级 pass）；**五年后段（16549 起）一律「千秋」**（高中生再用
    「酱」显稚，与「直哉哥哥→直哉哥」年龄分期同逻辑）。
  special: >
    断呼行专案：12888「小千……秋」→「千秋……酱」（断点与原文同位）；
    16090「千秋ちゃ……」→「千秋……」（截断感由省略号承担）；
    16607（五年后）「小千…秋？」→「千……秋？」。
    由加里的 ちゃん/さん 落差保留（ちゃん 位→千秋酱、さん 位→千秋）；
    彩野母 さん 位维持「千秋」；【千秋】标签与其自称不涉。
  linked: "连带定案：千秋口中「彩野さん」→「彩野姐姐」（7187 已召回方向；9020/9023 已是）；チアキちゃん（故事层）→「小Chiaki」归 C1"

# ══════════════════════════════════════════════════════════
# 修订三（C3）：「あの子/クラスの子」系「孩子」腔改译
# ══════════════════════════════════════════════════════════
revision_c3_kids:
  rule: >
    学生/同龄人互指的「～子→孩子」按说话人/听话人/被指者三方关系改译
    「同学/女孩/女生/人/她」（用户决定）；保留面：教师**谈明显年幼者**、彩野母、
    店长/护士/老教师等长辈位、被指者确为孩童、拟人宠溺、いい子 定式。
    **教师谈自己学生用「同学」**（13537 用户实裁）。
  frozen_exempt: >
    冻结咬合豁免（登记不改）：卡 131『和那孩子见面的约定』引用族
    （7467/7543/2650/2651，7600 反向拉齐进族）；卡 1『有个孩子来学校的故事』族
    （519/535/596/626/8827/14510/6557——「ある子」的含混是叙事机关）；
    绘本段 anchors 定形；9050 千秋俯视同龄人是人设。
  list: "改译清单 ~45 处随执行落 patches（逐 id 见 p5-polish-pattern-report §四 C3 与各 reader 报告）"

