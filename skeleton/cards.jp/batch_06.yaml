- card: 133
  variant: "a"
  title_jp: "Ｓｅｃｔｉｏｎ１あらすじ"
  section_label: "物語あらすじ"
  body_jp: "コックリさんのウワサを聞\nいたアヤノは、放課後サク\nラとコックリさんを行う。\nアヤノは意識を失い、サク\nラは雪のように消えてしま\nった。"
  note: "正文「雪のように」的「雪」经放大核对为上下结构（雨字头＋ヨ），非左右结构的「煙」。"
- card: 134
  variant: "a"
  title_jp: "Ｓｅｃｔｉｏｎ２あらすじ"
  section_label: "物語あらすじ"
  body_jp: "両思いになる、消しゴムに\n名前を書くオマジナイをア\nヤノは行う。妙な様子のユ\nウイチの後をつけ、不思議\nな出来事を体験。結局それ\nがキッカケとなって二人の\n仲は深まるようになった。"
  note: ""
- card: 135
  variant: "a"
  title_jp: "Ｓｅｃｔｉｏｎ３Ａあらすじ"
  section_label: "物語あらすじ"
  body_jp: "アヤノは、サクラから階段\nの不思議なウワサを聞く。\nウワサを調査すると、それ\nは信憑性があるらしい。途\n中ユウイチも加わり……\n二人は口づけを交わした。"
  note: "第 5 行行末「……」为 6 点，该行仅 11 字宽、未排满。第 6 行「口づけ」之「口」在此分辨率下与片假名「ロ」字形无法区分，按词义（口づけ）记为汉字「口」。"
- card: 136
  variant: "a"
  title_jp: "Ｓｅｃｔｉｏｎ３Ｂあらすじ"
  section_label: "物語あらすじ"
  body_jp: "アヤノは、サクラから階段\nの不思議なウワサを聞く。\nウワサを調査すると、それ\nは信憑性があるらしい。途\n中ユウイチも加わるが……\n二人は別れた。"
  note: ""
- card: 137
  variant: "a"
  title_jp: "Ｓｅｃｔｉｏｎ４Ａあらすじ"
  section_label: "物語あらすじ"
  body_jp: "ユウイチはポケットに入っ\nていた不思議なメモを調査\nする。途中、意識を失いか\nけたアヤノを発見したユウ\nイチはアヤノを助け出す…\n…セクション１のように。"
  note: "六点省略号跨行折行：第 5 行行末为 3 点「…」，第 6 行行首再接 3 点「…」（点数经像素核对）。正文「セクション１」的「１」为全角（占满全角字位，与 batch_00 卡 10 正文一致）。"
- card: 138
  variant: "a"
  title_jp: "Ｓｅｃｔｉｏｎ４Ｂあらすじ"
  section_label: "物語あらすじ"
  body_jp: "ユウイチはポケットに入っ\nていた不思議なメモを調査\nする。途中、意識を失いか\nけたアヤノを発見したユウ\nイチはアヤノを助け出すが\n……サクラとユウイチは屋\n上から転落してしまう。"
  note: "第 6 行行首「……」为 6 点，整组位于行首、未跨行（与卡 137 的 3＋3 跨行不同）。"
- card: 139
  variant: "a"
  title_jp: "Ｓｅｃｔｉｏｎ５あらすじ"
  section_label: "物語あらすじ"
  body_jp: "サクラの身体があまり丈夫\nでなかったこと、ドーナツ\nが好きだったこと、歌をう\nたったこと、ユウイチの事\nに、気がつかなかったこと\n……二月に……「別れた」\nこと……。"
  note: "正文含三处 6 点省略号：第 6 行行首、「二月に」之后、第 7 行「こと」之后（末处后接句号收束）。「別れた」外为全角「」。"
