# skeleton/anchors.yaml — 伏笔锚点行（P0 Task 20 产物）
# schema: [{chapter, items: [{id, jp, zh, recall}]}]
#   id     vms 消息 ID（data/ledger.jsonl 主键）
#   jp     原句或其关键句段（ledger jp 字段的连续子串，控制码 _n/_r、ruby、引号原样）
#   zh     中文定译——正文翻译轨在该 id 处【逐字沿用】；控制码位置已随中文语序排定
#   recall 回收位置与方式；「同串沿用」= 所列 id 处原文逐字相同（或注明差异），直接复用本条 zh
# 术语依 glossary/glossary.v6.yaml；已定译复现句沿用 glossary/voices/*.md 并在 recall 标注来源。
# chapter=global 为跨章逐字复现句组；chapter=crd 为做卡剧情（crd_0/crd_2＝序章教程流）。
# 裁决已落定（2026-07-30）：ハッピーエンド→保留 Happy End（v5）；15463 镜像原文无读点；16319「不过嘛」；11124 扉页空格形与书名形并存；
#   v6：腕 按语境取「手／手臂」、帰りの歌→回家的歌谣、千秋五年后私下称呼「直哉哥」（儿童期仍「直哉哥哥」）。
#   v26（2026-09-26）：通读修改采纳——6070「一把拿起」、6102『你所在之处』、6113「最重要的事」（与 6114/6317/e1s 4124 同形）、
#     6589「这张名片」、8478 语序「原来，你不肯为我遵守约定呀」；s7f 镜像 15798/15820 同串同改。6162 的通读改法未采纳（聞いた 主语缺省为彩野）。
# 本文件 zh 经用户整体润色定稿（2026-07-30）：允许相对原文的适度意译（尺度概括见 glossary/style.md「伏笔锚点与润色尺度」节）；
#   锚点句的"不逐字对应"是定稿属性而非待修复项——正文翻译轨遇锚点 id 一律逐字沿用本文件 zh。

- chapter: global
  items:
    - id: 6070
      jp: "『じゃあね』と彼女は言って、立ち上がり素早くハンドバッグを手に取ると僕の部屋から出て行った。"
      zh: "『再见啦』，她说着站起身，一把拿起手提包，走出了我的房间。"
      recall: "时间循环句：s7f_10 开头 15798 同串沿用；sof_20/s7f_10 整段互为镜像重演，共有句须逐字一致。e1s 4777 的「じゃあね」同词呼应（→「再见啦」）。"
    - id: 6085
