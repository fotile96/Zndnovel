recall_c3_reopen:
  why: >
    中文「孩子」默认指儿童；原文「ある子／あの子」的「子」是对年轻人（尤其少女）的泛称，
    年龄含混在中文里落成了「小孩」。v19 C3 已定「学生/同龄人互指不作『孩子』」，
    只因卡 1 与卡 131 的卡名咬合（图片 + 正文引用族）而登记豁免。骨架既然解冻，
    没有理由让这两族继续例外。

  # ── 卡 1 族：『有个孩子来学校的故事』→『有个女孩子来学校的故事』 ──
  card_1:
    title_before: "有个孩子来学校的故事"
    title_after:  "有个女孩子来学校的故事"
    body_after:   "走进教室时，看到课桌\n上的涂鸦，彩野同学\n想起自己以前写过「有个\n女孩子来学校的故事」。"
    ids: [519, 535, 596, 597, 626, 627, 6557, 8827, 14510]   # 597/627 是『有个孩子』片段引用
    extra: ["plotTitle:1", "snr_s0_10_f:1051"]
    finale: [17385, 17442]
    rationale: >
      「ある子」所指（アヤノ；597/627 直接点破「是彩野同学，还有――」）全为女生，
      性别在原文里不是机关，「女孩子」不泄露任何谜底，而年龄误导消失。
      v19 豁免理由「年龄性别含混是叙事机关」中，性别一半本就不成立。

  # ── あの子＝Sakura 族（含卡 131）：「那孩子」→「那个女孩」 ──
  anoko_sakura:
    rule: >
      故事层アヤノ／现实层彩野复述故事时，指尚未点名的サクラ的 あの子／その子／…子
      一律「那个女孩」。同一行第二个 あの子 可取「她」避免叠用（7543）。
    title_131_before: "和那孩子见面的约定"
    title_131_after:  "和那个女孩见面的约定"
    ids: [2013, 2171, 2173, 2174, 2202, 2204, 2219, 2224, 2225, 2359,
          2650, 2651, 2859, 7467, 7543, 7600, 7847, 7860, 8165, 8634]
    diary_cluster_ids: [15156, 15170, 15189, 15190]
    diary_cluster_note: >
      v19 判「あの子 指已故サクラ的疼惜位，身份合适」而保留；本版撤销——同一个声音
      （アヤノ）、同一个所指（サクラ），族内不分治。卡 193 随之。
    cards: [5, 8, 21, 22, 27, 131, 193]
    review_gate: "D2/D2b 的落地文本统一拉出供用户复看后定稿（裁定表 §六）"

  # ── v19 C3 规则下的漏网（无新规则，全是既有判据的机械适用）──
  c3_stragglers:
    rule_refs: "同龄人互指不作「孩子」；教师谈自己学生用「同学」（13537 用户实裁）"
    ids:
      2003: "这样的孩子→这样的女生（与 2002 同行口径）"
      2018: "这孩子是真实存在的，是个体弱多病的女孩→这个女孩是真实存在的，而且真的体弱多病"
      7980: "各种各样的孩子→同学"
      8004: "田径部的孩子们→学生们"
      8016: "别的班的孩子→同学"
      8147: "大概是学弟的孩子→人"
      11536: "别的孩子→同学"
      11658: "也有孩子会害怕的→同学（保健室老师）"
      11713: "田径部的孩子们→同学们（Yukari）"
      11741: "穿着同样队服的孩子→队员"
    extra: "snr_s7_10_f:2091（data/extra_translated.jsonl）那个孩子→那个女孩（直哉指故事里的サクラ）"
    card_73: "参加社团活动的孩子→学生（部活の子）"

