# 术语表 v6 —— 2026-07-30 用户裁决（v5 变更点：①腕 撤销「一律手臂」定译，改按语境取「手／手臂」；
#   ②帰りの歌→回家的歌谣；③千秋对直哉五年后私下称呼改「直哉哥」（儿童期仍「直哉哥哥」，详 voices/chiaki.md）；
#   ④新增 手首→手腕（与 腕 分立））
# 召回令（v6，已随本 commit 执行）：skeleton/anchors.yaml（回家的歌谣×5 处 + 相关 recall、16575 直哉哥、
#   腕 recall 措辞×3）；glossary/active.json；glossary/voices/{chiaki,naoya}.md；
#   glossary/style.md（润色尺度记）；CLAUDE.md（腕 注记与序章引句）。
# 豁免：skeleton/cards.zh/ 全批（含 batch_04 卡 170/171「手臂」）经用户人工核准维持原判，不追溯召回——
#   与「腕 按语境」规则相容（卡面部位描写语境）。
# 变更规则：只增版本号（v2, v3…）不改旧版；变更须发召回令（spec §2.3）
version: 6

characters:
