# 术语表 v8 —— 2026-08-02 P3 seg1-s2 段末小裁决（批 36–62，opus 车道；已入线 6278 条）
# 依据：.superpowers/sdd/2026-08-02-p3-seg1-s2/progress.md「段末」节 A–F 组人工台账
#   + 机器聚类卷宗 work/out/dossier-seg1-s2.md（382 提案 / 112 词族）
#   + 饱和度闸门 work/out/terms-seg1-s2.txt（gate=0.8，data-dir=pilot/lanes/opus/data）。
#
# v7→v8 变更点：
#   ①【成组裁决】バッドエンド→Bad End ＋ 結末→结局 一并入表——两词在 1449 同句并用
#     （「バッドエンドだよね？ これは『良くない結末』だよ」），合并成同一个中文词会读成同义反复；
#     且对偶词 ハッピーエンド 早已在表（v5），バッドエンド 漏登记，属登记疏漏而非新裁量。
#   ②【成组裁决】両思い→两情相悦——15768/15769 的真相收束句『両思い「ではない」人を消す』
#     靠这个词的字面对仗才成立，译法一漂伏笔即毁；且冻结骨架卡 35/37 已定此译。
#   ③【双层词固化】贋作→赝品 ／ ニセモノ・ニセ物→假货（原文刻意的书面/口语双层，9596→9597
#     是「听得见音、不认得词」的解释链，合并会让 9597 变成自我循环的解释）。
#     **随本版发骨架回改**：卡 41 答案链尾「赝品」→「假货」（用户裁决 2026-08-02）。
#   ④【按义二分，刻意不入 active.json】ジュース→饮料（默认）／果汁（并列例外）；
#     シンプル→简单／单纯。二者与 v7 的 モチーフ 同类，理由同 F8/F11 噪声（W2 是单值字面比对）。
#   ⑤【闸门当场裁】ハンバーガー→汉堡（0.909）、現国→现代文（0.875）、落書き→涂鸦（0.917）入表。
#   ⑥【已固化清单】饱和度 1.000（本轮无剩余占位）的词只记入本表作 P4／图片轨准绳，
#     **不入 active.json**——W2 对它们永不触发，登记只增词表长度。见 ratified 节。
#   ⑦【新体例两条】active.json 的入表三条件（active-json-scope）；
#     饱和度闸门的具名覆盖理由（saturation-gate-override）。见 conventions 节。
#   ⑧【口调表修订，均非译误、不发回改】voices/sakura.md「全程柔软敬体、即使对至交」与语料不符；
#     voices/ayano_real.md「极少直呼其名」与语料不符。二者已入线译文全部合规，只改表述。
#
# 召回令（v8，随本 commit 执行）：
#   - glossary/active.json：新增 6 条 —— バッドエンド→Bad End、結末→结局、両思い→两情相悦、
#     ハンバーガー→汉堡、現国→现代文、落書き→涂鸦。六条对已入线 6278 条译文的 W2 命中率
#     实测 **5/5、6/6、4/4、20/20、7/7、11/11，全为 1.000**（v7 起强制的登记纪律）。
#     ジュース／シンプル 按④刻意不收；贋作／ニセモノ 等按⑥刻意不收。
#   - glossary/style.md：版本行 v7→v8；新增「按义二分词（不入 active.json，但已裁定分治口径）」一节
#     —— 缘由：译者拿到的只有 active.json + style.md + voices/（build_context 注入面），
#     glossary.vN.yaml **不进 context.md**。v7 把 モチーフ 的分治口径只写在本表里，
#     译者实际看不到，等于没发。二分词的具体口径此后一律同步进 style.md。
#   - glossary/voices/sakura.md：语体行按语料重写（见⑧与本表 note）。
#   - glossary/voices/ayano_real.md：ユウイチ 称呼行按语料重写（见⑧与本表 note）。
#   - skeleton/cards.zh.yaml + skeleton/cards.zh/batch_01.yaml：卡 41 body_zh 答案链尾
#     「没有问题→原作→赝品」→「没有问题→原作→假货」，tr_note 同步（用户裁决 2026-08-02）。
#     该链尾对应的原文是 ニセモノ（非 贋作），现译与正文轨 9597/9609 反向，且会被读回成
#     「贋作那件东西」，而原意是「原作本身是假货」。**图片轨待办**：选项图
#     `png/select/sel_s2s_193c_sel_b`＝『元にした物がニセ物』须同向作「假货」。
#   - skeleton/anchors.yaml：新增跨章引用对 9793（源）↔ 2822（crd_49 引用），核心串「哪里不太对」。
#     缘由：ハズしてる 全 ledger 恰 2 处，是逐字引用链却不在 anchors，本段靠译者自觉才接住。
#   - pilot/lanes/opus/data/patches.jsonl：4 条回改（reason=recall, glossary_v=8）——
#     7187 彩野同学→彩野姐姐（违 voices/chiaki.md）、7576／8031 果汁→饮料（统一到默认义）、
#     9448 秘技→作弊（用户裁决 2026-08-02）。
#   本次**不**追溯 skeleton/cards.zh 的其余条目、不改 skeleton/cards.jp。
# 未裁决（滚存到 seg1-s3）：卷宗内饱和度 <0.8 且无具名覆盖理由的词族，其中优先级最高的四个已预算证据——
#   分岐→分岔（31/53=0.585，已入线 31/31 零例外，剩 22 处；机制词，下段极可能过闸）；
#   プラネタリウム→天文馆（22/34=0.647，22/22 零例外，正文轨剩 4 处全在 e2f）；
#   バー→酒吧（**饱和度表的 75/29 是子串误计**——ハンバーガー／ゲームオーバー 全被计入；
#     真「酒吧」义实为 15 处 + extra 1 处，已入线 2 处，故实际饱和度约 0.13，远未过闸）；
#   黒板の上の時計（8/11=0.727，母题道具，剩 3 处）。
# 变更规则：只增版本号（v2, v3…）不改旧版；变更须发召回令（spec §2.3）
