  section_label: 'セクション1

    あらすじ'
  body_jp: '気がつくとアヤノは屋上に

    いた。どうして屋上に自分

    がいるのか、原因がはっき

    りしない。'
  note: ''
- card: 25
  variant: a
  title_jp: 選択：声の主
  section_label: 'セクション1

    あらすじ'
  body_jp: '「……」

