target  = "snr_common.lua"
profile = "release"
why     = """槽 0 = 正文 17px 中文字体；槽 1 = ruby/小字 9px。
2026-08-31 游戏内实测：ruby 走槽 1，槽 1 原配日文字体的简体字与声调元音全是空白，
不换就没有中文拼音注音。

槽 0：原先由 migrate_base 在换基座时重放，本次连同 FONT_PATCH 常量一并删除
（tools/migrate_base.py）——这一半从今往后只有这一个来源，改动已完整生效。

⚠ 槽 1：2026-09-03 再次复核更正——上一版表述（「槽 1 此刻仍由 tools/inject_lua.py
的 FONT_SLOT1_FROM/TO 在译文注入期执行」「inject_lua.py 本身在这次改动里没有被
碰」）已随「inject_lua 收缩为纯注入」那次改动一并作废：`FONT_SLOT1_FROM`/`TO`
两个常量与 `main()` 里那三行槽 1 改写已被整段删除，inject_lua.py 从此彻底不碰
字体行（这是它模块 docstring 现在的原话：「字体槽改写归 layers/overlays/fonts.toml」）。
这个层从此**独占两槽的改写权**——槽 0、槽 1 都只有这一个来源。相应地，
tools/layers.py 的 `_injected_sources()`（专供 `check --compare-compiled` 用）里
「刻意绕过 inject_lua 的 main()、只调 inject_text()」那个避让已成摆设：inject_lua
现在无论走哪个入口都不含字体补丁，没有谁先跑谁后跑的问题，也不会再有第二个
find 锚点因为被抢先替换而命中 0 次的情形。"""

[[ops]]
op   = "replace"
find = 'fontLoad(0, "pgf/tsukuminpro_e_17.pgf")'
with = 'fontLoad(0, "pgf/LXGWWenKai-Regular.pgf")'

[[ops]]
op   = "replace"
find = 'fontLoad(1, "pgf/tsukuminpro_e_09.pgf")'
with = 'fontLoad(1, "pgf/LXGWWenKai-Regular-09.pgf")'
