# P4 润色 pass 阈值（spec §9：集中一处；调整记台账；不以自动入库率为优化目标）
K: 500                 # 每 SEG 请裁配额（总额，多通道共享，含抽检占用）
                       # 2026-08-07 由 150 上调至 500，理由与影响见
                       # docs/ops/p4-threshold-ledger.md 的 T1 条。要点：SEG-1 是 P4
                       # 首次正式生产，用户裁定「宁可多花人力」——本 SEG 两条通道都没有
                       # 免检权，全部候选走人裁，150 会让段末队列被静默截断成抽样。
                       # 这是把闸门开大（更多人工介入），不是优化自动入库率，与 spec §9
                       # 的禁止方向相反，故不违背该条。**SEG-1 段末复盘后须重新裁定**：
                       # 这是全局键，不改回来会一路影响 SEG-2..N。
sample_rate: 0.10      # 自动清关随机抽检率
overturn_freeze: 0.20  # 抽检推翻率 ≥ 此值 → 冻结该通道本 SEG 自动清关权
calib_fail: 0.30       # 已废弃，score() 不再读取（2026-08-07 缺陷修复：这个阈值原本
                       # 卡的是"实质改写占比"，但把 edit<=minor_edit 一律记成
                       # "未改动"导致该判据从未真正生效——见 calib_silent_override_fail
                       # 与 tools/polish_calibrate.py 模块 docstring。保留原值只为
                       # 历史阈值可追溯，不删除这个键、也不改它的含义（避免"静默
                       # 改变既有配置项含义"），新判据走下面这个新键。
calib_silent_override_fail: 0.10   # 准入小考新判据：金标句"改动但未显式 adjudicate=true"
                       # （静默推翻人工裁决）占比 ≥ 此值 → pass=False。10 句金标下
                       # 即 1 句静默覆盖就会失败——"动了就是信号，幅度不重要"，
                       # 这是本轮修复要防的最危险失败模式，阈值故意收紧到接近
                       # 零容忍（不设 0 是留一点点冗余给"金标行恰好与某条正常
                       # 改动撞了名字判定误差"这类极端边界，实测数据见
                       # postcalib-fix-report.md）。
autoclear_abs: 4       # 自动清关幅度 = max(autoclear_abs, len(opus)×autoclear_ratio)
autoclear_ratio: 0.15
minor_edit: 4          # 校准三档：edit≤minor_edit 为轻微，>autoclear_limit 为实质
amplify_rounds: 1
session_size: 10       # 长对话双帽（沿 P3）
session_lines: 600
jp_tail_n: 8           # 回执尾串长度
