  - {jp: 直哉,   zh: 直哉,   layer: real}
  - {jp: 彩野,   zh: 彩野,   layer: real}
  - {jp: 由加里, zh: 由加里, layer: real}
  - {jp: 雪乃,   zh: 雪乃,   layer: real, note: 全名 佐倉雪乃→佐仓雪乃}
  - {jp: 千秋,   zh: 千秋,   layer: real}
  - {jp: 筑紫,   zh: 筑紫,   layer: real, note: きくちゃん绰号链见 terms}
  # 故事层（片假名层）—— 用户裁决：保留片假名原样
  - {jp: アヤノ, zh: アヤノ, layer: story}
  - {jp: ユカリ, zh: ユカリ, layer: story}
  - {jp: サクラ, zh: サクラ, layer: story}
  - {jp: ナオヤ, zh: ナオヤ, layer: story}
  - {jp: ユキノ, zh: ユキノ, layer: story, note: s8f 附身场景的自称表记}
