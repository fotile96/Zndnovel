# 修订一（C1）：故事层片假名人名 → 首字母大写罗马音
# ══════════════════════════════════════════════════════════
revision_c1_romanization:
  mapping:
    アヤノ: Ayano
    ユウイチ: Yuichi      # 长音不双写：ユウ=Yu，不作 Yuu
    ユカリ: Yukari
    サクラ: Sakura
    サクラコ: Sakurako    # 桜子括注（8625/14097），须先于 サクラ 替换
    ナオヤ: Naoya         # e1s/s8f 故事层直哉
    ユキノ: Yukino        # s8f 揭名链（16678/16688）
    チアキ: Chiaki        # 故事层千秋（4691/4728「小チアキ」→「小Chiaki」）
  scope: >
    说话人标签位（【アヤノ】→【Ayano】，含【≦…≧】【≪…≫】嵌套壳）与句中一切出现位，
    **现实层与故事层同形同改**（ユウイチ/サクラ 兼跨两层是原作设定，Yuichi/Sakura
    两层同形不是失误——16416 命名段、16420 一句四名并置是本机关的展示位）。
  layout: >
    版式口径（用户 2026-08-19 批复 C1 方案）：拉丁名与汉字后缀**不加空格**
    （Ayano同学/Yuichi君/Yukari老师/Ayano小姐/Yuichi先生/Yuichi学长/Yuichi大人/
    小Sakura/小Chiaki）——豁免 style.md v12「句中独立拉丁词前后留半角空格」，
    该规则管独立词，人名+后缀是一个称谓单元。全角标号并置（15589「ＡAyano」）
    暂按机械结果，游戏内实测后再定间隔。⚠ 游戏内渲染验证（字库/行宽）为用户侧任务。
  exempt:
    kana_pun_yuki: "ユキ 双关族不转写（15067/15068/15073/15175/15188/13882/13883/1507）——雪/往/逝三重双关的载体；13882「这两个字」量词对假名仍准"
    kana_chain: "14495/14496 假名读音链整行豁免（さくら、ゆきの、さん→サクラ→ユキノ→ユキ 的读音演示行，保留假名）"
    kana_board: "假名盘面机关不转写（8280–8287 に/ん/げ/ん、8300–8302 ユキフルトキ、8703『オ、マ、エ』『ヤ、オ』）"
    kikuchan: "きくちゃん→小菊（平假名昵称汉化定译）不在转写范围；ちくし→きくち→小菊 读音链（5779/5780/5738）保留假名"
    hiragana_names: "平假名表记（なおやさん 7102、ゆきのさん 4855、あやの 16400 已裁并入汉字）不涉"
  hiragana_two_beat: >
    平假名认名两拍（用户裁定：小写承载）——听音不知字位用小写 sakura，认名后切大写：
    8448「我，sakura」、8565「sakura？ Sakura……是谁啊？」、14073「sakura？」。
    大小写差承载原作的平/片假名表记差。
  meta_language: >
    「片假名」元话语位（用户裁定）：统一按「原文用另一种写法」处理——
    1841/715 的「是片假名拼出的」措辞连带改写（执行时逐行定稿）；
    『カタカナ先生』维持译**『片假名老师』**（11680–11682，视为对日文原表记的转述）。
  broken_names: >
    断名/拖长/结巴按罗马音音节切（执行清单逐 id 专案）：ア——ヤ——ノ→A——ya——no（9732）、
    アヤ……ノ→Aya……no（13910/14010/10050/10194）、アヤ――→Aya――（13656）、
    ユウ……イチ→Yu……ichi（11767/16376/16756/16781）、ユウイ……→Yui……（11877/16374/16754/16779/9921）、
    ユ……チ→Yu……chi（16332）、结巴首音节 ユ、ユウイチ→Yu、Yuichi（3952/10041）。
    断在后缀上的（サクラ同――）机械替换天然正确。
  skeleton_recall: >
    ★ 召回令：anchors.yaml 含名锚点（16337 族/17034/14532/15179 等）与 cards.zh 含名卡面
    （日记卡 178–191 标头族、卡 43/86/93/96/115/123/124/125 等）同步转写，完成后打
