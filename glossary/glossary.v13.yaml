conventions:
  cited-precedent-must-be-resolved-too:
    since: v13
    title: 作为裁决论据被引用的行，同样必须过 patches 层
    body: >
      runbook 的硬纪律「判断某行现在译成什么，永不单读 forward」原本只针对**回改目标行**
      （裁决前对每个要改的 id 先 grep patches）。v13 实测表明它同样适用于
      **被当成先例／论据引用的行**。
      本段实地兑现：交接件把「`学校のカイダン` 双关要不要保」列为头等待裁项，
      论据是「本作 11565 已把这个双关显式点破过」——那是 forward 的旧文本；
      patches 里 11565 早已回改为「楼梯闹鬼的那种怪谈」，且理由正是
      **用户在更早的段已裁「战略性放弃」该同音梗**。
      即：论据一旦按覆盖后的实况读，这一项就从「待裁」变成「已裁」，方向还相反。
      操作要求：**任何写进裁决输入的「已有先例 id」，都要用 resolve.py 或 forward+patches 取 last-wins 之后再引用。**

  w2-key-must-match-the-construction:
    since: v13
    title: 分治词的键要锁在构式上，不能锁在裸词上
    body: >
      v10 已立键的两个相反方向（太窄→静默漏检／太宽→跨词边界误报）。
      v13 补第三种、也是分治词特有的一种：**裸词与构式是两个词。**
      本段两处实测：
      ① `まあまあ`——本段三分裁的是「まあまあ、と言ったところ」（还行义），
         而未覆盖的 2 处里 5183 是劝解语气词（好啦好啦）、5842 是惊叹词（哎呀呀），
         **一处「还行」义都没有**。登记裸词会在 seg7 两处全部误报。
      ② `半身`——4470 的「半个自己」是比喻位，而 e2f 的 4863『ベッドから半身を起こす』
         与 4882『上半身を起こす』是身体部位义，与比喻无关。
      → 凡按义二分/多分的词，登记时把键写成**能唯一识别该义的构式**；
        写不出构式的，就只进 style.md 口径、不进任何词表。
      判据：登记前把该词**未覆盖的那几行 jp 打出来看一遍**——
      这是 v12 `w2-stock-audit-needs-line-level-review` 在**待译侧**的对称形。

  dossier-tool-blind-to-table-proposals:
    since: v12
    closed_at: v13
    title: 卷宗工具的表格体盲区（已修复，本条关闭）
    body: >
      seg3-s4 移交、seg4 复发、seg5 再复发，连续三段让 `cluster_notes` 在段末失去主要作用
      （v12 因此规定「裁决会话第 1 步一律改为人工提取」）。
      **2026-08-05 工具已修复：新增表格体识别（表头须同时含「原文」列与「译」列），
      并按容器标题把提案与记录性判断分流（后者进附录、不请求裁决）。**
      v13 实测生效：本段 43 条提案全部进卷宗，特征词零失明，交叉验证逐项对得上。
      → **v12 的「一律人工提取」规定随本条一并废止**，裁决会话恢复以卷宗为第 1 步；
        但仍建议做一次 `git diff <段起>..<段末 tag> -- .../notes/` 的提案计数交叉验证（成本极低）。
      ⚠ 工具仍会对**前几段的存量记录表**打「未能识别列结构」告警（本段 33 张），
        那是历史体例差异，**不要当成本段失明**。
