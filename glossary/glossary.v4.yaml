# 术语表 v4 —— 2026-07-30 用户裁决（v3 变更点：物語→故事（与お話合并；
# 专名「第二物语」「已失去的梦之物语」保持不变）、ナゾトキ→谜题）
# 变更规则：只增版本号（v2, v3…）不改旧版；变更须发召回令（spec §2.3）
version: 4

characters:
  # 现实层（汉字层）
  - {jp: 直哉,   zh: 直哉,   layer: real}
  - {jp: 彩野,   zh: 彩野,   layer: real}
  - {jp: 由加里, zh: 由加里, layer: real}
  - {jp: 雪乃,   zh: 雪乃,   layer: real, note: 全名 佐倉雪乃→佐仓雪乃}
  - {jp: 千秋,   zh: 千秋,   layer: real}
  - {jp: 筑紫,   zh: 筑紫,   layer: real, note: きくちゃん绰号链见 terms}
  # 故事层（片假名层）—— 用户裁决：保留片假名原样
  - {jp: アヤノ, zh: アヤノ, layer: story}
  - {jp: ユカリ, zh: ユカリ, layer: story}
  - {jp: サクラ, zh: サクラ, layer: story}
  - {jp: ナオヤ, zh: ナオヤ, layer: story}
  - {jp: ユキノ, zh: ユキノ, layer: story, note: s8f 附身场景的自称表记}
  # 双层同名（全篇无汉字，用户裁决保留片假名原样；两层统一，同名诡计的载体）
  - {jp: ユウイチ, zh: ユウイチ, layer: both}
  # 其他
  - {jp: きくちゃん, zh: 小菊, layer: real, note: 暂定；源自「筑紫」被误念的绰号链（e2s_20_4 有成因台词，翻译时需中文自洽）}
  - {jp: 熊三郎, zh: 熊三郎, layer: real, note: 祭典射的摊相关}

terms:
  # 核心机制词
  - {jp: あらすじ, zh: 梗概, note: 游戏核心机制词}
  - {jp: カード, zh: 卡片}
  - {jp: 手帳, zh: 笔记, note: （或【笔记本】，根据上下文选择更通顺的）用户裁决，更符合中文习惯}
  - {jp: 物語, zh: 故事, note: v4 起与お話合并同译「故事」（用户裁决）；专名例外：「第二物语」「已失去的梦之物语」保持「物语」}
  - {jp: お話, zh: 故事}
  - {jp: 記憶ルート, zh: 记忆路线}
  - {jp: １５分の記憶, zh: 15分钟的记忆}
  - {jp: セカンドノベル, zh: 第二物语, note: 用户裁决＝中文社区通称；logo/标题图另由图片轨处理}
  - {jp: Ｔｒｕｅ Ｃｏｌｏｒ, zh: True Color, note: 保留英文（spec 定）}
  - {jp: いつか きみが みる お話。, zh: 总有一天你会看到的故事。, note: 绘本标题，句号保留}
  # 怪谈/咒术系
  - {jp: オマジナイ, zh: 咒语, note: 用户裁决；絶対に効くオマジナイ→绝对灵验的咒语}
  - {jp: ナゾトキ, zh: 谜题}
  - {jp: ウワサ, zh: 传闻}
  - {jp: コックリさん, zh: 钱仙, note: 用户裁决，本地化考虑}
  - {jp: お化け階段, zh: 闹鬼楼梯}
  - {jp: ナハメ, zh: 纳哈梅, note: 绘本妖怪，三字音译}
  # 意象/歌
  - {jp: 帰りの歌, zh: 回家的歌}
  - {jp: 浜千鳥, zh: 《浜千鸟》, note: 实存童谣歌名}
  - {jp: 誰も見たことのない夕焼け, zh: 谁都没见过的晚霞, note: 晚霞↔朝霞承载结局反转}
  - {jp: アラザン, zh: 银珠糖, note: 甜甜圈/巧克力暗号关键词}
  # 医学/心理学（规范译名）
  - {jp: 前向性健忘, zh: 顺行性遗忘}
  - {jp: 逆向性健忘, zh: 逆行性遗忘}
  - {jp: エピソード記憶, zh: 情景记忆}
  - {jp: 手続き記憶, zh: 程序性记忆}
  - {jp: 海馬, zh: 海马体}
  # 场景词
  - {jp: 屋上, zh: 天台}
  - {jp: 腕, zh: 手臂, note: 母题词（腕をつかむ→抓住手臂），故事层/现实层统一，用户裁决}
  # 纸张类三分法（用户裁决）
  - {jp: メモ, zh: 字条}
  - {jp: ノート, zh: 笔记本, note: 与 手帳→笔记 区分}
  - {jp: 失われた夢の物語, zh: 已失去的梦之物语, note: neta 作者深泽丰旧作『あるいは失われた夢の物語』（民间通译「或是已失去的梦之物语」），本作无「あるいは」取对齐形}
  - {jp: 中庭, zh: 中庭}
  - {jp: 放課後, zh: 放学后}
  # UI 词（图片本为英文大字+日文小注；行文遇到时保留英文）
  - {jp: ストーリー, zh: 故事, note: UI 语境}
  - {jp: フラグメント, zh: 片段, note: UI 语境}
  - {jp: セクション, zh: 章节, note: 如 Section 1；行文标题卡「セクション１：アヤノ」→「章节 1：アヤノ」}
