# skeleton/cards.jp/batch_04.yaml — 卡面日文转写 batch 04（card 80–99）
# 来源：png/card/crd_<N>_a.png 逐字转写（规程 A）。
# 字段：card(int) / variant("a"|"d") / title_jp / section_label / body_jp / note
# 约定：
#   - 卡面上的换行处以 \n 记录（双引号标量，\n 为换行转义）。
#   - section_label 为右栏全部文字；右栏上下两个标签槽位之间以 \n 相连
#     （如 "セクション3\nあらすじ"）。
#   - 右栏标签「セクションN」的数字（3/5/6/8）在卡面上均为半角字形；
#     卡 81/99 标题与正文、卡 93 标题中的「３」「６」「９」「２」「５」「：」
#     为全角（与 snr_common.lua plotTitle[81]/[99]/[93] 一致）。
#   - 卡 95–97 右栏仅有单行标签「キーワード」；卡 93 右栏第二槽位为「日記」。
#   - 特例：卡 94 正文栏为插画、无正文文字（body_jp 记空串，见该条 note）；
#     卡 87 卡面标题带句号而 plotTitle[87] 无（以 plotTitle 为权威，见该条 note）。
- card: 80
  variant: "a"
  title_jp: "口づけ"
  section_label: "セクション3\nあらすじ"
  body_jp: "図書室で、ユウイチとユカ\nリ先生が口づけしていると\nころを目撃する。"
  note: ""
- card: 81
  variant: "a"
  title_jp: "セクション３：アヤノ"
  section_label: "セクション3\nあらすじ"
  body_jp: "セクション３の主人公は\n「アヤノ」"
  note: "标题与正文中的「３」「：」为全角；右栏标签「セクション3」的「3」为半角。正文「アヤノ」后无句号。"
- card: 82
  variant: "a"
  title_jp: "走り去るアヤノ"
  section_label: "セクション3\nあらすじ"
  body_jp: "アヤノは気がつくと教室に\nいる。記憶が曖昧だ。"
  note: ""
- card: 83
  variant: "a"
  title_jp: "階段へ"
  section_label: "セクション3\nあらすじ"
  body_jp: "階段で、アヤノはユウイチ\nの声を聞く。"
  note: ""
- card: 84
  variant: "a"
  title_jp: "ユウイチの腕"
  section_label: "セクション3\nあらすじ"
  body_jp: "アヤノはユウイチを振りほ\nどくと屋上に向かう。"
  note: ""
- card: 85
  variant: "a"
  title_jp: "屋上"
  section_label: "セクション3\nあらすじ"
  body_jp: "屋上には「サクラさん」が\n居た。サクラはアヤノを追\nい詰める。アヤノは屋上を\n出て階段を下るが、階段は\n「終わらない」そして、屋\n上からアヤノは……\n　　　　　　　（おわり）"
  note: "「終わらない」后无标点，直接接「そして、」。「……」为两个省略号字符（6 点）。末行「（おわり）」（全角括号）独占一行并右对齐至栏宽末端（12 字格之第 8–12 格）；按全批约定以 7 个全角空格记录前导留空（像素实测 7 字位，同卡 57 体例）。"
- card: 86
  variant: "a"
  title_jp: "ユウイチと階段へ"
  section_label: "セクション3\nあらすじ"
  body_jp: "階段。ウワサについてアヤ\nノはユウイチに話すが、ユ\nウイチは相手にしない。途\n中アヤノは階段でバランス\nを崩してしまうが、ユウイ\nチはアヤノを抱き留める。"
  note: ""
- card: 87
  variant: "a"
  title_jp: "選択：ユウイチと……"
  section_label: "セクション3\n選択肢"
  body_jp: "「ずっと一緒にいたい」\n「でも、いつかは別れが」\nの展開があり。"
  note: "卡面标题实际显示为「選択：ユウイチと……。」（两个省略号字符后带句号）；plotTitle[87] 无句号，依其为权威记录 title_jp，卡面多出的「。」记于此。"
- card: 88
  variant: "a"
  title_jp: "ずっと一緒にいたい"
  section_label: "セクション3\nあらすじ"
  body_jp: "アヤノはユウイチにつかま\nる。一緒に屋上に行くこと\nに。"
  note: ""
- card: 89
  variant: "a"
  title_jp: "ユウイチとキス"
  section_label: "セクション3\nあらすじ"
  body_jp: "花火が夜空に打ち上げられ\nている。ユウイチとアヤノ\nは口づけをした。（完結）"
  note: "「（完結）」为全角括号，紧接「した。」之后（无空格，恰好排满该行 12 字位），其后无句号，正文即止于此。"
- card: 90
  variant: "a"
  title_jp: "選択：花火の中、ユウイチと"
  section_label: "セクション3\n選択肢"
  body_jp: "「キス」\n「キスしない」\nの展開があり。"
  note: ""
- card: 91
  variant: "a"
  title_jp: "ユウイチとキスしない"
  section_label: "セクション3\nあらすじ"
  body_jp: "花火が夜空に打ち上げられ\nている。それきり、二人は\n黙り込んだ。　　（完結）"
  note: "末行「（完結）」（全角括号）与「黙り込んだ。」同行、右对齐至栏宽末端（12 字格之第 9–12 格）；按全批约定以 2 个全角空格记录其间留空（像素实测 2 字位，同卡 175/193 体例）。"
- card: 92
  variant: "a"
  title_jp: "でも、いつかは別れが"
  section_label: "セクション3\nあらすじ"
  body_jp: "アヤノは慌ててユウイチか\nら身体を離した。ユウイチ\nは図書室に行くという。"
  note: ""
- card: 93
  variant: "a"
  title_jp: "アヤノの返信：９月２５日"
  section_label: "セクション5\n日記"
  body_jp: "サクラちゃん、元気？ そ\nうそう、ユウイチがお見舞\nいに来た日、あったね！"
  note: "标题中「９」「２」「５」「：」为全角；右栏标签「セクション5」的「5」为半角，第二槽位为「日記」。正文「？」「！」均为全角字形。首行「元気？」与「そ」之间为一个半角空格（像素实测约半格；与同系列卡 191『元気？ 』半角空格体例一致）。"
- card: 94
  variant: "a"
  title_jp: "誰も見たことのない夕焼け"
  section_label: "セクション8\nあらすじ"
  body_jp: ""
  note: "正文栏无任何文字，为一幅插画（人物微笑侧脸）；仅有标题与右栏标签。卡框为橙色系配色，与本批其余各卡的红色边框不同。右栏标签「セクション8」的「8」为半角。"
- card: 95
  variant: "a"
  title_jp: "中庭の人だかり"
  section_label: "キーワード"
  body_jp: "とてもいやな感じのひそひ\nそ声の記憶。不吉な予感が\nする。とても不吉な……。"
  note: "右栏仅有一行「キーワード」（居上方槽位），无第二标签槽位文字。末尾「……。」为两个省略号字符（6 点）加句号。"
- card: 96
  variant: "a"
  title_jp: "サクラさんのナゾトキ"
  section_label: "キーワード"
  body_jp: "オマジナイするのに問題が\nあるなんて……ゲーム……\nみたいなものなのかなあ。"
  note: "右栏仅有一行「キーワード」，无第二标签槽位文字。第二行两处「……」均为两个省略号字符（各 6 点）。"
- card: 97
  variant: "a"
  title_jp: "絶対に効くオマジナイ"
  section_label: "キーワード"
  body_jp: "そのオマジナイは絶対に効\nく。そう私は思う。"
  note: "右栏仅有一行「キーワード」，无第二标签槽位文字。"
- card: 98
  variant: "a"
  title_jp: "インパクトのあるウワサ"
  section_label: "セクション6\nあらすじ"
  body_jp: "アヤノとサクラはお互いに\n自分が知っている「お話」\nをやりとりしている。「イ\nンパクトのあるお話」をア\nヤノは求めた。"
  note: ""
- card: 99
  variant: "a"
  title_jp: "セクション６：アヤノ"
  section_label: "セクション6\nあらすじ"
  body_jp: "セクション６の主人公は\n「アヤノ」"
  note: "标题与正文中的「６」「：」为全角；右栏标签「セクション6」的「6」为半角。正文「アヤノ」后无句号。"
