# UI／标签用词定译表 —— `tools/check_ui_terms.py` 的判据来源
#
# 这里每一条都不是语感裁决，是**已入线正文的实测用法**。evidence 一栏的分母是
# 「正文（16749 条）＋卡面骨架（196 张 title/body）里 jp 含该词的行数」，分子是
# 「其中 zh 含定译的行数」。收录门槛：占比 ≥85%，或虽样本少但取值唯一且属 UI 专名。
#
# ⚠ 测这些数时踩过一个坑，留在这里免得再踩：卡面骨架的 jp 侧有 `section_label`
#   字段而 zh 侧没有（右栏中文另存 `data/card_section_labels.jsonl`）。把它算进
#   jp 语料，あらすじ／セクション／選択肢／キーワード 四条会各自「漏」出百来行，
#   占比掉到 55–68% 看着像用词混乱——**实则是分母算错**。剔除后四条全是 100.0%。
#
# 刻意不收的词记在 `not_terms` 里（见文件末尾）——**写下来而不是靠调阈值压掉**，
# 否则 discovery 会年复一年地重报同几个词，闸就没人看了。

