# 烤字用字体 —— 按面、必要时按张指定。`tools/ui_font.py` 读这里。
#
# **这个文件是「最后用了哪套字」的持久记录。** 环境变量只适合临时试验，试完就没了；
# 而"这一面最终用什么字"是要跟着仓库走的决定，得写下来。
#
# 取用优先级（前者胜）：
#   1. `ZND_UI_FONT_<面>` / `ZND_UI_FONT`            —— 临时试验，压过一切
#   2. 本文件 `faces.<面>.sheets.<张>`               —— 逐张（目前只 sysgim 需要）
#   3. 本文件 `faces.<面>`                           —— 逐面
#   4. 本文件 `default`                              —— 兜底
#
# 路径相对仓库根。`weight` 只对变量字体有意义，写在静态字体上会报错——
# 静默忽略的话，你以为在看 Bold、其实还是 Regular。
#
# 字体集合（.ttc）写成 `路径#N` 指明取其中第几款，例如 `…/Songti.ttc#6`。
# **集合不写索引会报错**：不写＝静默取第 0 款，而 Songti.ttc 的第 0 款是 Black，
# 与「你以为在看 Regular」是同一种错。
#
# ⚠ 改这里等于改产物：`build/` 下的图要重烤，受字体影响的金标夹具要按实测更新。

default:
  font: third_party/LXGWWenKai-Regular.ttf

faces:
  # ── 用户 2026-08-28 看过四路对照后裁定：思源黑体 Medium ──────────────
  #
  # 理由（见 docs/ops/bake-progress.md「思源黑体 SC 试烤」节）：原作日文用的就是
  # 较重的黑体，思源在「像原作、够清楚」两维上都占优；霞鹜文楷 Regular 在 9–15px
  # 下笔干到不了一个像素，整行发灰（sysgim 为此长期挂着 2.2 的填充增益补偿）。
  # Medium 相对 Regular 没有付出档位代价，且卡面 9px 正文的字腔实测不降反升 24%。
  card:
    font: third_party/SourceHanSansSC-VF.ttf
    weight: Medium
  plot:
    font: third_party/SourceHanSansSC-VF.ttf
    weight: Medium
  scene:
    font: third_party/SourceHanSansSC-VF.ttf
    weight: Medium
  # select 原本要押后到「anchor 居中修完」再定（2026-08-28 用户裁定）。居中已改为
  # 按真实墨迹居中，条件满足：同一份级联 [18,17] 下，Medium 回落 116→2、
  # 18px 档 18→132 张，反超霞鹜文楷的 131。故一并采用。
  select:
    font: third_party/SourceHanSansSC-VF.ttf
    weight: Medium

  # ── event/op_*：序章题词。**叙事文本**，不是 UI 文本 ─────────────────
  #
  # 第一人称题词式独白，压在夜景背景上。与其余各面的取舍未必相同——它更接近正文轨，
  # 而非标签。暂随默认，等看过烤出来的效果再定。
  event:
    font: third_party/LXGWWenKai-Regular.ttf

  # ── cutin/：章节起止字幕卡（cut_e_* / cut_s_*）。透明底发光单行条 ────────
  #
  # 用户 2026-08-28 看过八路对照（build/font_ab/cutin.png）后裁定：**华文仿宋**。
  # 动因是霞鹜文楷「衬线的感觉不明显」——LXGW WenKai 本质是楷体风，笔画粗细对比小，
  # 在 15–21px 的发光字幕条上读不出印刷体的味道。
  #
  # ⚠ **这一面无法在别的机器上复现。** 华文仿宋是 Apple 随系统分发的商业字体，
  #   不是 OFL，不能像霞鹜文楷/思源黑体那样入库（裁决 G1 的例外）。产物只能在装了
  #   它的 mac 上重烤；换机器时 resolve() 会抛 FileNotFoundError 而不是悄悄换字。
  #
  # ⚠ **路径带哈希，是按需下载的字体资产，系统更新后可能变。** 重新定位：
  #     ls /System/Library/AssetsV2/com_apple_MobileAsset_Font7/*/AssetData/STFANGSO.ttf
  #
  # 缺字实测（对 cutin 24 张的真实译文逐字比对 .notdef）：0 缺。全部待烤文本
  # （cutin+sysgim+event 共 370 字）只缺 `・`，而它仅出现在 sysgim 的 sys_21_a
  # 「自动模式・文字设定」三行——**若日后把这套字用到 sysgim，那三行会出豆腐块**。
  #
  # 填充增益维持 2.2：仿宋与霞鹜文楷同属细笔画，不是裁决 Y6/Y14 说的粗体情形。
  #
  # ── 两个**主动偏离原图**的旋钮（2026-08-29 用户看过五档对照后裁定）──────
  #
  # `slant: 0.10` 轻微右倾。⚠ **原图并没有被切变**——实测残差（原图 vs 我们用
  #   同样文字的直立渲染，n=23）中位 +0.008、σ 0.063，即零。先前"原图右倾 19°"
  #   的结论是判据错了：那把尺子量的是字形内容（片假名的斜笔、明朝体的斜起笔、
  #   天生倾斜的「1」），拿别的面当对照控制不住内容这个变量。所以加斜是**风格
  #   选择**，不是复现。实测代价为零：0.10–0.25 全区间不掉字号、不糊笔画。
  #
  # `size_bias: 1` 比算出来的档位大一档。字号本按裁决 Y7 锚在原行墨迹高，但
  #   「与原图一样大」和「中文在这个档位好不好读」是两件事——中文笔画比假名密。
  #   实测 24 张全部抬档、宽度退回 0 条、纵向余量 5px→4px 未越界。
  #   注意有四张因此落在 **21px**，超出原级联上限 20——加成把整个可用区间一起
  #   平移是**刻意的**：上限 20 是"没有哪行原文比它高"得来的，加成正要越过它。
  cutin:
    font: /System/Library/AssetsV2/com_apple_MobileAsset_Font7/1821952872c81043711aab6910052b65da8edf2c.asset/AssetData/STFANGSO.ttf
    slant: 0.10
    size_bias: 1

  # ── sysgim：**2026-09-01 改判为思源黑体 Medium**（推翻下方 F11）──────────
  #
  # 改判依据是**游戏内实测**，不是静态 A/B 图：用户在 PPSSPP 里通玩主菜单与
  # option 画面后指出「UI 类整体文字都有点发虚」。量化证实了这个观感——
  # 逐盒统计「满不透明且近满亮度」的笔画实心像素占比（title_02..09 八张）：
  #
  #     原图日文  15–33%        霞鹜文楷中文  0–4.5%（title_07/08/09 是 0）
  #
  # 即整行小注全由半透明抗锯齿边构成，没有一个像素到满值，故发虚。根因是小注只
  # 约 7px 高，而霞鹜是楷体风、笔画细，抗锯齿一摊就到不了满值——F11 当时是看
  # 静态放大图裁的，那个尺度上看不出这件事。
  #
  # ⚠ **FILL_GAIN 已随之调回 1.0**（裁决 Y6/Y14 明令：换笔画更实的字体必须同时
  #   调回，否则字腔被糊死，而且它不会报错、只是变得不可读）。见
  #   tools/bake_sysgim_{glow,outline}.py 的 FILL_GAIN 默认值。
  sysgim:
    font: third_party/SourceHanSansSC-VF.ttf
    weight: Medium
    fill_gain: 1.0
    sheets:
      # ── title_02..13_a：主菜单项的极小字号小注，**回用霞鹜**（用户 2026-09-01 裁定）
      #
      # 这一族与同面其余张不同：注音墨迹只有 8–10px 高，而中文四字注（如「故事目录」
      # 合计约 30 笔）在这个高度上**换任何字体都是一团**——实测思源 Medium/Bold ×
      # 抬档 0/1 四种组合与霞鹜无可辨差异，缩短成两字也只是留白变多。这是像素预算
      # 问题，不是字重问题。故这一族按观感回到霞鹜，并带回它需要的 2.2 填充增益。
      #
      # 增益能按张给，是因为 2026-09-01 把它从模块级全局改成了 ui_font.fill_gain()
      # 按面/按张解析——否则「同一面里两套字」根本无法表达。
      # sys_2_a/3_a 也是小注（「面板标题下的小注」，数据注释原文），同归霞鹜。
      # 换成思源后 ref_right 对齐实测偏 11px（右缘落在 94、参照物在 105），
      # 退回霞鹜即复位——归类与观感两条理由指向同一处置。
      sys_2_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      sys_3_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_02_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_03_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_04_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_05_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_06_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_07_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_08_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_09_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_10_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_11_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_12_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}
      title_13_a: {font: third_party/LXGWWenKai-Regular.ttf, weight: null, fill_gain: 2.2}


  # ── 以下为已被推翻的 F11 原文，保留以存来龙去脉 ──────────────────────
  # sysgim：**已裁定霞鹜文楷**（2026-08-30，裁决 F11）
  #
  # 这一面与其余四面不同：字要么套描边、要么套距离场发光，字号 12–17px 跨度大，
  # 还有「英文大词 + 片假名小注」这类保留原英文的版式。
  #
  # 用户看过 A/B 对照（霞鹜 vs 思源 Regular/Medium，`build/sysgim_note_zh__shs-*`）
  # 后裁定「还是霞鹜最好」。**这一面按观感取字，不按密度贴合取字**——实测墨像素/字
  # 是 原文 181 / 霞鹜 81 / 思源 R 88 / 思源 M 99（E21′），思源 Medium 才最接近原图
  # 密度，用户在知道这组数字的前提下仍选霞鹜。与 F1 给 card 那几面选思源的取向相反，
  # 前提不同结论不同（同 M2 的形态）。
  #
  # ⚠ **`ZND_UI_FILL_GAIN` 必须维持 2.2**（裁决 Y6/Y14）：那个增益正是为补霞鹜的
  #   细笔而加的。若日后有人把这一面换成笔画更实的字体，**必须同时调回 1.0**，
  #   否则字腔被糊死——它不会报错，只是变得不可读。
  # sysgim:
  #   font: third_party/LXGWWenKai-Regular.ttf
  #   sheets: {}
  #     # 逐张覆盖写在这里，例如：
  #     #   sys_20_c: {font: third_party/SourceHanSansSC-VF.ttf, weight: Medium}
  #     #   sys_1_g:  {font: third_party/SourceHanSansSC-VF.ttf, weight: Bold}
  #     # 键＝不带扩展名的文件名（与 data/sysgim_*_text.jsonl 的 `file` 字段一致）。
