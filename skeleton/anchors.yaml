    - id: 15775
      jp: "【サクラ】「彩野さん、自分の想いから逃げないでね。彩野さんと『お話』つくるの、楽しかったよ」"
      zh: "【Sakura】「彩野同学，不要逃避自己的心意哦。能和彩野同学一起创作『故事』，真的很开心」"
      recall: "★汉字呼名装置（v7 补锚，与 s1s 8478 成对，二者必须同形）：全库 696 条 SAK 行里仅此 2 处用汉字「彩野さん」。
        本句是该装置的**决定性证据**——「和彩野さん一起做『お話』」指的是现实中共同创作 True Color 的佐仓雪乃×彩野，
        而非故事内角色Ayano；即Sakura在此越过故事层直接对现实层的彩野说话（紧接 15776 她如融雪般消失）。
        **两处的汉字形「彩野同学」必须保留**，不可归一为「Ayano同学」；句中两次「彩野さん」原文即重复，勿合并省略。
        『お話』依 v7 合并规则作「故事」；つくる 取「创作」以与游戏机制词「制作梗概」（あらすじを作成する）分开。
        中文里该装置由「片假名 Ayano／汉字 彩野」的字形反差承载，反差弱于日文——若排版轨有手段（字体/字号/着色）建议在这两处补强，勿在正文加字解释。"
