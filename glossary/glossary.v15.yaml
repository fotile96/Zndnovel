# 术语表 v15 —— 2026-08-13，P4 润色 pass SEG-4（seg4-s3tail-s5）段末用户复核裁定
#
# ★ 本版是**第一个由 P4 润色轨产生的 glossary 版本**（v1–v14 全部出自 P3 首译轨的段末裁决）。
#   触发点是用户对 SEG-4 那 164 条裁决的逐条复核：其中两处改动越出了「润色」的权限边界，
#   一处要新增术语定译、一处要给 style.md 的既有硬规则开具名例外，两者都必须走版本才算数。
#
# ★★ 召回范围：**零**。两条裁定各自只影响一行（14405 / 14409），而那两行正是本轮
#   一并回改的行——落库时点与裁定时点相同，不存在「已入线但未按新规改过」的存量。
#   故本版**不附召回令**（v11–v13 均附，是因为那几次的裁定影响到了段外已入线的行）。

version: 15
date: 2026-08-13
segment: seg4-s3tail-s5
track: P4-polish            # 与 v1–v14 的 P3-forward 相区别
lane: opus
active_json: "53 -> 54"
style_md: "v14 -> v15"
recall: none                # 见文件头 ★★

rulings:

  daut_to_chuiniu_puke:
    term: ダウト
    zh: 吹牛扑克
    old: 说谎游戏
    ids: [14405]
    why: >
      ダウト 是有固定中文名的纸牌游戏（英文 Cheat / I Doubt It），中文通行译名是
      「吹牛」「吹牛扑克」。原译「说谎游戏」是描述性意译，会与同句里的动词
      「说谎」撞车——现译整句读作「其中最热闹的是**说谎游戏**。毕竟大家都一脸
      若无其事地**说谎**」，同一个词既当专名又当动词，专名感因此消失。
      定为「吹牛扑克」后专名与动词分开，整句的因果也才立得住。
    scope: >
      全库仅 14405 一处（已 grep 确认），故本条的现实作用是**防止后续通道把它
      「改回」描述性译法**，而不是回改存量。登记进 active.json 后 W2 软规则会看着它。

  ordinal_fullwidth_exception:
    rule: style.md「标点形制（全角数字）逐字锁定」的具名例外
    ids: [14409]
    jp: 彩野さんが一番に上がり、続いて千秋ちゃんが２位で上がった。
    old: 彩野同学第一个打完，接着小千秋拿了第２名。
    new: 彩野同学第一个打完，接着小千秋拿了第二名。
    why: >
      style.md 第 17 行把「标点形制（全角数字／弯引号／省略号）」列为**逐字锁定**，
      故 jp 的 `２位` 此前照搬成 `第２名`。但本句同时含 `一番に`→「第一个」，
      于是一句之内出现「第一个……第２名」两种数字体例，**汉语侧自相矛盾**。
      用户裁定：同一句内已用汉字数词时，序数位的全角数字随之改用汉字数词。
    boundary: >
      ⚠ 只对**同句内已出现汉字数词的序数位**开例外。作品内器物上的英数（v13）、
      作品名的全角拉丁（v12/v14）、暗号数字串（6494「２２６２」）、
      日期与时刻（『９月的故事』『２５周年』）**一律不在本条内，维持全角**。
      本条不是「全角数字可以随便改成汉字」。
    tooling: >
      用户询问「是否需要修工装加例外」——**不需要**：`tools/check_batch.py` /
      `polish_check.py` 里**没有**任何强制数字字宽的规则（已 grep 确认），
      这条硬规则只存在于 style.md 的散文里。所以例外也只需写在 style.md，
      没有代码要改。

active_json_added:
  ダウト: 吹牛扑克

conventions:
  first_polish_track_version: >
    P4 润色轨此前的段末裁决全部落在 `pilot/polish/<seg>/decisions.jsonl` 与
    `frozen/rulings.md`，作用域止于该 SEG。本版确立：**当润色轨的裁定需要改动
    `active.json` 或 `style.md`（即越出单段、成为全库口径）时，同样走 glossary
    版本号**，不在 rulings.md 里私设术语。rulings.md 管「本段怎么裁的」，
    glossary 管「全库以后照什么办」。
