    - id: 16465
      jp: "【由加里】「直哉くん、この『物語』はどこに続いていくの？」"
      zh: "【由加里】「直哉君，这个『故事』接下来会通向哪里呢？」"
      recall: "定译源 voices/yukari.md 例句6；「故事的去向」之问由 e1f 3911（千秋同学的故事）与 e2f 尾声承接。"
    - id: 17034
      jp: "【直哉】「僕はこれからユウイチになる」"
      zh: "【直哉】「接下来，我要成为Yuichi」"
      recall: "定译源 voices/naoya.md 例句5；重演宣言；s8f 16594「读故事的人／写故事的人都能成为Yuichi」＝其理论化收束。"
- chapter: s8s
  items:
