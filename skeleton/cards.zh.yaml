# skeleton/cards.zh.yaml — 中文卡组总表（196 条：卡 1–195 + 编外 200；卡 0 无带字卡面故无条目）
# 由 batch_00..04 合并生成；术语依 glossary.v4.yaml（v19 罗马音化修订已落）；断行/结尾标记/选项格式约定见各批文件头。
# 本文件是卡面图片汉化的文案源，也是 B/C 档上下文压缩的章梗概来源。
- card: 1
  variant: a
  title_zh: 有个孩子来学校的故事
  body_zh: '走进教室时，看到课桌上的

    涂鸦，彩野同学想起自己以

    前写过「有个孩子来学校的

    故事」。'
  tr_note: 标题「物語」与正文引用「お話」自 v4 起同译「故事」；彩野さん→彩野同学（现实层称呼，依 style.md）。
- card: 2
  variant: a
  title_zh: 夏日清晨，通往高中的上学路
  body_zh: '早晨，男学生(Yuichi

    )和女学生(Ayano)并肩

    走在上学的路上。一如

    往常的光景，一如往常

    的日常。女学生忘了考试

    的事，慌忙赶往教室。'
  tr_note: (ユウイチ)(アヤノ) 的半角圆括号依原卡保留；ユウイチ 依 glossary v2 裁决保留片假名（两层同名）。
- card: 3
  variant: a
  title_zh: 放学后的约定
  body_zh: '想起了小测验输了就要请吃

    汉堡的约定。'
  tr_note: ''
- card: 4
  variant: a
  title_zh: 选择：放学后的约定
  body_zh: '「想不起来」

    「约好了」

    「没有约」

    有以上分支展开。'
  tr_note: 选项与卡 5/6/7 标题对应（卡 6 标题同原卡补出「约定」）。
- card: 5
  variant: a
  title_zh: 约好了
  body_zh: '看到橡皮，Ayano想起自己

    约好放学后和那孩子见面。'
  tr_note: 「あの子」未点名，统一译「那孩子」。
- card: 6
  variant: a
  title_zh: 想不起约定
  body_zh: 'Ayano总觉得，自己放学

    后好像约了谁见面。'
  tr_note: ''
- card: 7
  variant: a
  title_zh: 没有约
  body_zh: 'Ayano放学后并没有

    约任何人见面。'
  tr_note: ''
- card: 8
  variant: a
  title_zh: 想起约定
  body_zh: '聊起传闻，Ayano想起

    自己约好放学后要

    和「那孩子」见面。'
  tr_note: ''
- card: 9
  variant: a
  title_zh: 早晨的教室
  body_zh: '早晨的教室，一如往常的

    光景。Yuichi跑来捣乱，

    Ayano没能如愿预习。'
  tr_note: ''
- card: 10
  variant: a
  title_zh: 章节 1：Ayano
  body_zh: '章节 1 的主人公是

    「Ayano」'
  tr_note: 「セクション１：アヤノ」→「章节 1：アヤノ」依 glossary v2 行文示例（「章节」＋半角数字＋全角冒号）；正文依原卡「アヤノ」后不加句号。
- card: 11
  variant: a
  title_zh: 午休的教室
  body_zh: 'Ayano邀Yuichi一起请

    钱仙，Yuichi拒绝。

    Yuichi还向Ayano

    炫耀了考试的高分。'
  tr_note: ''
- card: 12
  variant: a
  title_zh: 选择：Yuichi的答卷
  body_zh: '「表示羡慕」

    「岔开话题」

    有以上分支展开。'
  tr_note: 「答案」→「答卷」（避开中文「答案」的歧义）；选项与卡 13/14 标题呼应。
- card: 13
  variant: a
  title_zh: 对答卷表示羡慕
  body_zh: 'Yuichi说自己赢了赌

    约，要Ayano请吃快餐。

    Ayano不情不愿地点头。'
  tr_note: ''
- card: 14
  variant: a
  title_zh: 岔开答卷的话题
  body_zh: '打赌输给Yuichi的Ayano，

    随口应付过得意洋洋

    的他，逃了出去。'
  tr_note: ''
- card: 15
  variant: a
  title_zh: 开始上课
  body_zh: 'Yukari老师的课。老师似乎

    也相当适应教师这一行了。'
  tr_note: ''
- card: 16
  variant: a
  title_zh: 放学后
  body_zh: '今天一天的课全部结束。一

    种难以言喻的安心感。'
  tr_note: ''
- card: 17
  variant: a
  title_zh: Yuichi与快餐
  body_zh: '输掉了和Yuichi的赌约，

    不情不愿地去了快餐店。

    Yuichi对钱仙坚决反对。'
  tr_note: ''
- card: 18
  variant: a
  title_zh: 选择：回学校
  body_zh: '「回学校」

    「回家」

    有以上分支展开。'
  tr_note: ''
- card: 19
  variant: a
  title_zh: 一如往常的生活
  body_zh: '结果Ayano还是回了

    家。平静无事的日常、

    一如往常的生活又

    回来了　　　（完）'
  tr_note: （おわり）→（完）；依原卡「回来了」后不加句号，末行垫全角空格使标记贴行末（12 字宽）。
- card: 20
  variant: a
  title_zh: 探索：放学后的学校
  body_zh: '放学后，Ayano在学校里转

    了一圈。天台和通往天台

    的楼梯，让她有点在意。'
  tr_note: ''
- card: 21
  variant: a
  title_zh: 放学后的钱仙
  body_zh: '放学后，Ayano决定和

    那孩子一起请钱仙。那

    孩子的准备十分周到。'
  tr_note: ''
- card: 22
  variant: a
  title_zh: 与她的相遇
  body_zh: '和那孩子相遇，是在天台

    上。她好像不太擅长应付人

    多的场合。'
  tr_note: ''
- card: 23
  variant: a
  title_zh: 不好的结果
  body_zh: 'Ayano向钱仙提问，结果

    却……不怎么好。之后

    发生了不可思议的事情，

    Ayano的视野渐渐模糊。'
  tr_note: 原卡「……」跨行拆分为日文版式，中文重排后不再拆分。
- card: 24
  variant: a
  title_zh: 回过神来的地方
  body_zh: '回过神来，Ayano已经身

    在天台。自己为何会在

    天台，原因并不清楚。'
  tr_note: ''
- card: 25
  variant: a
  title_zh: 选择：声音的主人
  body_zh: '「……」

    「Sakura同学」

    有以上分支展开。'
  tr_note: 「サクラさん」依称呼表译「サクラ同学」。
- card: 26
  variant: a
  title_zh: 谁也没有来
  body_zh: 要把故事……。
  tr_note: 原文「物語を……。」动词残缺（EX2 开场意识消散的笔触）。用户裁决定稿「要把故事……。」；v4 起 物語→故事 即词表常规映射，本卡不再是特例。
- card: 27
  variant: a
  title_zh: 她的名字
  body_zh: '天台。「那孩子」

    说，自己等Ayano来到

    这里，已经等了５年。'
  tr_note: 「５年」的「５」依原卡保留全角。
- card: 28
  variant: a
  title_zh: 约定不守可不行
  body_zh: '说着「约定不守可不行」，

    Sakura步步进逼，把Ayano

    从天台上推了下去。（完）'
  tr_note: 标题与正文引语统一作「约定不守可不行」；（おわり）→（完），末行恰排满 12 字宽、无垫空格。
- card: 29
  variant: a
  title_zh: Yuichi救下Ayano
  body_zh: '回过神来，Ayano已经

    快要从天台上坠落。

    Yuichi将Ayano拉了上来。'
  tr_note: ''
- card: 30
  variant: a
  title_zh: 有谁在呼唤
  body_zh: 'Sakura消失了。其存在

    暧昧不明。被Yukari

    老师训了一顿，两

    人回了家。（完结）'
  tr_note: （完結）→（完结），与（おわり）→（完）两制区分保留；前导全角空格按中文 12 字行宽重算（本卡末行恰排满，无垫空格）。
- card: 31
  variant: a
  title_zh: 又是一如往常的生活
  body_zh: 'Ayano回了家。平静无

    事的日常、一如往常

    的生活又回来了。

    　　　　　　（完）'
  tr_note: 与卡 19 同句呼应；原卡此处「戻ってきた。」带句号而卡 19 无，差异照搬；（おわり）→（完）贴行末。
- card: 32
  variant: a
  title_zh: 夏天的计划
  body_zh: 'Yuichi说自己拿到了

    零花钱，邀Ayano找

    个地方一起出去玩。'
  tr_note: ''
- card: 33
  variant: a
  title_zh: 选择：周末的计划
  body_zh: '「去」

    「不去」

    「含糊其辞」

    有以上分支展开。'
  tr_note: 「適当に言葉を濁す」→「含糊其辞」，与卡 38 的「適当に濁す」同译。
- card: 34
  variant: a
  title_zh: 课间休息
  body_zh: '和Yuichi去哪里玩

    好，想来想去……结果

    还是定不下来。遇见

    Sakura，同去图书室。

    她似乎对咒语颇有研究。'
  tr_note: ''
- card: 35
  variant: a
  title_zh: 选择：对咒语的兴趣
  body_zh: '「没什么特别的」

    「考试拿１００分」

    「唱歌变好听」

    「两情相悦的咒语」

    有以上分支展开。'
  tr_note: 第 4 项原卡折两行（次行全角缩进）系日文版式，中文一行排得下故不折行；「１００」依原卡保留全角。
- card: 36
  variant: a
  title_zh: 章节 2：Ayano
  body_zh: '章节 2 的主人公是

    「Ayano」'
  tr_note: 同卡 10：セクション→章节（glossary v2）。
- card: 37
  variant: a
  title_zh: 与Yuichi的关系
  body_zh: '回答两情相悦的咒语

