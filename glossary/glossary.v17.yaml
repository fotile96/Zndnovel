rulings:

  wakaranai_third_reading:
    term: わからない / わからなかった
    supersedes: "v13 `わからない` 条的**两极**划分（不理解 / 不知所措）——不是推翻，是补第三读"
    readings:
      不明白: "**不理解**位——摆在眼前但想不通、理解不了（v13 默认读，全库压倒性多数）"
      不知道: "**不知所措**位（v13 具名判例 4618）**＋本版新增：对事实的不知情**位"
    new_reading: >
      **「对事实的不知情」——说话人缺的是信息不是理解力。** 典型构式是
      `〜のかどうか、わからない` / `何が起きたのか。わからない` / `〜のか、それとも〜のか、わからない`
      ——句子本身就摆明了「有若干种可能，我不掌握是哪一种」。这类位置汉语只能作
      **「不知道」**；作「不明白」会读成「东西就在眼前我却理解不了」，方向是反的。
    ids_applied: [5588, 5604]
    ids_already_correct: [5492, 5917, 5920]
    why_it_surfaced_now: >
      v13 立条款时的语料重心在 s0–s5（回忆体、少年少女的「想不通」），
      **e2 是全书唯一以「调查/供述」为体裁的章**——多年后的千秋逐个查访当年真相，
      被问者反复说的正是「我不掌握这个信息」。**一个新体裁把旧条款的缺口顶出来了**，
      这不是 v13 判错，是它的语料里没有这一类。
    boundary: >
      ⚠ **不要把「不知道」外推成默认读。** 全库 `わからない` 系约 168 行，
      「不明白」仍是最大的一类。判据是**缺的是信息还是理解力**：
      - 5928「なんでそんなことをしてまで隠そうとしたのかもわからなかった」→ 维持
        **「不明白」**（她在场、知道发生了什么，想不通的是动机）；
      - 4829「よくわからなかったりするんです」→ 维持「不太明白」（サクラ 说不清自己的感受）。
      **同一个 `のか…わからない` 构式两边都有，必须逐句看缺的是哪一样。**

recall_pending:
  id: 5540
  status: **未执行，留给用户裁**
  why_pending: >
    5540 是**硬锁**，因为它自身就是一条 `reason=review glossary_v=13` 的**人裁 patch**
    ——即它是「在 v13 的两极条款下由人明确判过一次」的行。本版补的第三读会改变它的答案，
    但**推翻一条具体的人裁决定不该由控制会话自己做**（v15 立的约定：越出润色权限的
    裁定走版本号；而这一条越出的是「谁有权改人裁结果」）。
  jp: 【≦＊＊＊≧】「僕の事を気遣っていてくれていたのか、それとも、海馬がそれを記憶の彼方に捨て去ってしまったのか、わからない。彼女に訊くつもりもない」
  current: 【≦＊＊＊≧】「是在替我着想，还是海马体把它丢到了记忆的彼方，我不明白。我也不打算问她」
  proposed: 【≦＊＊＊≧】「是在替我着想，还是海马体把它丢到了记忆的彼方，我不知道。我也不打算问她」
  argument_for: >
    构式是 `〜のか、それとも〜のか、わからない`——本版新增读的教科书形态：他缺的是
    「哪一种才是真的」这个信息。而且 **5540 与 5588/5604 是同一个 ≦＊＊＊≧ 的同一段独白**，
    本轮把后两条改成「不知道」之后，段内出现了「不明白 / 不知道 / 不知道」的不齐。
  argument_against: >
    「不明白」在这一句里也读得通（他也可以是「理解不了她为什么不说」）；
    且这是一条明确的人裁，改它的门槛应当高于普通润色。

