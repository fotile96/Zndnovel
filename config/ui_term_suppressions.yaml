# `tools/check_ui_terms.py` 的**个案**抑制表。
#
# 抑制的粒度是 (jp 原文, 术语)，不是术语本身——`担任の教師→班主任` 是正确的，
# 但这不该让 `教師→教师` 这条术语整体失效。理由必填；缺 why 直接报错。
#
# 加一条之前先问：这真是「这一处该例外」，还是「这条术语根本不该收」？
# 后者请改去 `ui_terms.yaml` 的 `not_terms`，别在这里一条条堆。

suppress:
  - jp: 担任の教師
    term: 教師
    zh: 班主任
    why: >
      「担任の教師」在汉语里就是「班主任」，硬塞「教师」二字反而不像话。
      这是词组整体对译，不是把术语译丢了。
  - jp: 教師を続ける理由
    term: 教師
    zh: 继续当老师的理由
    why: >
      散文式短语，口语里说「当老师」而非「当教师」；正文 180 行里也有 20 行
      在这类语境下用「老师」。术语本身仍应保持 教師→教师（94.4%）。
