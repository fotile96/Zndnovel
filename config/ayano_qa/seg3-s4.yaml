#   那 1 题（q12）经核**不是译文丢信息**——「翻过围栏」「握住手」「迈出脚」三处在译文里
#   全都在场且清楚（2422/2436/2465 行）。是**标准答案宽于题面**：题面限定「喊话之后」，
