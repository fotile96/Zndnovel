# 全书正典路线（人工资产）——route_plan DSL，gen_timeline.main() 按序执行
#
# 目标：把「从新游戏开局玩到通关，沿途出现过的每一条文本」排成一条线性体验序，
#       且每条 vms 恰好出现一次（check_timeline A 段断言）。
#
# 移动指令
#   story:          {enter, choices, until}  首讲：沿状态图行进，逐场景 emit
#   replay:         {at, pick, until}        重讲：发回溯标记，已讲过的状态折叠（不重复发文本）
#   fragment_sweep: {only}                   做卡：按路线前缀序把「可做」的场景卡逐张做成
#   script:         {file}                   整脚本：无状态脚本（教程 crd_0、各类 stub 卡面）
#   pool:           {func}                   文本池：随机/复用演出（Time over、探索到场）
#
# 编写规约（照着这几条改，才不会把覆盖率改塌）
#   1. 每章「首讲」用 story，其后一律 replay —— story 不去重，replay 才折叠已讲状态。
#   2. replay 的 pick 只对 at 那个状态生效；要在更深的选择点选支，就再发一条 replay，
#      并用 until 卡住边界，免得默认支把指针带进别的章（如 s1s_260_sel 默认支直接 RUN s5）。
#   3. route 是累积的（不随重讲截断），因此 _makeable 的「路线前缀全部已做卡」规则要求：
#      **同一个选择点的兄弟分支要先讲完、做完卡，再往前推进**（req 链常跨兄弟分支，
#      例：卡6「約束を思い出せない」的 req 是卡7「約束をしていない」）。
#   4. 每个分支簇之后 sweep 一次；有 req 跨簇的场合连发两条 sweep（一遍做不完）。
#   5. route_has（本轮讲过）只增不减：需要「没讲过 X」那条支的场景，必须排在讲 X 之前
#      （如 s1s_150 的探索支、s2s_390 的三段分歧、s2s_550 的プール/プラネタリウム）。
#   6. 自动入手的卡（关键词卡、章梗概卡、crd_177 一次性解锁的日记卡）不进 sweep，
#      用 script 覆盖其 stub 卡面文本。
#
# 章序：序→s1→s2→s3 主体→s4→回补 s3 终局(需卡138)→s3fc 强制段→s5→s6→s7f→s8
#       →回补 s4s_100_sel(需卡142)→EX1→EX2→收尾 sweep
