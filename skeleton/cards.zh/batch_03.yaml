# skeleton/cards.zh/batch_03.yaml — 中文卡组 batch 03（card 120–159）
# 来源：skeleton/cards.jp.yaml 同号条目中译（规程 B）；术语/人名依 glossary/glossary.v4.yaml 与 glossary/style.md（v4 召回修订已落于本批）
#   （v2 硬约束：故事层人名保留片假名、ユウイチ 保留片假名、セクション→章节、手帳→笔记、オマジナイ→咒语）。
# 本批构成：
#   - 120–132 关键词卡（右栏「キーワード」）：正文用简短名词解说腔。
#   - 133–144 章节梗概卡：title 统一「章节 N 梗概」；143/144 原题无「あらすじ」，作「章节 EX1」「章节 EX2」；
#     正文为整章梗概，事实口径对照 CLAUDE.md「章节结构与剧情 DAG」「剧情核心」两节核准。
#   - 145 绘本标题卡：正文为童谣三行，行内半角空格再现原卡分かち書き节奏。
#   - 146–159 章节 4／EX2 的场景卡・选择卡。
# 约定沿 batch_00：body_zh 每行 ≤12 全角宽、行间以 \n 相接（中文重排不跟随日文断行点）；title_zh ≤14 全角宽；
#   （おわり）→（完）贴行末（末行不足 12 字宽时垫全角空格）；选择卡选项行独立成行并保留「」，
#   末行「の展開があり。」→「有以上分支展开。」；未点名者保持未点名（女子生徒→女学生）。
# v19 修订（2026-08-19）：故事层人名罗马音化（Ayano/Yuichi/Yukari/Sakura…）+ 天文馆→天象馆已落于 title_zh/body_zh；tr_note 保持历史原文。涉名流式 body 经 tools/zh_wrap（jieba）重排（宽 12 全角），结构卡逐行替换保结构。

