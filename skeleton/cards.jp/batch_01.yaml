# skeleton/cards.jp/batch_01.yaml — 卡面日文转写 batch 01（card 20–39）
# 来源：png/card/crd_<N>_a.png 逐字转写（规程 A）。
# 字段：card(int) / variant("a"|"d") / title_jp / section_label / body_jp / note
# 约定：
#   - 卡面上的换行处以 \n 记录（双引号标量，\n 为换行转义）。
#   - section_label 为右栏全部文字；右栏上下两个标签槽位之间以 \n 相连
#     （如 "セクション1\nあらすじ"）。
#   - 右栏标签「セクション1」「セクション2」的「1」「2」在卡面上为半角字形；
#     卡 36 标题/正文中的「２」「：」为全角（与 snr_common.lua plotTitle[36] 一致）。
#   - 特例：卡 26 右栏上槽位为「セクションEX2」，在卡面上折行为
#     「セクション」「EX2」两行（见该条 note）。
#   - 卡 30/31 正文行内的空位按字位网格测得，记为全角空格「　」（见各条 note）。
- card: 20
  variant: "a"
  title_jp: "探索：放課後の学校"
  section_label: "セクション1\n探索"
  body_jp: "放課後アヤノはぐるっと学\n校を回る。屋上とそこに続\nく階段が少し気になった。"
  note: "右栏第二槽位为「探索」（本批仅此卡）。"
- card: 21
  variant: "a"
  title_jp: "放課後のコックリさん"
  section_label: "セクション1\nあらすじ"
  body_jp: "放課後、アヤノはあの子と\nコックリさんを行う事にし\nた。あの子の準備は念入り\nだ。"
  note: ""
- card: 22
  variant: "a"
  title_jp: "彼女との出会い"
  section_label: "セクション1\nあらすじ"
  body_jp: "あの子とは、屋上で出会っ\nた。人混みが苦手、という\n事みたいだ。"
  note: ""
- card: 23
  variant: "a"
  title_jp: "良くない結果"
  section_label: "セクション1\nあらすじ"
  body_jp: "アヤノはコックリさんに質\n問をするが、その結果は…\n…あまり良いものではなか\nった。その後不思議な出来\n事が起き、アヤノの視界が\nかすんでいく。"
  note: "六点省略号「……」跨行拆分：第 2 行末为「…」、第 3 行首为「…」（原版式如此）。"
- card: 24
  variant: "a"
  title_jp: "気がつくといる場所"
  section_label: "セクション1\nあらすじ"
  body_jp: "気がつくとアヤノは屋上に\nいた。どうして屋上に自分\nがいるのか、原因がはっき\nりしない。"
  note: ""
- card: 25
  variant: "a"
  title_jp: "選択：声の主"
  section_label: "セクション1\nあらすじ"
  body_jp: "「……」\n「サクラさん」\nの展開があり。"
  note: "与其他「選択：」卡不同，右栏第二槽位为「あらすじ」而非「選択肢」（卡面如此，经放大核对）。第 1 行「……」为六点省略号（两个…）。"
- card: 26
  variant: "a"
  title_jp: "誰も来ない"
  section_label: "セクション\nEX2\nあらすじ"
  body_jp: "物語を……。"
  note: "右栏上槽位文字为「セクションEX2」，因宽度在卡面上折行为「セクション」「EX2」两行（EX2 为半角字形），section_label 的前两个 \\n 段均属上槽位；末段「あらすじ」为下槽位。正文仅一行「物語を……。」（六点省略号），卡面即如此。"
- card: 27
  variant: "a"
  title_jp: "彼女の名前"
  section_label: "セクション1\nあらすじ"
  body_jp: "屋上。「あの子」は、アヤ\nノが来るのを５年間待って\nいたという。"
  note: "正文「５年間」的「５」为全角字形（按字位网格测得占全角字位）；右栏「セクション1」的「1」为半角。"
- card: 28
  variant: "a"
  title_jp: "約束はまもらないと"
  section_label: "セクション1\nあらすじ"
  body_jp: "「約束はまもらないと」と\nいうと、サクラはアヤノを\n追い詰め、屋上から突き落\nとしてしまう。（おわり）"
  note: "「（おわり）」为全角括号，其后无句号，正文即止于此。"
- card: 29
  variant: "a"
  title_jp: "ユウイチはアヤノを助ける"
  section_label: "セクション1\nあらすじ"
  body_jp: "気がつくとアヤノは屋上か\nら落ちかけていた。ユウイ\nチはアヤノを引っ張りあげ\nた。"
  note: ""
- card: 30
  variant: "a"
  title_jp: "誰かが呼んでた"
  section_label: "セクション1\nあらすじ"
  body_jp: "サクラは消えた。その存在\nはあやふやだ。ユカリ先生\nに怒られた後、二人は家に\n帰った。　　　　（完結）"
  note: "第 4 行「帰った。」与「（完結）」之间有 4 个全角字位的空白（按字位网格测得），记为 4 个全角空格；卡面无法区分其为全角/半角空格的何种组合。「（完結）」为全角括号，其后无句号。"
- card: 31
  variant: "a"
  title_jp: "また、いつもの生活"
  section_label: "セクション2\nあらすじ"
  body_jp: "アヤノは家に帰る。何事も\nない日常、いつもの生活が\n戻ってきた。　（おわり）"
  note: "第 3 行「戻ってきた。」与「（おわり）」之间有 1 个全角字位的空白（按字位网格测得），记为 1 个全角空格。「（おわり）」为全角括号，其后无句号。自本卡起右栏上槽位为「セクション2」（「2」为半角）。"
- card: 32
  variant: "a"
  title_jp: "夏の予定"
  section_label: "セクション2\nあらすじ"
  body_jp: "お小遣いが入ったからと、\nユウイチはアヤノとどこか\nに遊びに行くことを誘う。"
  note: ""
- card: 33
  variant: "a"
  title_jp: "選択：週末の予定"
  section_label: "セクション2\n選択肢"
  body_jp: "「行く」\n「行かない」\n「適当に言葉を濁す」\nの展開があり。"
  note: ""
- card: 34
  variant: "a"
  title_jp: "休み時間"
  section_label: "セクション2\nあらすじ"
  body_jp: "ユウイチとどこに行こうか\n迷うが……結局決められな\nい。サクラと会い、図書室\nへ。オマジナイに詳しいら\nしい。"
  note: ""
- card: 35
  variant: "a"
  title_jp: "選択：オマジナイへの興味"
  section_label: "セクション2\n選択肢"
  body_jp: "「特にないなあ」\n「テストで１００点とる」\n「歌が上手くなる」\n「両思いになる\n　オマジナイ」\nの展開があり。"
  note: "「１００」为全角数字（按字位网格测得）。第 4 项选择肢「両思いになるオマジナイ」在卡面上折行为两行，第 5 行行首有 1 个全角字位的缩进，记为全角空格「　」。"
- card: 36
  variant: "a"
  title_jp: "セクション２：アヤノ"
  section_label: "セクション2\nあらすじ"
  body_jp: "セクション２の主人公は\n「アヤノ」"
  note: "标题与正文中的「２」「：」为全角；右栏标签「セクション2」的「2」为半角。正文「アヤノ」后无句号。"
- card: 37
  variant: "a"
  title_jp: "ユウイチとの仲"
  section_label: "セクション2\nあらすじ"
  body_jp: "両思いになるオマジナイ、\nと答えると、サクラは二人\nの仲が進展していなかった\nことに驚く。"
  note: ""
- card: 38
  variant: "a"
  title_jp: "選択：ユウイチへの想い"
  section_label: "セクション2\n選択肢"
  body_jp: "「好きと言い切る」\n「適当に濁す」\nの展開があり。"
  note: ""
- card: 39
  variant: "a"
  title_jp: "ユウイチのことが好き"
  section_label: "セクション2\nあらすじ"
  body_jp: "アヤノはユウイチの事が好\nき、とサクラに答える。サ\nクラは安心したような笑顔\nを返す。"
  note: ""
