# skeleton/cards.jp/batch_06.yaml — 卡面日文转写 batch 06（card 120–139）
# 来源：png/card/crd_<N>_a.png 逐字转写（规程 A）。
# 字段：card(int) / variant("a"|"d") / title_jp / section_label / body_jp / note
# 约定：
#   - 卡面上的换行处以 \n 记录（双引号标量，\n 为换行转义）。
#   - section_label 为右栏全部文字；右栏上下两个标签槽位之间以 \n 相连。
#     本批 20 张卡右栏均只有上方一个槽位：卡 120–132 为「キーワード」，
#     卡 133–139 为「物語あらすじ」，故 section_label 均为单行、无 \n。
#   - 卡 133–139 标题中的「Ｓｅｃｔｉｏｎ」、数字「１」–「５」及「Ａ」「Ｂ」
#     均为全角（与 snr_common.lua plotTitle[133]–[139] 逐字一致）。
#   - 省略号按卡面点数如实记录：「…」＝3 点（一个三点リーダ），「……」＝6 点，
#     点数均经放大/像素比对核实。
