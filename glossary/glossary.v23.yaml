revision_v23_chan_suffix:
  rule: >
    人名＋ちゃん 的称呼位一律作「<名>酱」，**「小～」形全面废止**。分流沿用 v19 C2
    的三分：角色对白（呼唤／直称／第三人称提及）与第一人称心理→「～酱」；
    中立叙述骨架→光名；五年后段（id ≥ 16549）一律光名。
  why: >
    v19 C2 的裁决面只到「千秋ちゃん」，`linked` 明写「チアキちゃん（故事层）→小Chiaki 归 C1」，
    style.md 默认表也保留「～ちゃん→小～（サクラちゃん→小サクラ酌情）」。支撑这条分层的理由是
    「小～ 留给故事层、酱 留给现实层千秋」（p5-polish-pattern-report §四 C1），
    但**事实不成立**：全部 11 行「小Sakura」都在现实层 `_f` 脚本里（护士 6 行 e2f、
    彩野母 5 行 s1f），故事层一行都没有。读者看不见日文，只会看到同一个 ちゃん
    在一个女孩身上作「小Sakura」、在另一个身上作「千秋酱」。
  drift_that_exposed_it: >
    4691（ユウイチ口中 チアキちゃん）在 2026-08-27 的 p5seg6 裁决里被手工 edit 成
    「Chiaki酱」（decisions.jsonl:116，reason_code/note 皆空），与同章同词的 4728
    「小Chiaki」破对——本版即以该手裁为准，把全族拉齐。
