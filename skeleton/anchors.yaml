    - id: 16705
      jp: "ノートの表紙には『Ｔｒｕｅ Ｃｏｌｏｒ』と書かれている。_n僕は胸ポケットからボールペンを取り出すと、題名の最後に「，」を書き加えた。"
      zh: "笔记本的封面上写着『Ｔｒｕｅ Ｃｏｌｏｒ』。_n我从胸前的口袋取出圆珠笔，在标题末尾添上了一个「，」。"
      recall: "逗号加笔句；e2f 5653 同文无 _n（zh 相应去 _n 沿用）；「ノート→笔记本」三分法。"
    - id: 16706
      jp: "『Ｔｒｕｅ Ｃｏｌｏｒ，』"
      zh: "『Ｔｒｕｅ Ｃｏｌｏｒ，』"
      recall: "第二物语的物证（全角逗号原样）；e2f 5654 同串沿用；标题三重题意的枢纽。"
    - id: 16719
      jp: "【千秋】「『放課後の約束』が何だったのか『思い出せない』のを『思い出す』ぐらいでも？」"
      zh: "【千秋】「哪怕只是去『想起』——『放学后的约定』到底是什么、这件『想不起来』的事，也可以吗？」"
      recall: "定译源 voices/chiaki.md 例句5；『放学后的约定』与卡 3 标题、s1s 约定线同词（跨层双关，不点破）。"
    - id: 16728
      jp: "【千秋】「あの時、『複雑な事は大人になったら』って言ったこと、覚えていますか？」"
      zh: "【千秋】「那个时候，你说过『复杂的事，等长大以后再……』这句话，还记得吗？」"
      recall: "12930 的截引回收；引文按原句截断处收在「再……」。"
    - id: 16740
      jp: "【千秋】「だから。私が学校を卒業したら『複雑な事』、もういちど、一緒に考えてみませんか？」"
      zh: "【千秋】「所以。等我从学校毕业以后，那些『复杂的事』，能不能再一次，和我一起想想看呢？」"
      recall: "定译源 voices/chiaki.md 例句6；『复杂的事』与 12930/16728 同词。"
    - id: 16749
      jp: "【女子生徒】「少しだけ。『ノート』に、いま、少しだけ。物語を書き足すこと、できますか」"
      zh: "【女学生】「一点点就好。能不能现在、就在这本『笔记本』上，把故事写下去一点点呢」"
      recall: "定译源 voices/chiaki.md §6（后半句）；全篇最终句组：续写＝第二物语的开笔；「ノート→笔记本」「物語→故事」。"
