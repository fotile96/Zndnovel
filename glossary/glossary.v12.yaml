conventions:
  w2-stock-audit-needs-line-level-review:
    since: v12
    title: 存量审计的 W2 式扫描结果，同样必须逐行看过原文
    body: >
      v11 已立「饱和度数字本身不是证据」（saturation-is-not-evidence-by-itself），管的是**登记前**。
      v12 补对称的一半：**存量审计的扫描结果，同样必须逐行看过原文再下结论。**
      本段实地兑现：交接件把「手帳 有 10 行作『手册』」登记成一组现成的清账目标，
      逐行核对后 **9 行的 jp 是复合词 `生徒手帳`**（另一样东西，译得对），真正的偏离只有 1 行。
      **键太宽（`手帳`⊂`生徒手帳`）在存量扫描上产生的是「虚构的待办」**，
      而不是登记时那种「未来的误报」——两个方向都要防。
      操作要求：任何「某词有 N 行偏离定译」的结论，落进台账或裁决输入之前先把那 N 行的 jp 打出来看一遍。

  register-the-most-concentrated-family-early:
    since: v12
    title: 最集中的一族入线之前定名，别等过闸
    body: >
      0.8 饱和度闸门是**默认**，不是硬条件。当一个词的未覆盖占位**高度集中在一族**
      （母题三连、结构孪生组、同一装置的两端），应当**在那一族入线之前**定名——
      等它们入线，形就已经固化，再统一就要回改一整族。
      先例：v11 的 `やりとり`（0.600 提前裁，未入线 6 处全在实体侧）；
      v12 的 `エンドロール`（0.167 提前裁，未入线 4 处里 3 处是 e1s 母题三连）
      与 `よろしく` 的 16687 预定（0 回改，纯前瞻，但它是 15353 那句遗言的另一端）。
      判据：看饱和度表的「未覆盖分布」列——**分布越集中，越该提前裁**；分散才适合滚存。

  writing-variant-vs-twin-family-variance:
    since: v12
    title: 「同一个词的两种写法」与「孪生族内的异形」是两回事
    body: >
      见 rulings/section-writing-variant。v11 的 UI／叙事判别线只管后者。
      前者（同一概念的假名／全角拉丁／汉字变体）一律统一到 active.json 的定译，与载体无关。
      **先问「原文这两种写法是不是同一个词」，再决定用哪条规则。**
      混淆的代价已实测：16469 按 v11 判别线读会得出「维持不修复」，与用户裁决相反，
      而两条规则本来并不冲突——只是 v11 没有把适用面写清楚。

  dossier-tool-blind-to-table-proposals:
    since: v12
    title: 卷宗工具的表格体盲区（连续三段复发，裁决会话须按人工提取办）
    body: >
      `tools/cluster_notes.py` 只认 `### N. 词 → 译` 标题体与容器标题之下的有序列表
      （`PROP_RE` / `LIST_ITEM_RE`）。**Markdown 表格行两条正则都不匹配**，整段静默丢失。
      seg3-s4 移交开发轨、seg4 复发、**seg5 再复发**：本段 52 条真提案在卷宗里一条都没收进去，
      输出与 SEG-4 那次逐字相同（735 提案 / 195 词族）。
      **在修好之前，裁决会话的第 1 步一律改为逐文件人工提取**
      （`git diff <上段 tag>..<本段 tag> -- pilot/lanes/<lane>/data/notes/`）。
      建议的最小修法不是改工具，而是在 `prompts/translator_cc.md` 里**明文规定 notes 的提案写法**。
