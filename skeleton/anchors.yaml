        **必须保持汉字形「彩野同学」，绝不可归一为「Ayano同学」。**
        本场（scene_s1s_300）尤其危险：Sakura 本场共 5 句，仅开口这句用汉字，其后 8501/8506/8508 三句全部回到片假名，
