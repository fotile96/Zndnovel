    - id: 6162
      jp: "【彩野】「ありがとう。もう何度も聞いたかもしれないけれど。私、本当にうれしく思ってるよ」"
      zh: "【彩野】「谢谢你。虽然可能已经听你说过很多次了。但我真的、觉得很高兴哦」"
      recall: "定译源 voices/ayano_real.md 例句2；「谢谢＋理由」是她全篇复现的道谢套语基准句。"
    - id: 6589
