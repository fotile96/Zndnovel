# skeleton/cards.jp/batch_08.yaml — 卡面日文转写 batch 08（card 160–179）
# 来源：png/card/crd_<N>_a.png 逐字转写（规程 A）。
# 字段：card(int) / variant("a"|"d") / title_jp / section_label / body_jp / note
# 约定：
#   - 卡面上的换行处以 \n 记录（双引号标量，\n 为换行转义）。
#   - section_label 为右栏全部文字；右栏上下两个标签槽位之间以 \n 相连
#     （如 "セクション4\nあらすじ"）。
#   - 右栏标签「セクション4」「セクション5」的数字为半角字形；卡 162 右栏首
#     槽位「セクションEX2」的「EX2」为半角且在卡面上折行（见该条 note）。
#   - 标题中的「：」及数字（卡 174「４」、178「５」、179「９」「１」「３」）
#     为全角，卡 174/178 正文中的「４」「２」「５」亦为全角（与 snr_common.lua
#     plotTitle 一致）。
#   - 卡 165/171/175 末行「（おわり）」「（完結）」前的空白按 12 全角字格/行
#     的像素栅格判定为全角空格（　），个数见各条 note。
- card: 160
  variant: "a"
  title_jp: "下らない、と思った"
  section_label: "セクション4\nあらすじ"
  body_jp: "少女の言葉を下らないな、\nと思うと、少女はユウイチ\nの心を読んでいるかのよう\nに返事を返す。"
  note: ""
- card: 161
  variant: "a"
  title_jp: "信じてみてもいい"
  section_label: "セクション4\nあらすじ"
  body_jp: "少女の言葉を信じてもいい\nと思うと、少女は「たぶん\nアヤノさんも夕日のこと、\n信じてるよ」と答えた。"
  note: ""
- card: 162
  variant: "a"
  title_jp: "セカンドノベル"
  section_label: "セクション\nEX2\nあらすじ"
  body_jp: "私たちの物語。"
  note: "右栏第一槽位「セクションEX2」在卡面上折为两行（「セクション」/「EX2」），故 section_label 含两个 \\n；「EX2」为半角字形。正文仅一行。"
- card: 163
  variant: "a"
  title_jp: "ひっくり返った机"
  section_label: "セクション4\nあらすじ"
  body_jp: "教室に戻ると、アヤノの机\nが荒らされていた。アヤノ\nに何が……。"
  note: ""
- card: 164
  variant: "a"
  title_jp: "選択：アヤノの机"
  section_label: "セクション4\n選択肢"
  body_jp: "「机を調べる」\n「アヤノを捜す」\nの展開があり。"
  note: ""
- card: 165
  variant: "a"
  title_jp: "屋上の人影"
  section_label: "セクション4\nあらすじ"
  body_jp: "アヤノを捜さないと、とユ\nウイチは教室を飛び出す。\nその時、廊下の窓から屋上\nにアヤノが居ることを発見\nする。アヤノは、そのまま\n下へ……　　　（おわり）"
  note: "末行「下へ……」与「（おわり）」之间为 3 个全角空格（末行恰满 12 全角，「（おわり）」右齐行末，像素栅格测定）。"
- card: 166
  variant: "a"
  title_jp: "アヤノの机を調べる"
  section_label: "セクション4\nあらすじ"
  body_jp: "アヤノの机を調べると、鞄\nから大学ノートが飛び出て\nいるのを見つけた。"
  note: "首行末字「鞄」在低分辨率下字形致密：据放大轮廓（左「革」致密、右「包」末笔右下钩）并比对对应脚本 snr_s4_10_s.lua「鞄の口が開いていた。そこからピンク色の大学ノートが半分出ている。」判定，非推测补全。"
- card: 167
  variant: "a"
  title_jp: "選択：アヤノのノート"
  section_label: "セクション4\n選択肢"
  body_jp: "メモに興味を持ち、屋上に\n行くと少女の姿。突如少女\nが消え、首を捻りながら教\n室に戻ると、アヤノの机が\n荒らされていた。ここは\n「ノートを調べる」\n「アヤノを捜す」展開あり"
  note: "末行「展開あり」后无句号，正文即止于此（末行恰满 12 全角）；与他卡「の展開があり。」句式不同，卡面原文如此。"
- card: 168
  variant: "a"
  title_jp: "ノートに書かれた名前"
  section_label: "セクション4\nあらすじ"
  body_jp: "ユウイチはアヤノの机を調\nべる途中、手を切ってしま\nう。消しゴムには「ユウイ\nチ」。ノートにはコックリ\nさんの痕跡と、「ユキ」と\nいう文字が書かれていた。"
  note: ""
- card: 169
  variant: "a"
  title_jp: "探索：アヤノの居場所"
  section_label: "セクション4\n選択肢"
  body_jp: "ユウイチはアヤノを捜し回\nる。屋上に、アヤノの姿が\n見えた。"
  note: ""
- card: 170
  variant: "a"
  title_jp: "選択：アヤノを――"
  section_label: "セクション4\n選択肢"
  body_jp: "「腕をつかむ」\n「引き戻す」…………\nの展開があり。"
  note: "标题末尾为两个全角横线「――」（与 plotTitle[170] 同形）。第 2 行「引き戻す」后紧接 4 个省略号字符「…」（共 12 点，按像素逐点计数），其后无其他文字。"
- card: 171
  variant: "a"
  title_jp: "腕をつかむ"
  section_label: "セクション4\nあらすじ"
  body_jp: "ユウイチはアヤノの腕をつ\nかむ。強く身をよじられた\nユウイチは、バランスを崩\nし、下へ……　（おわり）"
  note: "末行「下へ……」与「（おわり）」之间为 1 个全角空格（末行恰满 12 全角，「（おわり）」右齐行末，像素栅格测定）。"
- card: 172
  variant: "a"
  title_jp: "アヤノは意識を取り戻す"
  section_label: "セクション4\nあらすじ"
  body_jp: "ユウイチはアヤノを引き戻\nし、アヤノの意識が戻る。\nサクラとアヤノは「不思議\nな体験」をしたと思う。二\n人は教室に戻った。"
  note: ""
- card: 173
  variant: "a"
  title_jp: "選択：放課後の学校"
  section_label: "セクション4\n選択肢"
  body_jp: "「サクラを待つ」\n「家に帰る」\nの展開があり。"
  note: ""
- card: 174
  variant: "a"
  title_jp: "セクション４：アヤノ"
  section_label: "セクション4\nあらすじ"
  body_jp: "セクション４、２番目の主\n人公は「アヤノ」"
  note: "标题与正文中的「４」「２」「：」为全角；右栏标签「セクション4」的「4」为半角。正文「アヤノ」后无句号。"
- card: 175
  variant: "a"
  title_jp: "サクラを待つ"
  section_label: "セクション4\nあらすじ"
  body_jp: "教室でサクラを待つが、結\n局見つからない。ユウイチ\nは何かを思い出したように\n教室を出る。後を追ったア\nヤノは、ユウイチとサクラ\nが屋上から飛び降りるのを\n目撃する……　　（完結）"
  note: "末行「目撃する……」与「（完結）」之间为 2 个全角空格（末行恰满 12 全角，「（完結）」右齐行末，像素栅格测定）。结尾标记为「（完結）」而非「（おわり）」。"
- card: 176
  variant: "a"
  title_jp: "消えたサクラ"
  section_label: "セクション4\nあらすじ"
  body_jp: "サクラの姿は消えた。今で\nもたまに、二人で屋上に行\nく。そこに、真実が見える\nんじゃないかって（完結）"
  note: "「（完結）」紧接「かって」之后，其间无空格；其后无句号，正文即止于此。"
- card: 177
  variant: "a"
  title_jp: "サクラさん"
  section_label: "セクション5\nあらすじ"
  body_jp: "アヤノはサクラの名前を呼\nぶ。頭痛がすると話すと、\nサクラは心配そうにアヤノ\nに話し掛ける。"
  note: ""
- card: 178
  variant: "a"
  title_jp: "セクション５：サクラ"
  section_label: "セクション5\nあらすじ"
  body_jp: "セクション５の主人公は\n「サクラ」"
  note: "标题与正文中的「５」「：」为全角；右栏标签「セクション5」的「5」为半角。正文「サクラ」后无句号。"
- card: 179
  variant: "a"
  title_jp: "サクラの日記：９月１３日"
  section_label: "セクション5\n日記"
  body_jp: "中庭で、アヤノさんと私は\n出会う……そんなお話。物\n語の私は、アヤノさんに中\n庭のウワサについて聞いて\nみました。"
  note: "标题中「：」「９」「１」「３」为全角。右栏第二槽位为「日記」（非「あらすじ」）。"
