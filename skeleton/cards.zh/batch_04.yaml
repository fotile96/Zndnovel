# skeleton/cards.zh/batch_04.yaml — 中文卡组 batch 04（card 160–195 + 编外 200）
# 来源：skeleton/cards.jp.yaml 同号条目中译（规程 B）；术语/人名依 glossary/glossary.v4.yaml 与 glossary/style.md（v4 召回修订已落于本批）。
# 字段：card(int) / variant("a") / title_zh / body_zh / tr_note
# 承 batch_00 全部既定式：body 每行 ≤12 全角宽（\n 断行，中文重排不跟随日文断行点）、title ≤14 全角宽；
#   （おわり）→（完）、（完結）→（完结），末行标记右齐时垫空格数按中文行宽重算（原卡未右齐则不垫）；
#   选项行独立成行并保留「」，「の展開があり。」→「有以上分支展开。」。
# 本批特例：
#   - 日记卡 179–191：标题式「サクラ的日记：9月13日」「アヤノ的回信：10月30日」，日期用半角数字
#     （与卡 10「章节 1」同口径）；正文为日记摘句体，贴少女书信口吻；卡 190 全平假名稚拙体以
#     稚拙短语、错位标点、动词悬空再现；卡 188 起平假名渐多的病中笔迹以用词渐趋素朴过渡。
#   - 故事层人名片假名原样（アヤノ/ユウイチ/サクラ/ユキ）；セクション→章节；セカンドノベル→第二物语。
#   - ノート→笔记本（与现实层 手帳→笔记 分立防混）；腕→手臂（「手腕」预留给现实层「手首をつかむ」伏笔句）。
# v19 修订（2026-08-19）：故事层人名罗马音化（Ayano/Yuichi/Yukari/Sakura…）+ 天文馆→天象馆已落于 title_zh/body_zh；tr_note 保持历史原文。涉名流式 body 经 tools/zh_wrap（jieba）重排（宽 12 全角），结构卡逐行替换保结构。
# v22 修订（2026-09-08）：卡 193「那孩子→那个女孩」随あの子＝Sakura 族；body 换行＝tools.bake_card.plan_body 输出（v21 口径）。

- card: 160
  variant: "a"
  title_zh: "觉得真无聊"
  body_zh: "刚觉得少女的话真无聊，\n少女便像是读到了Yuichi\n的心思似的，作出回应。"
  tr_note: "「くだらない」统一作「真无聊」，供他批卡 159 选项对齐；少女依原卡不点名。"
- card: 161
  variant: "a"
  title_zh: "试着相信也无妨"
  body_zh: "刚觉得少女的话，相信\n也无妨，少女便回了一句\n「夕阳的事，Ayano同学\n大概也是相信的哦」。"
  tr_note: "「信じてもいい」统一作「相信也无妨」，供他批卡 159 选项对齐（标题多出的「みて」以「试着」承接）；引语内アヤノさん→アヤノ同学；「夕阳的事」前置以存原文「夕日のこと、」的停顿；夕日→夕阳，与「夕焼け→晚霞」分立。"
- card: 162
  variant: "a"
  title_zh: "第二物语"
  body_zh: "我们的故事。"
  tr_note: "标题依 glossary v2「セカンドノベル→第二物语」（用户裁决）；正文与编外卡 200 同句同译；右栏「セクションEX2」标签折行属图片轨。"
- card: 163
  variant: "a"
  title_zh: "翻倒的课桌"
  body_zh: "回到教室，发现\nAyano的课桌被翻得\n乱七八糟。Ayano究竟\n出了什么事……。"
  tr_note: "「アヤノに何が……。」句末悬垂保留「……。」。"
- card: 164
  variant: "a"
  title_zh: "选择：Ayano的课桌"
  body_zh: "「查看课桌」\n「寻找Ayano」\n有以上分支展开。"
  tr_note: "两选项分别与卡 166 标题、卡 169 系动向呼应；「寻找アヤノ」与卡 167 选项同文。"
- card: 165
  variant: "a"
  title_zh: "天台的人影"
  body_zh: "必须去找Ayano——Yuichi\n冲出教室。这时，透过走廊\n的窗户，他发现Ayano正在\n天台上。Ayano，就这样朝\n下方……　　　　（完）"
  tr_note: "「そのまま下へ……」→「就这样朝下方……」（与他批卡 157 同句宜同译）；末行「（完）」右齐行末，中文重排后垫 4 全角空格（日文卡垫 3）。"
- card: 166
  variant: "a"
  title_zh: "查看Ayano的课桌"
  body_zh: "查看Ayano的课桌，\n发现有一本笔记本\n从书包里露了出来。"
  tr_note: "「大学ノート」省译为「笔记本」（开本信息中文无对应惯用词）；ノート→笔记本与现实层手帳→笔记分立。"
- card: 167
  variant: "a"
  title_zh: "选择：Ayano的笔记本"
  body_zh: "对字条起了兴趣，去到天台\n后，看到少女的身影。少女\n突然消失，满腹疑惑地回到\n教室，却发现Ayano的课桌\n被翻得乱七八糟。此处有\n「查看笔记本」\n「寻找Ayano」的展开"
  tr_note: "メモ→字条（供他批卡 152–155 对齐）；本卡结句原文即为「展開あり」且无句号（非标准「の展開があり。」式），中文以「的展开」收束、不加句号；选项行依批例独立成行。"
- card: 168
  variant: "a"
  title_zh: "写在笔记本上的名字"
  body_zh: "Yuichi在查看Ayano课桌\n的途中划伤了手。橡皮上\n刻着「Yuichi」。笔记本\n上留有钱仙的痕迹，还\n写着「ユキ」的字样。"
  tr_note: "「ユキ」保留片假名不译：雪／往（逝）多关语兼后文伏笔的载体，依 v2 故事层假名方针；コックリさん→钱仙、消しゴム→橡皮承 batch_00。"
- card: 169
  variant: "a"
  title_zh: "探索：Ayano的下落"
  body_zh: "Yuichi四处寻找\nAyano。天台上，\n看到了Ayano的身影。"
  tr_note: ""
- card: 170
  variant: "a"
  title_zh: "选择：将Ayano――"
  body_zh: "「抓住手臂」\n「拉回来」…………\n有以上分支展开。"
  tr_note: "标题末双横线依原卡保留（悬置的宾语句）；「腕」译「手臂」而非「手腕」——「手腕」预留给现实层「手首をつかむ」伏笔句（序章/终章呼应），两词分立；第 2 行 4 个省略号字符依原卡照录。"
- card: 171
  variant: "a"
  title_zh: "抓住手臂"
  body_zh: "Yuichi一把抓住Ayano\n的手臂。被她用力\n一挣，失去平衡，\n朝下方……　（完）"
  tr_note: "「腕→手臂」同卡 170；末行「（完）」右齐行末垫 1 全角空格（中文行宽重算后恰与日文卡同为 1 格）。"
- card: 172
  variant: "a"
  title_zh: "Ayano恢复意识"
  body_zh: "Yuichi将Ayano拉回来，\nAyano恢复了意识。Sakura\n和Ayano像是经历了一场\n「不可思议的体验」。\n两人回到了教室。"
  tr_note: "原文「サクラとアヤノは『不思議な体験』をしたと思う」思考主体含糊（对照 s4s 正文实为ユウイチ的推想），译文以「像是经历了」保持含糊、不点破；「引き戻す→拉回来」与卡 170 选项同词。"
- card: 173
  variant: "a"
  title_zh: "选择：放学后的学校"
  body_zh: "「等Sakura」\n「回家」\n有以上分支展开。"
  tr_note: "「回家」与卡 18 选项同译；「等サクラ」与卡 175 标题一致。"
- card: 174
  variant: "a"
  title_zh: "章节 4：Ayano"
  body_zh: "章节 4，第2位主人公是\n「Ayano」"
  tr_note: "「セクション４：アヤノ」承卡 10 口径：「章节」＋半角数字＋全角冒号；正文「２番目」亦转半角「第2位」以求行内数字体例一致（原卡为全角，请裁决）；「アヤノ」后无句号依原卡。"
- card: 175
  variant: "a"
  title_zh: "等Sakura"
  body_zh: "在教室等Sakura，最终\n没能找到。Yuichi像是\n想起什么，走出教室。\n追出去的Ayano，目击\nYuichi和Sakura从\n天台跳下……（完结）"
  tr_note: "结尾标记（完結）→（完结）两制保留；中文重排后末行恰排满 12 字宽、无垫空格（日文卡垫 2 格）。"
- card: 176
  variant: "a"
  title_zh: "消失的Sakura"
  body_zh: "Sakura的身影消失不见\n了。如今两人偶尔还会\n去天台。因为总觉得，\n在那里，说不定就能\n看得见真实（完结）"
  tr_note: "「真実」译「真实」以呼应书名『True Color』的真意母题（备选「真相」，请裁决）；「（完结）」紧接正文无空格依原卡，重排后恰右齐行末；句末「って」的口语悬垂以「因为总觉得……」无句号收束再现。"
- card: 177
  variant: "a"
  title_zh: "Sakura同学"
