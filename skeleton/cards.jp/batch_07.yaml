  title_jp: "探索：アヤノに何が？"
  section_label: "セクション4\nあらすじ"
  body_jp: "アヤノを捜し回ってみるが\n見つける事が出来ない"
  note: "正文末尾「出来ない」后无句号，正文即止于此。首行用字为「捜し回って」（提手旁「捜」，经放大与「探」字形逐像素比对确认；游戏对白脚本中同场景作「探し回って」，此处以卡面字形为准）。"
