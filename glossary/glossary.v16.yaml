conventions:
  why_nothing_enters_active_json: >
    本版六条裁定**一条也没进 `active.json`**，这不是疏漏。`check_batch.W2` 做的是
    `term in jp and tr not in zh` 的**单值字面比对**，而本版每一条要么是**条件分治**
    （作成 / スピーカー），要么正解本身就不含该字面（全ての間違い → 「一切的根本错误」），
    要么会命中冻结骨架串（両思いになるオマジナイ）。登记裸键的结果是对自己的正解恒定
    误报——v13 处理 `違和感`/`交流` 时已经立过这个判据，本版照办。
    分治口径的正式落脚点是 `style.md`「按义二分词」节（它随 context 到执行通道手上），
    `glossary.vN.yaml` 本身不注入 prompt。

